      (() => {
        const STORAGE_KEY = "ovi-assist-language";
        const COOKIE_KEY = "ovi-assist-language";
        const ALLOWED = ["en", "ja", "es"];
        const normalizeLanguage = (value) => {
          const language = String(value || "").trim().toLowerCase();
          return ALLOWED.includes(language) ? language : "en";
        };
        const readCookieLanguage = () => {
          const match = document.cookie.match(new RegExp(`(?:^|; )${COOKIE_KEY}=([^;]+)`));
          if (!match) return "";
          try {
            return normalizeLanguage(decodeURIComponent(match[1]));
          } catch (_err) {
            return normalizeLanguage(match[1]);
          }
        };
        const detectAssistLanguage = () => {
          return "en";
        };

        let language = "en";
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          language = saved ? normalizeLanguage(saved) : (readCookieLanguage() || detectAssistLanguage());
        } catch (_err) {
          language = readCookieLanguage() || detectAssistLanguage();
        }

        document.documentElement.dataset.assistLanguage = language;
      })();

uot;],&quot;nextTitle&quot;:[0,&quot;Why is it risky to call a living composer a legend too quickly?&quot;],&quot;nextPhase&quot;:[0,&quot;check&quot;],&quot;sameTypePreviousKey&quot;:[0,&quot;&quot;],&quot;sameTypeNextKey&quot;:[0,&quot;authored_reading_section_2&quot;],&quot;connectionLabel&quot;:[0,&quot;opening -&gt; meaning -&gt; check&quot;]}],[0,{&quot;key&quot;:[0,&quot;authored_reading_check_1&quot;],&quot;blockId&quot;:[0,&quot;authored_reading_check_1&quot;],&quot;type&quot;:[0,&quot;micro_quiz&quot;],&quot;typeIndex&quot;:[0,0],&quot;index&quot;:[0,3],&quot;title&quot;:[0,&quot;Why is it risky to call a living composer a legend too quickly?&quot;],&quot;preview&quot;:[0,&quot;Why is it risky to call a living composer a legend too quickly?&quot;],&quot;family&quot;:[0,&quot;practice&quot;],&quot;role&quot;:[0,&quot;understanding-check&quot;],&quot;actionPattern&quot;:[0,&quot;reveal-answer&quot;],&quot;phase&quot;:[0,&quot;check&quot;],&quot;style&quot;:[0,&quot;&quot;],&quot;anchor&quot;:[0,&quot;&quot;],&quot;selectorKind&quot;:[0,&quot;blockId&quot;],&quot;sourcePath&quot;:[0,&quot;lessonBlocks[3].blockId&quot;],&quot;previousKey&quot;:[0,&quot;authored_reading_section_1&quot;],&quot;previousTitle&quot;:[0,&quot;Introduction&quot;],&quot;previousPhase&quot;:[0,&quot;meaning&quot;],&quot;nextKey&quot;:[0,&quot;authored_reading_section_2&quot;],&quot;nextTitle&quot;:[0,&quot;1. Legacy Is Not the Same as Popularity&quot;],&quot;nextPhase&quot;:[0,&quot;meaning&quot;],&quot;sameTypePreviousKey&quot;:[0,&quot;&quot;],&quot;sameTypeNextKey&quot;:[0,&quot;authored_reading_check_2&quot;],&quot;connectionLabel&quot;:[0,&quot;meaning -&gt; check -&gt; meaning&quot;]}],[0,{&quot;key&quot;:[0,&quot;authored_reading_section_2&quot;],&quot;blockId&quot;:[0,&quot;authored_reading_section_2&quot;],&quot;type&quot;:[0,&quot;authored_context&quot;],&quot;typeIndex&quot;:[0,1],&quot;index&quot;:[0,4],&quot;title&quot;:[0,&quot;1. Legacy Is Not the Same as Popularity&quot;],&quot;preview&quot;:[0,&quot;Popularity means many people know a name now. Legacy means a work keeps returning to listeners, performers, teachers, and other artists over time. The two can overlap, but they are not identical. For example, a film score can become famous quickly because millions of people watch the film. That does not automatically make the composer historically important. But if the score changes how other composers think about sound, tension, or silence, then it may become part of a longer musical conversation. The same is true in concert music. A composer may not be a household name, but their work may be played by major orchestras, studied by young composers, recorded by serious labels, and discussed by critics. That can be a stronger legacy signal than one viral moment. A useful test is this: Can people explain what the composer changed? If the answer is only \&quot;they are famous,\&quot; the evidence is thin. If the answer includes sound, form, influence, performance history, and artistic risk, the evidence is stronger.&quot;],&quot;family&quot;:[0,&quot;forward&quot;],&quot;role&quot;:[0,&quot;forward-context&quot;],&quot;actionPattern&quot;:[0,&quot;read&quot;],&quot;phase&quot;:[0,&quot;meaning&quot;],&quot;style&quot;:[0,&quot;&quot;],&quot;anchor&quot;:[0,&quot;&quot;],&quot;selectorKind&quot;:[0,&quot;blockId&quot;],&quot;sourcePath&quot;:[0,&quot;lessonBlocks[4].blockId&quot;],&quot;previousKey&quot;:[0,&quot;authored_reading_check_1&quot;],&quot;previousTitle&quot;:[0,&quot;Why is it risky to call a living composer a legend too quickly?&quot;],&quot;previousPhase&quot;:[0,&quot;check&quot;],&quot;nextKey&quot;:[0,&quot;authored_reading_check_2&quot;],&quot;nextTitle&quot;:[0,&quot;What is the difference between popularity and legacy?&quot;],&quot;nextPhase&quot;:[0,&quot;check&quot;],&quot;sameTypePreviousKey&quot;:[0,&quot;authored_reading_section_1&quot;],&quot;sameTypeNextKey&quot;:[0,&quot;authored_reading_section_3&quot;],&quot;connectionLabel&quot;:[0,&quot;check -&gt; meaning -&gt; check&quot;]}],[0,{&quot;key&quot;:[0,&quot;authored_reading_check_2&quot;],&quot;blockId&quot;:[0,&quot;authored_reading_check_2&quot;],&quot;type&quot;:[0,&quot;micro_quiz&quot;],&quot;typeIndex&quot;:[0,1],&quot;index&quot;:[0,5],&quot;title&quot;:[0,&quot;What is the difference between popularity and legacy?&quot;],&quot;preview&quot;:[0,&quot;What is the difference between popularity and legacy?&quot;],&quot;family&quot;:[0,&quot;practice&quot;],&quot;role&quot;:[0,&quot;understanding-check&quot;],&quot;actionPattern&quot;:[0,&quot;reveal-answer&quot;],&quot;phase&quot;:[0,&quot;check&quot;],&quot;style&quot;:[0,&quot;&quot;],&quot;anchor&quot;:[0,&quot;&quot;],&quot;selectorKind&quot;:[0,&quot;blockId&quot;],&quot;sourcePath&quot;:[0,&quot;lessonBlocks[5].blockId&quot;],&quot;previousKey&quot;:[0,&quot;authored_reading_section_2&quot;],&quot;previousTitle&quot;:[0,&quot;1. Legacy Is Not the Same as Popularity&quot;],&quot;previousPhase&quot;:[0,&quot;meaning&quot;],&quot;nextKey&quot;:[0,&quot;authored_reading_section_3&quot;],&quot;nextTitle&quot;:[0,&quot;2. A Distinct Sound World: Unsuk Chin and Anna Thorvaldsdottir&quot;],&quot;nextPhase&quot;:[0,&quot;meaning&quot;],&quot;sameTypePreviousKey&quot;:[0,&quot;authored_reading_check_1&quot;],&quot;sameTypeNextKey&quot;:[0,&quot;authored_reading_check_3&quot;],&quot;connectionLabel&quot;:[0,&quot;meaning -&gt; check -&gt; meaning&quot;]}],[0,{&quot;key&quot;:[0,&quot;authored_reading_section_3&quot;],&quot;blockId&quot;:[0,&quot;authored_reading_section_3&quot;],&quot;type&quot;:[0,&quot;authored_context&quot;],&quot;typeIndex&quot;:[0,2],&quot;index&quot;:[0,6],&quot;title&quot;:[0,&quot;2. A Distinct Sound World: Unsuk Chin and Anna Thorvaldsdottir&quot;],&quot;preview&quot;:[0,&quot;One strong sign of legacy is a sound world. A sound world is the musical atmosphere a composer builds: the colors, textures, energy, and sense of movement that make the music feel like their own. Unsuk Chin is a good example. She was born in Seoul, studied with Gyorgy Ligeti, and has lived in Berlin for many years. Her music is modern, but it is not cold. It can be brilliant, playful, precise, and strange in a controlled way. The evidence is not just praise. Her Violin Concerto won the 2004 Grawemeyer Award, and major orchestras and conductors have performed her work internationally. Anna Thorvaldsdottir offers a different model. Her music often feels like a large landscape slowly changing. Instead of quick melody first, she often builds long textures, deep quiet, pressure, and release. The New York Philharmonic commissioned and premiered METACOSMOS in 2018, and her music has been performed by major orchestras including the Berlin Philharmonic and Los Angeles Philharmonic. These two composers show that legacy is not one style. Chin may impress listeners through sharp imagination and orchestral detail. Thorvaldsdottir may impress them through scale, atmosphere, and time. Both teach us that a composer can become important by giving listeners a new way to hear.&quot;],&quot;family&quot;:[0,&quot;forward&quot;],&quot;role&quot;:[0,&quot;forward-context&quot;],&quot;actionPattern&quot;:[0,&quot;read&quot;],&quot;phase&quot;:[0,&quot;meaning&quot;],&quot;style&quot;:[0,&quot;&quot;],&quot;anchor&quot;:[0,&quot;&quot;],&quot;selectorKind&quot;:[0,&quot;blockId&quot;],&quot;sourcePath&quot;:[0,&quot;lessonBlocks[6].blockId&quot;],&quot;previousKey&quot;:[0,&quot;authored_reading_check_2&quot;],&quot;previousTitle&quot;:[0,&quot;What is the difference between popularity and legacy?&quot;],&quot;previousPhase&quot;:[0,&quot;check&quot;],&quot;nextKey&quot;:[0,&quot;authored_reading_check_3&quot;],&quot;nextTitle&quot;:[0,&quot;What does \&quot;sound world\&quot; mean in this lesson?&quot;],&quot;nextPhase&quot;:[0,&quot;check&quot;],&quot;sameTypePreviousKey&quot;:[0,&quot;authored_reading_section_2&quot;],&quot;sameTypeNextKey&quot;:[0,&quot;authored_reading_section_4&quot;],&quot;connectionLabel&quot;:[0,&quot;check -&gt; meaning -&gt; check&quot;]}],[0,{&quot;key&quot;:[0,&quot;authored_reading_check_3&quot;],&quot;blockId&quot;:[0,&quot;authored_reading_check_3&quot;],&quot;type&quot;:[0,&quot;micro_quiz&quot;],&quot;typeIndex&quot;:[0,2],&quot;index&quot;:[0,7],&quot;title&quot;:[0,&quot;What does \&quot;sound world\&quot; mean in this lesson?&quot;],&quot;preview&quot;:[0,&quot;What does \&quot;sound world\&quot; mean in this lesson?&quot;],&quot;family&quot;:[0,&quot;practice&quot;],&quot;role&quot;:[0,&quot;understanding-check&quot;],&quot;actionPattern&quot;:[0,&quot;reveal-answer&quot;],&quot;phase&quot;:[0,&quot;check&quot;],&quot;style&quot;:[0,&quot;&quot;],&quot;anchor&quot;:[0,&quot;&quot;],&quot;selectorKind&quot;:[0,&quot;blockId&quot;],&quot;sourcePath&quot;:[0,&quot;lessonBlocks[7].blockId&quot;],&quot;previousKey&quot;:[0,&quot;authored_reading_section_3&quot;],&quot;previousTitle&quot;:[0,&quot;2. A Distinct Sound World: Unsuk Chin and Anna Thorvaldsdottir&quot;],&quot;previousPhase&quot;:[0,&quot;meaning&quot;],&quot;nextKey&quot;:[0,&quot;authored_reading_section_4&quot;],&quot;nextTitle&quot;:[0,&quot;3. Big Forms and Big Stages: Thomas Ades and Missy Mazzoli&quot;],&quot;nextPhase&quot;:[0,&quot;meaning&quot;],&quot;sameTypePreviousKey&quot;:[0,&quot;authored_reading_check_2&quot;],&quot;sameTypeNextKey&quot;:[0,&quot;authored_reading_check_4&quot;],&quot;connectionLabel&quot;:[0,&quot;meaning -&gt; check -&gt; meaning&quot;]}],[0,{&quot;key&quot;:[0,&quot;authored_reading_section_4&quot;],&quot;blockId&quot;:[0,&quot;authored_reading_section_4&quot;],&quot;type&quot;:[0,&quot;authored_context&quot;],&quot;typeIndex&quot;:[0,3],&quot;index&quot;:[0,8],&quot;title&quot;:[0,&quot;3. Big Forms and Big Stages: Thomas Ades and Missy Mazzoli&quot;],&quot;preview&quot;:[0,&quot;Another legacy signal is the ability to build large forms. A short beautiful piece can matter, but opera, ballet, concerto, and large orchestra works test a composer in a different way. They require structure, pacing, drama, and control across a long time. Thomas Ades has strong evidence here. His operas include The Tempest and The Exterminating Angel, and these works have reached major houses such as the Metropolitan Opera, the Royal Opera House, La Scala, and the Paris Opera. He is also a conductor and pianist, so his career connects writing, performing, and leading. His ballet score Dante, recorded by Gustavo Dudamel and the Los Angeles Philharmonic, won a Grammy for Best Orchestral Performance in 2024. Missy Mazzoli shows another kind of stage power. She writes orchestral, chamber, and operatic music, and her biography points to major commissions, residencies, and opera work. Her work with Luna Composition Lab also matters because legacy is not only what one person writes. It is also what they help the next generation believe is possible. The lesson here is not that big institutions are always right. Institutions can be slow, biased, and political. But when serious performers and houses keep returning to a composer, that is evidence worth noticing.&quot;],&quot;family&quot;:[0,&quot;forward&quot;],&quot;role&quot;:[0,&quot;forward-context&quot;],&quot;actionPattern&quot;:[0,&quot;read&quot;],&quot;phase&quot;:[0,&quot;meaning&quot;],&quot;style&quot;:[0,&quot;&quot;],&quot;anchor&quot;:[0,&quot;&quot;],&quot;selectorKind&quot;:[0,&quot;blockId&quot;],&quot;sourcePath&quot;:[0,&quot;lessonBlocks[8].blockId&quot;],&quot;previousKey&quot;:[0,&quot;authored_reading_check_3&quot;],&quot;previousTitle&quot;:[0,&quot;What does \&quot;sound world\&quot; mean in this lesson?&quot;],&quot;previousPhase&quot;:[0,&quot;check&quot;],&quot;nextKey&quot;:[0,&quot;authored_reading_check_4&quot;],&quot;nextTitle&quot;:[0,&quot;Why do large forms like opera and ballet matter for legacy?&quot;],&quot;nextPhase&quot;:[0,&quot;check&quot;],&quot;sameTypePreviousKey&quot;:[0,&quot;authored_reading_section_3&quot;],&quot;sameTypeNextKey&quot;:[0,&quot;authored_reading_section_5&quot;],&quot;connectionLabel&quot;:[0,&quot;check -&gt; meaning -&gt; check&quot;]}],[0,{&quot;key&quot;:[0,&quot;authored_reading_check_4&quot;],&quot;blockId&quot;:[0,&quot;authored_reading_check_4&quot;],&quot;type&quot;:[0,&quot;micro_quiz&quot;],&quot;typeIndex&quot;:[0,3],&quot;index&quot;:[0,9],&quot;title&quot;:[0,&quot;Why do large forms like opera and ballet matter for legacy?&quot;],&quot;preview&quot;:[0,&quot;Why do large forms like opera and ballet matter for legacy?&quot;],&quot;family&quot;:[0,&quot;practice&quot;],&quot;role&quot;:[0,&quot;understanding-check&quot;],&quot;actionPattern&quot;:[0,&quot;reveal-answer&quot;],&quot;phase&quot;:[0,&quot;check&quot;],&quot;style&quot;:[0,&quot;&quot;],&quot;anchor&quot;:[0,&quot;&quot;],&quot;selectorKind&quot;:[0,&quot;blockId&quot;],&quot;sourcePath&quot;:[0,&quot;lessonBlocks[9].blockId&quot;],&quot;previousKey&quot;:[0,&quot;authored_reading_section_4&quot;],&quot;previousTitle&quot;:[0,&quot;3. Big Forms and Big Stages: Thomas Ades and Missy Mazzoli&quot;],&quot;previousPhase&quot;:[0,&quot;meaning&quot;],&quot;nextKey&quot;:[0,&quot;authored_reading_section_5&quot;],&quot;nextTitle&quot;:[0,&quot;4. Cultural Reach: Hildur Gudnadottir, Gabriela Ortiz, and Jessie Montgomery&quot;],&quot;nextPhase&quot;:[0,&quot;meaning&quot;],&quot;sameTypePreviousKey&quot;:[0,&quot;authored_reading_check_3&quot;],&quot;sameTypeNextKey&quot;:[0,&quot;authored_reading_check_5&quot;],&quot;connectionLabel&quot;:[0,&quot;meaning -&gt; check -&gt; meaning&quot;]}],[0,{&quot;key&quot;:[0,&quot;authored_reading_section_5&quot;],&quot;blockId&quot;:[0,&quot;authored_reading_section_5&quot;],&quot;type&quot;:[0,&quot;authored_context&quot;],&quot;typeIndex&quot;:[0,4],&quot;index&quot;:[0,10],&quot;title&quot;:[0,&quot;4. Cultural Reach: Hildur Gudnadottir, Gabriela Ortiz, and Jessie Montgomery&quot;],&quot;preview&quot;:[0,&quot;Some composers build legacy by reaching outside a narrow concert world. This does not mean making music simple. It means connecting serious musical thinking with the wider culture. Hildur Gudnadottir is known to many people through film and television. Her score for Joker won an Academy Award, and her work on Chernobyl brought Emmy and Grammy recognition. Her background as a cellist is important because her scores often feel physical. Sound is not just decoration; it can become pressure, fear, memory, and space. Gabriela Ortiz shows cultural reach through rhythm, color, and public themes. Recent Grammy records show wins for Revolucion Diamantina, Dzonot, and Yanga. Those awards are not proof of immortality, but they show strong current momentum. More importantly, her orchestral music brings Mexican musical energy and contemporary classical craft into major international performance spaces. Jessie Montgomery is another important example. Her work mixes classical writing with vernacular music, improvisation, poetry, and social consciousness. The Chicago Symphony Orchestra identifies her as a former Mead Composer-in-Residence, and her Rounds won the 2024 Grammy for Best Contemporary Classical Composition. Her music suggests that American classical music can be serious while still speaking to living communities. These composers remind us that \&quot;classical\&quot; is not frozen. A living tradition must absorb film, politics, place, technology, memory, and public emotion without losing craft.&quot;],&quot;family&quot;:[0,&quot;forward&quot;],&quot;role&quot;:[0,&quot;forward-context&quot;],&quot;actionPattern&quot;:[0,&quot;read&quot;],&quot;phase&quot;:[0,&quot;meaning&quot;],&quot;style&quot;:[0,&quot;&quot;],&quot;anchor&quot;:[0,&quot;&quot;],&quot;selectorKind&quot;:[0,&quot;blockId&quot;],&quot;sourcePath&quot;:[0,&quot;lessonBlocks[10].blockId&quot;],&quot;previousKey&quot;:[0,&quot;authored_reading_check_4&quot;],&quot;previousTitle&quot;:[0,&quot;Why do large forms like opera and ballet matter for legacy?&quot;],&quot;previousPhase&quot;:[0,&quot;check&quot;],&quot;nextKey&quot;:[0,&quot;authored_reading_check_5&quot;],&quot;nextTitle&quot;:[0,&quot;What does cultural reach mean here?&quot;],&quot;nextPhase&quot;:[0,&quot;check&quot;],&quot;sameTypePreviousKey&quot;:[0,&quot;authored_reading_section_4&quot;],&quot;sameTypeNextKey&quot;:[0,&quot;authored_reading_section_6&quot;],&quot;connectionLabel&quot;:[0,&quot;check -&gt; meaning -&gt; check&quot;]}],[0,{&quot;key&quot;:[0,&quot;authored_reading_check_5&quot;],&quot;blockId&quot;:[0,&quot;authored_reading_check_5&quot;],&quot;type&quot;:[0,&quot;micro_quiz&quot;],&quot;typeIndex&quot;:[0,4],&quot;index&quot;:[0,11],&quot;title&quot;:[0,&quot;What does cultural reach mean here?&quot;],&quot;preview&quot;:[0,&quot;What does cultural reach mean here?&quot;],&quot;family&quot;:[0,&quot;practice&quot;],&quot;role&quot;:[0,&quot;understanding-check&quot;],&quot;actionPattern&quot;:[0,&quot;reveal-answer&quot;],&quot;phase&quot;:[0,&quot;check&quot;],&quot;style&quot;:[0,&quot;&quot;],&quot;anchor&quot;:[0,&quot;&quot;],&quot;selectorKind&quot;:[0,&quot;blockId&quot;],&quot;sourcePath&quot;:[0,&quot;lessonBlocks[11].blockId&quot;],&quot;previousKey&quot;:[0,&quot;authored_reading_section_5&quot;],&quot;previousTitle&quot;:[0,&quot;4. Cultural Reach: Hildur Gudnadottir, Gabriela Ortiz, and Jessie Montgomery&quot;],&quot;previousPhase&quot;:[0,&quot;meaning&quot;],&quot;nextKey&quot;:[0,&quot;authored_reading_section_6&quot;],&quot;nextTitle&quot;:[0,&quot;5. Collaboration and Curiosity: Caroline Shaw&quot;],&quot;nextPhase&quot;:[0,&quot;meaning&quot;],&quot;sameTypePreviousKey&quot;:[0,&quot;authored_reading_check_4&quot;],&quot;sameTypeNextKey&quot;:[0,&quot;authored_reading_check_6&quot;],&quot;connectionLabel&quot;:[0,&quot;meaning -&gt; check -&gt; meaning&quot;]}],[0,{&quot;key&quot;:[0,&quot;authored_reading_section_6&quot;],&quot;blockId&quot;:[0,&quot;authored_reading_section_6&quot;],&quot;type&quot;:[0,&quot;authored_context&quot;],&quot;typeIndex&quot;:[0,5],&quot;index&quot;:[0,12],&quot;title&quot;:[0,&quot;5. Collaboration and Curiosity: Caroline Shaw&quot;],&quot;preview&quot;:[0,&quot;Caroline Shaw is useful because she does not fit only one box. She is a composer, violinist, vocalist, and collaborator. Her Partita for 8 Voices won the 2013 Pulitzer Prize in Music. The Pulitzer description points to the unusual vocal world of the piece: speech, whispers, sighs, murmurs, melodies, and vocal effects. This matters because future legacy may not always look like the old model of one composer alone at a desk. Many living composers work across ensembles, recordings, installations, popular music, film, dance, and performance. Shaw&#39;s career shows curiosity as a serious artistic engine. Curiosity can be risky. If a composer changes direction too often, listeners may not feel a clear identity. But if curiosity keeps producing recognizable, teachable, performable work, it can become part of the identity itself. The deeper lesson is that a composer can be legendary not because every piece sounds the same, but because every piece asks a fresh question in a convincing voice.&quot;],&quot;family&quot;:[0,&quot;forward&quot;],&quot;role&quot;:[0,&quot;forward-context&quot;],&quot;actionPattern&quot;:[0,&quot;read&quot;],&quot;phase&quot;:[0,&quot;meaning&quot;],&quot;style&quot;:[0,&quot;&quot;],&quot;anchor&quot;:[0,&quot;&quot;],&quot;selectorKind&quot;:[0,&quot;blockId&quot;],&quot;sourcePath&quot;:[0,&quot;lessonBlocks[12].blockId&quot;],&quot;previousKey&quot;:[0,&quot;authored_reading_check_5&quot;],&quot;previousTitle&quot;:[0,&quot;What does cultural reach mean here?&quot;],&quot;previousPhase&quot;:[0,&quot;check&quot;],&quot;nextKey&quot;:[0,&quot;authored_reading_check_6&quot;],&quot;nextTitle&quot;:[0,&quot;Why is Caroline Shaw a useful example of modern legacy?&quot;],&quot;nextPhase&quot;:[0,&quot;check&quot;],&quot;sameTypePreviousKey&quot;:[0,&quot;authored_reading_section_5&quot;],&quot;sameTypeNextKey&quot;:[0,&quot;authored_reading_section_7&quot;],&quot;connectionLabel&quot;:[0,&quot;check -&gt; meaning -&gt; check&quot;]}],[0,{&quot;key&quot;:[0,&quot;authored_reading_check_6&quot;],&quot;blockId&quot;:[0,&quot;authored_reading_check_6&quot;],&quot;type&quot;:[0,&quot;micro_quiz&quot;],&quot;typeIndex&quot;:[0,5],&quot;index&quot;:[0,13],&quot;title&quot;:[0,&quot;Why is Caroline Shaw a useful example of modern legacy?&quot;],&quot;preview&quot;:[0,&quot;Why is Caroline Shaw a useful example of modern legacy?&quot;],&quot;family&quot;:[0,&quot;practice&quot;],&quot;role&quot;:[0,&quot;understanding-check&quot;],&quot;actionPattern&quot;:[0,&quot;reveal-answer&quot;],&quot;phase&quot;:[0,&quot;check&quot;],&quot;style&quot;:[0,&quot;&quot;],&quot;anchor&quot;:[0,&quot;&quot;],&quot;selectorKind&quot;:[0,&quot;blockId&quot;],&quot;sourcePath&quot;:[0,&quot;lessonBlocks[13].blockId&quot;],&quot;previousKey&quot;:[0,&quot;authored_reading_section_6&quot;],&quot;previousTitle&quot;:[0,&quot;5. Collaboration and Curiosity: Caroline Shaw&quot;],&quot;previousPhase&quot;:[0,&quot;meaning&quot;],&quot;nextKey&quot;:[0,&quot;authored_reading_section_7&quot;],&quot;nextTitle&quot;:[0,&quot;6. The Limits: History Is Not Fair or Finished&quot;],&quot;nextPhase&quot;:[0,&quot;meaning&quot;],&quot;sameTypePreviousKey&quot;:[0,&quot;authored_reading_check_5&quot;],&quot;sameTypeNextKey&quot;:[0,&quot;authored_reading_check_7&quot;],&quot;connectionLabel&quot;:[0,&quot;meaning -&gt; check -&gt; meaning&quot;]}],[0,{&quot;key&quot;:[0,&quot;authored_reading_section_7&quot;],&quot;blockId&quot;:[0,&quot;authored_reading_section_7&quot;],&quot;type&quot;:[0,&quot;authored_context&quot;],&quot;typeIndex&quot;:[0,6],&quot;index&quot;:[0,14],&quot;title&quot;:[0,&quot;6. The Limits: History Is Not Fair or Finished&quot;],&quot;preview&quot;:[0,&quot;Now comes the honest part. We cannot know which living composers will be remembered like Bach, Beethoven, Stravinsky, or other giants. History is not a clean exam. It is affected by publishers, teachers, institutions, recordings, politics, money, language, geography, and access. Some composers disappear from attention because their work is weak. Others disappear because the system did not support them. Some become famous partly because they were in the right place at the right time. Some are rediscovered decades later. That is why responsible judgment matters. A claim based on evidence is analysis. A guarantee about the future is fortune-telling. There is also a listening limit. Many people judge music too quickly. A new piece may not reveal its structure in one minute. Difficult music is not automatically deep, but unfamiliar music often needs time. A fair listener asks, \&quot;What is this music trying to do?\&quot; before deciding, \&quot;Do I like it?\&quot;&quot;],&quot;family&quot;:[0,&quot;forward&quot;],&quot;role&quot;:[0,&quot;forward-context&quot;],&quot;actionPattern&quot;:[0,&quot;read&quot;],&quot;phase&quot;:[0,&quot;meaning&quot;],&quot;style&quot;:[0,&quot;&quot;],&quot;anchor&quot;:[0,&quot;&quot;],&quot;selectorKind&quot;:[0,&quot;blockId&quot;],&quot;sourcePath&quot;:[0,&quot;lessonBlocks[14].blockId&quot;],&quot;previousKey&quot;:[0,&quot;authored_reading_check_6&quot;],&quot;previousTitle&quot;:[0,&quot;Why is Caroline Shaw a useful example of modern legacy?&quot;],&quot;previousPhase&quot;:[0,&quot;check&quot;],&quot;nextKey&quot;:[0,&quot;authored_reading_check_7&quot;],&quot;nextTitle&quot;:[0,&quot;Why is history not a clean exam for composers?&quot;],&quot;nextPhase&quot;:[0,&quot;check&quot;],&quot;sameTypePreviousKey&quot;:[0,&quot;authored_reading_section_6&quot;],&quot;sameTypeNextKey&quot;:[0,&quot;authored_reading_section_8&quot;],&quot;connectionLabel&quot;:[0,&quot;check -&gt; meaning -&gt; check&quot;]}],[0,{&quot;key&quot;:[0,&quot;authored_reading_check_7&quot;],&quot;blockId&quot;:[ form? Third, what human feeling or idea does it carry? It may be grief, pressure, joy, ritual, danger, play, memory, or distance. Fourth, would you want to hear another work by the same person? After that, connect the answer to evidence. A strong comment explains what the listener heard and why it matters. This is better than calling the music only \&quot;good\&quot; or \&quot;boring.\&quot; The goal is not to pretend to be a professional critic. The goal is to build a listening habit. If students can describe what they hear, they can talk about music with more confidence and less empty opinion.&quot;],&quot;family&quot;:[0,&quot;forward&quot;],&quot;role&quot;:[0,&quot;forward-context&quot;],&quot;actionPattern&quot;:[0,&quot;read&quot;],&quot;phase&quot;:[0,&quot;meaning&quot;],&quot;style&quot;:[0,&quot;&quot;],&quot;anchor&quot;:[0,&quot;&quot;],&quot;selectorKind&quot;:[0,&quot;blockId&quot;],&quot;sourcePath&quot;:[0,&quot;lessonBlocks[16].blockId&quot;],&quot;previousKey&quot;:[0,&quot;authored_reading_check_7&quot;],&quot;previousTitle&quot;:[0,&quot;Why is history not a clean exam for composers?&quot;],&quot;previousPhase&quot;:[0,&quot;check&quot;],&quot;nextKey&quot;:[0,&quot;authored_reading_check_8&quot;],&quot;nextTitle&quot;:[0,&quot;What should listeners ask before \&quot;Do I like it?\&quot;&quot;],&quot;nextPhase&quot;:[0,&quot;check&quot;],&quot;sameTypePreviousKey&quot;:[0,&quot;authored_reading_section_7&quot;],&quot;sameTypeNextKey&quot;:[0,&quot;&quot;],&quot;connectionLabel&quot;:[0,&quot;check -&gt; meaning -&gt; check&quot;]}],[0,{&quot;key&quot;:[0,&quot;authored_reading_check_8&quot;],&quot;blockId&quot;:[0,&quot;authored_reading_check_8&quot;],&quot;type&quot;:[0,&quot;micro_quiz&quot;],&quot;typeIndex&quot;:[0,7],&quot;index&quot;:[0,17],&quot;title&quot;:[0,&quot;What should listeners ask before \&quot;Do I like it?\&quot;&quot;],&quot;preview&quot;:[0,&quot;What should listeners ask before \&quot;Do I like it?\&quot;&quot;],&quot;fami t; meaning&quot;]}],[0,{&quot;key&quot;:[0,&quot;authored_reading_section_1&quot;],&quot;blockId&quot;:[0,&quot;authored_reading_section_1&quot;],&quot;type&quot;:[0,&quot;authored_context&quot;],&quot;typeIndex&quot;:[0,0],&quot;index&quot;:[0,2],&quot;title&quot;:[0,&quot;Introduction&quot;],&quot;preview&quot;:[0,&quot;Moominvalley is one of the best-known story worlds from Finland. It is calm, strange, funny, and sometimes a little sad. At first, it may look like a simple world for children. But when you look more closely, it becomes a serious place for thinking about home, danger, kindness, freedom, and people who feel different. The Moomin stories were created by Tove Jansson, a Finnish author and artist. She was born in Helsinki in 1914 and died in 2001. Jansson belonged to Finland&#39;s Swedish-speaking minority, and she wrote the original Moomin books in Swedish. This is an important detail: she was Finnish, but her literary language was Swedish. The first Moomin book, The Moomins and the Great Flood, was published in 1945, just after a hard period in European history. The stories grew into books, comic strips, picture books, theatre, television, animation, museums, and international translations. But the most important question is not only \&quot;Why are the Moomins famous?\&quot; A better question is: why does Moominvalley still feel meaningful to so many people?&quot;],&quot;family&quot;:[0,&quot;forward&quot;],&quot;role&quot;:[0,&quot;forward-context&quot;],&quot;actionPattern&quot;:[0,&quot;read&quot;],&quot;phase&quot;:[0,&quot;meaning&quot;],&quot;style&quot;:[0,&quot;&quot;],&quot;anchor&quot;:[0,&quot;&quot;],&quot;selectorKind&quot;:[0,&quot;blockId&quot;],&quot;sourcePath&quot;:[0,&quot;lessonBlocks[2].blockId&quot;],&quot;previousKey&quot;:[0,&quot;authored_reading_warmup&quot;],&quot;previousTitle&quot;:[0,&quot;Warm-Up Questions&quot;],&quot;previousPhase&quot;:[0,&quot;opening&quot;],&quot;nextKey&quot;:[0,&quot;authored_reading_check_1&quot;],&quot;nextTitle&quot;:[0,&quot;What is this lesson mainly about?&quot;],&quot;nextPhase&quot;:[0,&quot;check&quot;],&quot;sameTypePreviousKey&quot;:[0,&quot;&quot;],&quot;sameTypeNextKey&quot;:[0,&quot;authored_reading_section_2&quot;],&quot;connectionLabel&quot;:[0,&quot;opening -&gt; meaning -&gt; check&quot;]}],[0,{&quot;key&quot;:[0,&quot;authored_reading_check_1&quot;],&quot;blockId&quot;:[0,&quot;authored_reading_check_1&quot;],&quot;type&quot;:[0,&quot;micro_quiz&quot;],&quot;typeIndex&quot;:[0,0],&quot;index&quot;:[0,3],&quot;title&quot;:[0,&quot;What is this lesson mainly about?&quot;],&quot;preview&quot;:[0,&quot;What is this lesson mainly about?&quot;],&quot;family&quot;:[0,&quot;practice&quot;],&quot;role&quot;:[0,&quot;understanding-check&quot;],&quot;actionPattern&quot;:[0,&quot;reveal-answer&quot;],&quot;phase&quot;:[0,&quot;check&quot;],&quot;style&quot;:[0,&quot;&quot;],&quot;anchor&quot;:[0,&quot;&quot;],&quot;selectorKind&quot;:[0,&quot;blockId&quot;],&quot;sourcePath&quot;:[0,&quot;lessonBlocks[3].blockId&quot;],&quot;previousKey&quot;:[0,&quot;authored_reading_section_1&quot;],&quot;previousTitle&quot;:[0,&quot;Introduction&quot;],&quot;previousPhase&quot;:[0,&quot;meaning&quot;],&quot;nextKey&quot;:[0,&quot;authored_reading_section_2&quot;],&quot;nextTitle&quot;:[0,&quot;1. Who Was Tove Jansson?&quot;],&quot;nextPhase&quot;:[0,&quot;meaning&quot;],&quot;sameTypePreviousKey&quot;:[0,&quot;&quot;],&quot;sameTypeNextKey&quot;:[0,&quot;authored_reading_check_2&quot;],&quot;connectionLabel&quot;:[0,&quot;meaning -&gt; check -&gt; meaning&quot;]}],[0,{&quot;key&quot;:[0,&quot;authored_reading_section_2&quot;],&quot;blockId&quot;:[0,&quot;authored_reading_section_2&quot;],&quot;type&quot;:[0,&quot;authored_context&quot;],&quot;typeIndex&quot;:[0,1],&quot;index&quot;:[0,4],&quot;title&quot;:[0,&quot;1. Who Was Tove Jansson?&quot;],&quot;preview&quot;:[0,&quot;Tove Jansson was not only a children&#39;s writer. She was also a painter, illustrator, comic artist, and author of books for adults. This wide artistic life matters because the Moomin stories are not only cute entertainment. They came from a serious artist who thought deeply about images, words, and human feelings. Jansson grew up in an artistic family in Helsinki. Her father was a sculptor, and her mother was an illustrator. In a home like that, art was not a hobby on the side. It was part of daily life. Drawing, making, and imagining were normal ways to understand the world. This helps explain why Moominvalley feels visual and alive. The stories are not only told through sentences. They are also shaped by drawings, weather, rooms, forests, boats, islands, and faces. Jansson built a world that readers can almost enter.&quot;],&quot;family&quot;:[0,&quot;forward&quot;],&quot;role&quot;:[0,&quot;forward-context&quot;],&quot;actionPattern&quot;:[0,&quot;read&quot;],&quot;phase&quot;:[0,&quot;meaning&quot;],&quot;style&quot;:[0,&quot;&quot;],&quot;anchor&quot;:[0,&quot;&quot;],&quot;selectorKind&quot;:[0,&quot;blockId&quot;],&quot;sourcePath&quot;:[0,&quot;lessonBlocks[4].blockId&quot;],&quot;previousKey&quot;:[0,&quot;authored_reading_check_1&quot;],&quot;previousTitle&quot;:[0,&quot;What is this lesson mainly about?&quot;],&quot;previousPhase&quot;:[0,&quot;check&quot;],&quot;nextKey&quot;:[0,&quot;authored_reading_check_2&quot;],&quot;nextTitle&quot;:[0,&quot;Why is it important that Jansson was also an artist?&quot;],&quot;nextPhase&quot;:[0,&quot;check&quot;],&quot;sameTypePreviousKey&quot;:[0,&quot;authored_reading_section_1&quot;],&quot;sameTypeNextKey&quot;:[0,&quot;authored_reading_section_3&quot;],&quot;connectionLabel&quot;:[0,&quot;check -&gt; meaning -&gt; check&quot;]}],[0,{&quot;key&quot;:[0,&quot;authored_reading_check_2&quot;],&quot;blockId&quot;:[0,&quot;authored_reading_check_2&quot;],&quot;type&quot;:[0,&quot;micro_quiz&quot;],&quot;typeIndex&quot;:[0,1],&quot;index&quot;:[0,5],&quot;title&quot;:[0,&quot;Why is it important that Jansson aders in many countries understand fear, loneliness, friendship, and the wish for a safe home. A good story can be local and international at the same time. Moominvalley feels connected to Finland, but it does not require the reader to know Finland perfectly. It uses local atmosphere to talk about very human questions.&quot;],&quot;family&quot;:[0,&quot;forward&quot;],&quot;role&quot;:[0,&quot;forward-context&quot;],&quot;actionPattern&quot;:[0,&quot;read&quot;],&quot;phase&quot;:[0,&quot;meaning&quot;],&quot;style&quot;:[0,&quot;&quot;],&quot;anchor&quot;:[0,&quot;&quot;],&quot;selectorKind&quot;:[0,&quot;blockId&quot;],&quot;sourcePath&quot;:[0,&quot;lessonBlocks[6].blockId&quot;],&quot;previousKey&quot;:[0,&quot;authored_reading_check_2&quot;],&quot;previousTitle&quot;:[0,&quot;Why is it important that Jansson was also an artist?&quot;],&quot;previousPhase&quot;:[0,&quot;check&quot;],&quot;nextKey&quot;:[0,&quot;authored_reading_check_3&quot;],&quot;nextTitle&quot;:[0,&quot;Why is Jansson&#39;s language background interesting?&quot;],&quot;nextPhase&quot;:[0,&quot;check&quot;],&quot;sameTypePreviousKey&quot;:[0,&quot;authored_reading_section_2&quot;],&quot;sameTypeNextKey&quot;:[0,&quot;authored_reading_section_4&quot;],&quot;connectionLabel&quot;:[0,&quot;check -&gt; meaning -&gt; check&quot;]}],[0,{&quot;key&quot;:[0,&quot;authored_reading_check_3&quot;],&quot;blockId&quot;:[0,&quot;authored_reading_check_3&quot;],&quot;type&quot;:[0,&quot;micro_quiz&quot;],&quot;typeIndex&quot;:[0,2],&quot;index&quot;:[0,7],&quot;title&quot;:[0,&quot;Why is Jansson&#39;s language background interesting?&quot;],&quot;preview&quot;:[0,&quot;Why is Jansson&#39;s language background interesting?&quot;],&quot;family&quot;:[0,&quot;practice&quot;],&quot;role&quot;:[0,&quot;understanding-check&quot;],&quot;actionPattern&quot;:[0,&quot;reveal-answer&quot;],&quot;phase&quot;:[0,&quot;check&quot;],&quot;style&quot;:[0,&quot;&quot;],&quot;anchor&quot;:[0,&quot;&quot;],&quot;selectorKind& is important, but staying home forever is not the only way to live. Characters go outside, meet danger, travel, explore, and sometimes make mistakes. This balance is very human. Most people want both comfort and freedom. We want a place to return to, but we also want new experiences. If a story has only safety, it may feel boring. If it has only danger, it may feel exhausting. Moominvalley gives both. For B1 speaking, this is a useful topic because it connects to real life. Students can talk about family, travel, independence, risk, rest, and personal space. The story world becomes a door into adult conversation.&quot;],&quot;family&quot;:[0,&quot;forward&quot;],&quot;role&quot;:[0,&quot;forward-context&quot;],&quot;actionPattern&quot;:[0,&quot;read&quot;],&quot;phase&quot;:[0,&quot;meaning&quot;],&quot;style&quot;:[0,&quot;&quot;],&quot;anchor&quot;:[0,&quot;&quot;],&quot;selectorKind&quot;:[0,&quot;blockId&quot;],&quot;sourcePath&quot;:[0,&quot;lessonBlocks[12].blockId&quot;],&quot;previousKey&quot;:[0,&quot;authored_reading_check_5&quot;],&quot;previousTitle&quot;:[0,&quot;Why is Moominvalley more than a peaceful background?&quot;],&quot;previousPhase&quot;:[0,&quot;check&quot;],&quot;nextKey&quot;:[0,&quot;authored_reading_check_6&quot;],&quot;nextTitle&quot;:[0,&quot;What two needs do the Moomin stories often balance?&quot;],&quot;nextPhase&quot;:[0,&quot;check&quot;],&quot;sameTypePreviousKey&quot;:[0,&quot;authored_reading_section_5&quot;],&quot;sameTypeNextKey&quot;:[0,&quot;authored_reading_section_7&quot;],&quot;connectionLabel&quot;:[0,&quot;check -&gt; meaning -&gt; check&quot;]}],[0,{&quot;key&quot;:[0,&quot;authored_reading_check_6&quot;],&quot;blockId&quot;:[0,&quot;authored_reading_check_6&quot;],&quot;type&quot;:[0,&quot;micro_quiz&quot;],&quot;typeIndex&quot;:[0,5],&quot;index&quot;:[0,13],&quot;title&quot;:[0,&quot;What two needs do the Moomin stories often balance?&quot;],&quot;preview&quot;:[0,&quot;What two needs do the Moomin stories often balance?&quot;],&quot;family&quot;:[0,&quot;practice&quot;],&quot;role&quot;:[0,&quot;understanding-check&quot;],&quot;actionPattern&quot;:[0,&quot;reveal-answer&quot;],&quot;phase&quot;:[0,&quot;check&quot;],&quot;style&quot;:[0,&quot;&quot;],&quot;anchor&quot;:[0,&quot;&quot;],&quot;selectorKind&quot;:[0,&quot;blockId&quot;],&quot;sourcePath&quot;:[0,&quot;lessonBlocks[13].blockId&quot;],&quot;previousKey&quot;:[0,&quot;authored_reading_section_6&quot;],&quot;previousTitle&quot;:[0,&quot;5. Safety and Adventure Together&quot;],&quot;previousPhase&quot;:[0,&quot;meaning&quot;],&quot;nextKey&quot;:[0,&quot;authored_reading_section_7&quot;],&quot;nextTitle&quot;:[0,&quot;6. Outsiders, Guests, and Belonging&quot;],&quot;nextPhase&quot;:[0,&quot;meaning&quot;],&quot;sameTypePreviousKey&quot;:[0,&quot;authored_reading_check_5&quot;],&quot;sameTypeNextKey&quot;:[0,&quot;authored_reading_check_7&quot;],&quot;connectionLabel&quot;:[0,&quot;meaning -&gt; check -&gt; meaning&quot;]}],[0,{&quot;key&quot;:[0,&quot;authored_reading_section_7&quot;],&quot;blockId&quot;:[0,&quot;authored_reading_section_7&quot;],&quot;type&quot;:[0,&quot;authored_context&quot;],&quot;typeIndex&quot;:[0,6],&quot;index&quot;:[0,14],&quot;title&quot;:[0,&quot;6. Outsiders, Guests, and Belonging&quot;],&quot;preview&quot;:[0,&quot;Moominvalley often welcomes unusual guests. Some characters are shy. Some are difficult. Some stay for a while and then leave. Some want to belong, but they do not know how. This is one reason many readers feel close to the stories. Belonging does not mean everyone must become the same. In Jansson&#39;s world, a community can include people who need silence, people who ask questions, people who make trouble, and people who come from outside. The valley is not perfect, but it often makes space for difference. This idea is serious. Many people know the feeling of being an outsider. A story that says \&quot;there is room for you\&quot; can be powerful, especially when it does not say it in a heavy or moral way. It shows the idea through meals, visits, journeys, small conflicts, and quiet kindness.&quot;],&quot;family&quot;:[0,&quot;forward&quot;],&quot;role&quot;:[0,&quot;forward-context&quot;],&quot;actionPattern&quot;:[0,&quot;read&quot;],&quot;phase&quot;:[0,&quot;meaning&quot;],&quot;style&quot;:[0,&quot;&quot;],&quot;anchor&quot;:[0,&quot;&quot;],&quot;selectorKind&quot;:[0,&quot;blockId&quot;],&quot;sourcePath&quot;:[0,&quot;lessonBlocks[14].blockId&quot;],&quot;previousKey&quot;:[0,&quot;authored_reading_check_6&quot;],&quot;previousTitle&quot;:[0,&quot;What two needs do the Moomin stories often balance?&quot;],&quot;previousPhase&quot;:[0,&quot;check&quot;],&quot;nextKey&quot;:[0,&quot;authored_reading_check_7&quot;],&quot;nextTitle&quot;:[0,&quot;What does belonging mean in Moominvalley?&quot;],&quot;nextPhase&quot;:[0,&quot;check&quot;],&quot;sameTypePreviousKey&quot;:[0,&quot;authored_reading_section_6&quot;],&quot;sameTypeNextKey&quot;:[0,&quot;authored_reading_section_8&quot;],&quot;connectionLabel&quot;:[0,&quot;check -&gt; meaning -&gt; check&quot;]}],[0,{&quot;key&quot;:[0,&quot;authored_reading_check_7&quot;],&quot;blockId&quot;:[0,&quot;authored_reading_check_7&quot;],&quot;type&quot;:[0,&quot;micro_quiz&quot;],&quot;typeIndex&quot;:[0,6],&quot;index&quot;:[0,15],&quot;title&quot;:[0,&quot;What does belonging mean in Moominvalley?&quot;],&quot;preview&quot;:[0,&quot;What does belonging mean in Moominvalley?&quot;],&quot;family&quot;:[0,&quot;practice&quot;],&quot;role&quot;:[0,&quot;understanding-check&quot;],&quot;actionPattern&quot;:[0,&quot;reveal-answer&quot;],&quot;phase&quot;:[0,&quot;check&quot;],&quot;style&quot;:[0,&quot;&quot;],&quot;anchor&quot;:[0,&quot;&quot;],&quot;selectorKind&quot;:[0,&quot;blockId&quot;],&quot;sourcePath&quot;:[0,&quot;lessonBlocks[15].blockId&quot;],&quot;previousKey&quot;:[0,&quot;authored_reading_section_7&quot;],&quot;previousTitle&quot;:[0,&quot;6. Outsiders, Guests, and Belonging&quot;],&quot;previousPhase&quot;:[0,&quot;meaning&quot;],&quot;nextKey&quot;:[0,&quot;authored_reading_section_8&quot;],&quot;nextTitle&quot;:[0,&quot;7. Nature, Islands, and Freedom&quot;],&quot;nextPhase&quot;:[0,&quot;meaning&quot;],&quot;sameTypePreviousKey&quot;:[0,&quot;authored_reading_check_6&quot;],&quot;sameTypeNextKey&quot;:[0,&quot;authored_reading_check_8&quot;],&quot;connectionLabel&quot;:[0,&quot;meaning -&gt; check -&gt; meaning&quot;]}],[0,{&quot;key&quot;:[0,&quot;authored_reading_section_8&quot;],&quot;blockId&quot;:[0,&quot;authored_reading_section_8&quot;],&quot;type&quot;:[0,&quot;authored_context&quot;],&quot;typeIndex&quot;:[0,7],&quot;index&quot;:[0,16],&quot;title&quot;:[0,&quot;7. Nature, Islands, and Freedom&quot;],&quot;preview&quot;:[0,&quot;Nature is not only decoration in Jansson&#39;s stories. Forests, the sea, storms, seasons, islands, and long quiet spaces shape the feeling of the Moomin world. Nature can be beautiful, but it can also be powerful and frightening. Jansson herself spent important time near the sea, and island life became part of her imagination. The sea can suggest freedom because it is open and wide. But it can also suggest risk because weather changes and people can be separated. This makes nature in the stories feel honest. It is not just a pretty postcard. It reminds readers that life includes beauty and danger together. A safe home and a wild landscape need each other in the same story.&quot;],&quot;family&quot;:[0,&quot;forward&quot;],&quot;role&quot;:[0,&quot;forward-context&quot;],&quot;actionPattern&quot;:[0,&quot;read&quot;],&quot;phase&quot;:[0,&quot;meaning&quot;],&quot;style&quot;:[0,&quot;&quot;],&quot;anchor&quot;:[0,&quot;&quot;],&quot;selectorKind&quot;:[0,&quot;blockId&quot;],&quot;sourcePath&quot;:[0,&quot;lessonBlocks[16].blockId&quot;],&quot;previousKey&quot;:[0,&quot;authored_reading_check_7&quot;],&quot;previousTitle&quot;:[0,&quot;What does belonging mean in Moominvalley?&quot;],&quot;previousPhase&quot;:[0,&quot;check&quot;],&quot;nextKey&quot;:[0,&quot;authored_reading_check_8&quot;],&quot;nextTitle&quot;:[0,&quot;How does nature work in the Moomin stories?&quot;],&quot;nextPhase&quot;:[0,&quot;check&quot;],&quot;sameTypePreviousKey&quot;:[0,&quot;authored_reading_section_7&quot;],&quot;sameTypeNextKey&quot;:[0,&quot;authored_reading_section_9&quot;],&quot;connectionLabel&quot;:[0,&quot;check -&gt; meaning -&gt; check&quot;]}],[0,{&quot;key&quot;:[0,&quot;authored_reading_check_8&quot;],&quot;blockId&quot;:[0,&quot;authored_reading_check_8&quot;],&quot;type&quot;:[0,&quot;micro_quiz&quot;],&quot;typeIndex&quot;:[0,7],&quot;index&quot;:[0,17],&quot;title&quot;:[0,&quot;How does nature work in the Moomin stories?&quot;],&quot;preview&quot;:[0,&quot;How does nature work in the Moomin stories?&quot;],&quot;family&quot;:[0,&quot;practice&quot;],&quot;role&quot;:[0,&quot;understanding-check&quot;],&quot;actionPattern&quot;:[0,&quot;reveal-answer&quot;],&quot;phase&quot;:[0,&quot;check&quot;],&quot;style&quot;:[0,&quot;&quot;],&quot;anchor&quot;:[0,&quot;&quot;],&quot;selectorKind&quot;:[0,&quot;blockId&quot;],&quot;sourcePath&quot;:[0,&quot;lessonBlocks[17].blockId&quot;],&quot;previousKey&quot;:[0,&quot;authored_reading_section_8&quot;],&quot;previousTitle&quot;:[0,&quot;7. Nature, Islands, and Freedom&quot;],&quot;previousPhase&quot;:[0,&quot;meaning&quot;],&quot;nextKey&quot;:[0,&quot;authored_reading_section_9&quot;],&quot;nextTitle&quot;:[0,&quot;8. From Books to a Larger Cultural World&quot;],&quot;nextPhase&quot;:[0,&quot;meaning&quot;],&quot;sameTypePreviousKey&quot;:[0,&quot;authored_reading_check_7&quot;],&quot;sameTypeNextKey&quot;:[0,&quot;authored_reading_check_9&quot;],&quot;connectionLabel&quot;:[0,&quot;meaning -&gt; check -&gt; meaning&quot;]}],[0,{&quot;key&quot;:[0,&quot;authored_reading_section_9&quot;],&quot;blockId&quot;:[0,&quot;authored_reading_section_9&quot;],&quot;type&quot;:[0,&quot;authored_context&quot;],&quot;typeIndex&quot;:[0,8],&quot;index&quot;:[0,18],&quot;title&quot;:[0,&quot;8. From Books to a Larger Cultural World&quot;],&quot;preview&quot;:[0,&quot;The Moomin stories began as literature and drawings, but they became much bigger. They moved into comic strips, picture books, television, animation, theatre, exhibitions, products, and museums. Today, many people know Moomins first from animation or design goods, not from the original books. This can be both useful and risky. A larger cultural world helps new people discover the stories. A museum, TV series, or translated book can bring a reader into Jansson&#39;s work. But popularity can also make a serious story look only like a cute brand. For that reason, it is helpful to return to Tove Jansson herself. The heart of the Moomin world is not only merchandise or nostalgia. It is an artist&#39;s way of thinking about home, fear, love, independence, and the right to be unusual.&quot;],&quot;family&quot;:[0,&quot;forward&quot;],&quot;role&quot;:[0,&quot;forward-context&quot;],&quot;actionPattern&quot;:[0,&quot;read&quot;],&quot;phase&quot;:[0,&quot;meaning&quot;],&quot;style&quot;:[0,&quot;&quot;],&quot;anchor&quot;:[0,&quot;&quot;],&quot;selectorKind&quot;:[0,&quot;blockId&quot;],&quot;sourcePath&quot;:[0,&quot;lessonBlocks[18].blockId&quot;],&quot;previousKey&quot;:[0,&quot;authored_reading_check_8&quot;],&quot;previousTitle&quot;:[0,&quot;How does nature work in the Moomin stories?&quot;],&quot;previousPhase&quot;:[0,&quot;check&quot;],&quot;nextKey&quot;:[0,&quot;authored_reading_check_9&quot;],&quot;nextTitle&quot;:[0,&quot;What is one risk when Moomins become a large cultural brand?&quot;],&quot;nextPhase&quot;:[0,&quot;check&quot;],&quot;sameTypePreviousKey&quot;:[0,&quot;authored_reading_section_8&quot;],&quot;sameTypeNextKey&quot;:[0,&quot;authored_reading_section_10&quot;],&quot;connectionLabel&quot;:[0,&quot;check -&gt; meaning -&gt; check&quot;]}],[0,{&quot;key&quot;:[0,&quot;authored_reading_check_9&quot;],&quot;blockId&quot;: ly pressure, and the need to belong without losing yourself. Jansson wrote before these topics were discussed in exactly the same language, but her stories often touch the same human questions. Moominvalley also feels modern because it is gentle without being empty. A gentle story can still be serious. It can speak softly about fear, independence, loss, and hope. Sometimes a quiet story can stay with readers longer than a loud one.&quot;],&quot;family&quot;:[0,&quot;forward&quot;],&quot;role&quot;:[0,&quot;forward-context&quot;],&quot;actionPattern&quot;:[0,&quot;read&quot;],&quot;phase&quot;:[0,&quot;meaning&quot;],&quot;style&quot;:[0,&quot;&quot;],&quot;anchor&quot;:[0,&quot;&quot;],&quot;selectorKind&quot;:[0,&quot;blockId&quot;],&quot;sourcePath&quot;:[0,&quot;lessonBlocks[20].blockId&quot;],&quot;previousKey&quot;:[0,&quot;authored_reading_check_9&quot;],&quot;previousTitle&quot;:[0,&quot;What is one risk when Moomins become a large cultural brand?&quot;],&quot;previousPhase&quot;:[0,&quot;check&quot;],&quot;nextKey&quot;:[0,&quot;authored_reading_check_10&quot;],&quot;nextTitle&quot;:[0,&quot;Why can the Moomin stories feel modern today?&quot;],&quot;nextPhase&quot;:[0,&quot;check&quot;],&quot;sameTypePreviousKey&quot;:[0,&quot;authored_reading_section_9&quot;],&quot;sameTypeNextKey&quot;:[0,&quot;&quot;],&quot;connectionLabel&quot;:[0,&quot;check -&gt; meaning -&gt; check&quot;]}],[0,{&quot;key&quot;:[0,&quot;authored_reading_check_10&quot;],&quot;blockId&quot;:[0,&quot;authored_reading_check_10&quot;],&quot;type&quot;:[0,&quot;micro_quiz&quot;],&quot;typeIndex&quot;:[0,9],&quot;index&quot;:[0,21],&quot;title&quot;:[0,&quot;Why can the Moomin stories feel modern today?&quot;],&quot;preview&quot;:[0,&quot;Why can the Moomin stories feel modern today?&quot;],&quot;family&quot;:[0,&quot;practice&quot;],&quot;role&quot;:[0,&quot;understanding-check&quot;],&quot;actionPattern&quot;:[0,&quot;reveal-answer&quot;],&quot;phase&quot;:[0,&quot;check&quot;],&quot;style& d international readers because the feelings are widely human. Many people know what it means to search for home, to feel different, to need freedom, or to want a place where they are accepted. The biggest lesson may be this: a serious story does not always need a loud voice. Sometimes a valley, a storm, a warm house, and a few unusual visitors can help readers talk about the most important parts of life.&quot;],&quot;family&quot;:[0,&quot;forward&quot;],&quot;role&quot;:[0,&quot;summary&quot;],&quot;actionPattern&quot;:[0,&quot;read&quot;],&quot;phase&quot;:[0,&quot;wrap-up&quot;],&quot;style&quot;:[0,&quot;&quot;],&quot;anchor&quot;:[0,&quot;&quot;],&quot;selectorKind&quot;:[0,&quot;blockId&quot;],&quot;sourcePath&quot;:[0,&quot;lessonBlocks[24].blockId&quot;],&quot;previousKey&quot;:[0,&quot;authored_reading_final_reflection&quot;],&quot;previousTitle&quot;:[0,&quot;Final Reflection&quot;],&quot;previousPhase&quot;:[0,&quot;wrap-up&quot;],&quot;nextKey&quot;:[0,&quot;authored_reading_vocabulary&quot;],&quot;nextTitle&quot;:[0,&quot;Useful Topic Vocabulary&quot;],&quot;nextPhase&quot;:[0,&quot;support&quot;],&quot;sameTypePreviousKey&quot;:[0,&quot;authored_reading_final_reflection&quot;],&quot;sameTypeNextKey&quot;:[0,&quot;&quot;],&quot;connectionLabel&quot;:[0,&quot;wrap-up -&gt; wrap-up -&gt; support&quot;]}],[0,{&quot;key&quot;:[0,&quot;authored_reading_vocabulary&quot;],&quot;blockId&quot;:[0,&quot;authored_reading_vocabulary&quot;],&quot;type&quot;:[0,&quot;vocab_table&quot;],&quot;typeIndex&quot;:[0,0],&quot;index&quot;:[0,25],&quot;title&quot;:[0,&quot;Useful Topic Vocabulary&quot;],&quot;preview&quot;:[0,&quot;illustrator, artist, fictional, valley&quot;],&quot;family&quot;:[0,&quot;support&quot;],&quot;role&quot;:[0,&quot;review-vocabulary&quot;],&quot;actionPattern&quot;:[0,&quot;popup-save&quot;],&quot;phase&quot;:[0,&quot;support&quot;],&quot;style&quot;:[0,&quot;&quot;],&quot;anchor&quot;:[0,&quot;&quot;],&quot;selectorKind&quot;:[0,&quot;blockId&quot;],&quot;sourcePath&quot;:[0,&quot;lessonBlocks[25].blockId&quot;],&quot;previousKey&quot;:[0,&quot;authored_reading_final_reflection_part_2&quot;],&quot;previousTitle&quot;:[0,&quot;Key Point&quot;],&quot;previousPhase&quot;:[0,&quot;wrap-up&quot;],&quot;nextKey&quot;:[0,&quot;&quot;],&quot;nextTitle&quot;:[0,&quot;&quot;],&quot;nextPhase&quot;:[0,&quot;&quot;],&quot;sameTypePreviousKey&quot;:[0,&quot;&quot;],&quot;sameTypeNextKey&quot;:[0,&quot;&quot;],&quot;connectionLabel&quot;:[0,&quot;wrap-up -&gt; support&quot;]}]]]}],[0,{&quot;id&quot;:[0,&quot;2026-06-30-why-people-buy-useless-things-on-vacation&quot;],&quot;slug&quot;:[0,&quot;2026-06-30-why-people-buy-useless-things-on-vacation&quot;],&quot;title&quot;:[0,&quot;Why People Buy Useless Things on Vacation&quot;],&quot;level&quot;:[0,&quot;B1&quot;],&quot;route&quot;:[0,&quot;/episodes/2026-06-30-why-people-buy-useless-things-on-vacation/&quot;],&quot;date&quot;:[0,&quot;2026-06-30&quot;],&quot;blockCount&quot;:[0,17],&quot;blockTypes&quot;:[1,[[0,&quot;authored_context&quot;],[0,&quot;lesson_goal&quot;],[0,&quot;scene_card&quot;],[0,&quot;vocab_table&quot;]]],&quot;phases&quot;:[1,[[0,&quot;opening&quot;],[0,&quot;meaning&quot;],[0,&quot;support&quot;]]],&quot;blocks&quot;:[1,[[0,{&quot;key&quot;:[0,&quot;authored_reading_goal&quot;],&quot;blockId&quot;:[0,&quot;authored_reading_goal&quot;],&quot;type&quot;:[0,&quot;lesson_goal&quot;],&quot;typeIndex&quot;:[0,0],&quot;index&quot;:[0,0],&quot;title&quot;:[0,&quot;Lesson Goal&quot;],&quot;preview&quot;:[0,&quot;Understand the psychology behind souvenir buying: memory, mood, mental accounting, scarcity, social pressure, identity, and regret.&quot;],&quot;family&quot;:[0,&quot;support&quot;],&quot;role&quot;:[0,&quot;forward-context&quot;],&quot;actionPattern&quot;:[0,&quot;read&quot;],&quot;phase&quot;:[0,&quot;opening&quot;],&quot;style&quot;:[0,&quot;&quot;],&quot;anchor&quot;:[0,&quot;&quot;],&quot;selectorKind&quot;:[0,&quot;blockId&quot;],&quot;sourcePath&quot;:[0,&quot;lessonBlocks[0].blockId&quot;],&quot;previousKey&quot;:[0,&quot;&quot;],&quot;previousTitle&quot;:[0,&quot;&quot;],&quot;previousPhase&quot;:[0,&quot;&quot;],&quot;nextKey&quot;:[0,&quot;authored_reading_section_1&quot;],&quot;nextTitle&quot;:[0,&quot;Introduction&quot;],&quot;nextPhase&quot;:[0,&quot;meaning&quot;],&quot;sameTypePreviousKey&quot;:[0,&quot;&quot;],&quot;sameTypeNextKey&quot;:[0,&quot;&quot;],&quot;connectionLabel&quot;:[0,&quot;opening -&gt; meaning&quot;]}],[0,{&quot;key&quot;:[0,&quot;authored_reading_section_1&quot;],&quot;blockId&quot;:[0,&quot;authored_reading_section_1&quot;],&quot;type&quot;:[0,&quot;authored_context&quot;],&quot;typeIndex&quot;:[0,0],&quot;index&quot;:[0,1],&quot;title&quot;:[0,&quot;Introduction&quot;],&quot;preview&quot;:[0,&quot;A tourist buys a magnet, a cup, a shirt, or a small toy. Later, at home, the object may look useless. It may sit in a drawer. It may not match the person&#39;s normal style. It may not have much practical value. But the buying decision did not happen in a normal room at home. It happened in a vacation state. The person was in a new place, away from normal routines, surrounded by signs, colors, shop displays, other travelers, and the feeling that the moment would soon disappear. So the better question is not, \&quot;Why did this person buy a useless object?\&quot; The better question is, \&quot;What psychological job did the object do at that moment?\&quot;&quot;],&quot;family&quot;:[0,&quot;support&quot;],&quot;role&quot;:[0,&quot;forward-context&quot;],&quot;actionPattern&quot;:[0,&quot;read&quot;],&quot;phase&quot;:[0,&quot;meaning&quot;],&quot;style&quot;:[0,&quot;&quot;],&quot;anchor&quot;:[0,&quot;&quot;],&quot;selectorKind&quot;:[0,&quot;blockId&quot;],&quot;sourcePath&quot;:[0,&quot;lessonBlocks[1].blockId&quot;],&quot;previousKey&quot;:[0,&quot;authored_reading_goal&quot;],&quot;previousTitle&quot;:[0,&quot;Lesson Goal&quot;],&quot;previousPhase&quot;:[0,&quot;opening&quot;],&quot;nextKey&quot;:[0,&quot;authored_reading_section_2&quot;],&quot;nextTitle&quot;:[0,&quot;1. Vacation Changes The Usual Rules&quot;],&quot;nextPhase&quot;:[0,&quot;meaning&quot;],&quot;sameTypePreviousKey&quot;:[0,&quot;&quot;],&quot;sameTypeNextKey&quot;:[0,&quot;authored_reading_section_2&quot;],&quot;connectionLabel&quot;:[0,&quot;opening -&gt; meaning -&gt; meaning&quot;]}],[0,{&quot;key&quot;:[0,&quot;authored_reading_section_2&quot;],&quot;blockId&quot;:[0,&quot;authored_reading_section_2&quot;],&quot;type&quot;:[0,&quot;authored_context&quot;],&quot;typeIndex&quot;:[0,1],&quot;index&quot;:[0,2],&quot;title&quot;:[0,&quot;1. Vacation Changes The Usual Rules&quot;],&quot;preview&quot;:[0,&quot;On vacation, people often feel like they are outside ordinary life. They may wake up at a different time, eat different food, walk through unfamiliar streets, and spend money on experiences they would not buy at home. This changes the decision frame. A decision frame is the mental situation around a choice. At home, the question may be, \&quot;Do I need this?\&quot; On vacation, the question often becomes, \&quot;Will this help me remember this place?\&quot; or \&quot;Will this make the trip feel complete?\&quot; This does not mean tourists are foolish. It means context changes attention. The same object can feel boring in a normal shop and meaningful beside the beach, museum, mountain, station, or old city street where the memory was made.&quot;],&quot;family&quot;:[0,&quot;support&quot;],&quot;role&quot;:[0,&quot;forward-context&quot;],&quot;actionPattern&quot;:[0,&quot;read&quot;],&quot;phase&quot;:[0,&quot;meaning&quot;],&quot;style&quot;:[0,&quot;&quot;],&quot;anchor&quot;:[0,&quot;&quot;],&quot;selectorKind&quot;:[0,&quot;blockId&quot;],&quot;sourcePath&quot;:[0,&quot;lessonBlocks[2].blockId&quot;],&quot;previousKey&quot;:[0,&quot;authored_reading_section_1&quot;],&quot;previousTitle&quot;:[0,&quot;Introduction&quot;],&quot;previousPhase&quot;:[0,&quot;meaning&quot;],&quot;nextKey&quot;:[0,&quot;authored_reading_section_3&quot;],&quot;nextTitle&quot;:[0,&quot;2. Souvenirs Work As Memory Cues&quot;],&quot;nextPhase&quot;:[0,&quot;meaning&quot;],&quot;sameTypePreviousKey&quot;:[0,&quot;authored_reading_section_1&quot;],&quot;sameTypeNextKey&quot;:[0,&quot;authored_reading_section_3&quot;],&quot;connectionLabel&quot;:[0,&quot;meaning -&gt; meaning -&gt; meaning&quot;]}],[0,{&quot;key&quot;:[0,&quot;authored_reading_section_3&quot;],&quot;blockId&quot;:[0,&quot;authored_reading_section_3&quot;],&quot;type&quot;:[0,&quot;authored_context&quot;],&quot;typeIndex&quot;:[0,2],&quot;index&quot;:[0,3],&quot;title&quot;:[0,&quot;2. Souvenirs Work As Memory Cues&quot;],&quot;preview&quot;:[0,&quot;Tourism research often describes souvenirs as objects that connect a person, a place, and a memory. A souvenir is not only an object. It can become a memory cue. A memory cue is something that helps the brain return to an experience. A ticket can bring back a concert. A cup can bring back a cafe. A small local snack can bring back a street, a smell, or a person who was there. This is why a low-value object can feel emotionally valuable. Its practical use may be small, but its symbolic value can be high. Symbolic value means the object stands for something larger: a trip, a friendship, a family day, freedom, rest, adventure, or a version of yourself you felt during travel.&quot;],&quot;family&quot;:[0,&quot;support&quot;],&quot;role&quot;:[0,&quot;forward-context&quot;],&quot;actionPattern&quot;:[0,&quot;read&quot;],&quot;phase&quot;:[0,&quot;meaning&quot;],&quot;style&quot;:[0,&quot;&quot;],&quot;anchor&quot;:[0,&quot;&quot;],&quot;selectorKind&quot;:[0,&quot;blockId&quot;],&quot;sourcePath&quot;:[0,&quot;lessonBlocks[3].blockId&quot;],&quot;previousKey&quot;:[0,&quot;authored_reading_section_2&quot;],&quot;previousTitle&quot;:[0,&quot;1. Vacation Changes The Usual Rules&quot;],&quot;previousPhase&quot;:[0,&quot;meaning&quot;],&quot;nextKey&quot;:[0,&quot;authored_reading_section_4&quot;],&quot;nextTitle&quot;:[0,&quot;3. Travel Money Feels Different&quot;],&quot;nextPhase&quot;:[0,&quot;meaning&quot;],&quot;sameTypePreviousKey&quot;:[0,&quot;authored_reading_section_2&quot;],&quot;sameTypeNextKey&quot;:[0,&quot;authored_reading_section_4&quot;],&quot;connectionLabel&quot;:[0,&quot;meaning -&gt; meaning -&gt; meaning&quot;]}],[0,{&quot;key&quot;:[0,&quot;authored_reading_section_4&quot;],&quot;blockId&quot;:[0,&quot;authored_reading_section_4&quot;],&quot;type&quot;:[0,&quot;authored_context&quot;],&quot;typeIndex&quot;:[0,3],&quot;index&quot;:[0,4],&quot;title&quot;:[0,&quot;3. Travel Money Feels Different&quot;],&quot;preview&quot;:[0,&quot;Behavioral economics gives another useful idea: mental accounting. People often separate money into mental boxes. Rent money feels different from birthday money. Food money feels different from gift money. Vacation money can feel different from normal money. When a person has already accepted the cost of a trip, a small extra purchase can feel less serious. One magnet is cheap. One snack box is cheap. One shirt is not too bad. The problem is that each small choice feels separate, while the total cost grows quietly. Mental accounting can help people enjoy a trip without guilt. But it can also hide the real total. The brain says, \&quot;This is vacation money,\&quot; so the usual careful rule becomes softer.&quot;],&quot;family&quot;:[0,&quot;support&quot;],&quot;role&quot;:[0,&quot;forward-context&quot;],&quot;actionPattern&quot;:[0,&quot;read&quot;],&quot;phase&quot;:[0,&quot;meaning&quot;],&quot;style&quot;:[0,&quot;&quot;],&quot;anchor&quot;:[0,&quot;&quot;],&quot;selectorKind&quot;:[0,&quot;blockId&quot;],&quot;sourcePath&quot;:[0,&quot;lessonBlocks[4].blockId&quot;],&quot;previousKey&quot;:[0,&quot;authored_reading_section_3&quot;],&quot;previousTitle&quot;:[0,&quot;2. Souvenirs Work As Memory Cues&quot;],&quot;previousPhase&quot;:[0,&quot;meaning&quot;],&quot;nextKey&quot;:[0,&quot;authored_reading_section_5&quot;],&quot;nextTitle&quot;:[0,&quot;4. Scarcity Creates Future Regret&quot;],&quot;nextPhase&quot;:[0,&quot;meaning&quot;],&quot;sameTypePreviousKey&quot;:[0,&quot;authored_reading_section_3&quot;],&quot;sameTypeNextKey&quot;:[0,&quot;authored_reading_section_5&quot;],&quot;connectionLabel&quot;:[0,&quot;meaning -&gt; meaning -&gt; meaning&quot;]}],[0,{&quot;key&quot;:[0,&quot;authored_reading_section_5&quot;],&quot;blockId&quot;:[0,&quot;authored_reading_section_5&quot;],&quot;type&quot;:[0,&quot;authored_context&quot;],&quot;typeIndex&quot;:[0,4],&quot;index&quot;:[0,5],&quot;title&quot;:[0,&quot;4. Scarcity Creates Future Regret&quot;],&quot;preview&quot;:[0,&quot;Many tourist shops use scarcity cues. A scarcity cue tells the buyer that the chance may disappear: only here, limited edition, local product, last day, today only, airport shop, final stop. Sometimes the scarcity is real. A handmade object from a local maker may be difficult to find later. Fresh local food may not travel well. A small item from a special event may truly belong to that time and place. Sometimes the scarcity is mostly psychological. The object may be mass-produced and sold in many shops, but the traveler is standing inside a short moment. The brain imagines a future feeling: \&quot;I might regret leaving without this.\&quot; That fear of future regret can be stronger than the question of need. The buyer is not only buying the object. The buyer is buying relief from the feeling of missing a chance.&quot;],&quot;family&quot;:[0,&quot;support&quot;],&quot;role&quot;:[0,&quot;forward-context&quot;],&quot;actionPattern&quot;:[0,&quot;read&quot;],&quot;phase&quot;:[0,&quot;meaning&quot;],&quot;style&quot;:[0,&quot;&quot;],&quot;anchor&quot;:[0,&quot;&quot;],&quot;selectorKind&quot;:[0,&quot;blockId&quot;],&quot;sourcePath&quot;:[0,&quot;lessonBlocks[5].blockId&quot;],&quot;previousKey&quot;:[0,&quot;authored_reading_section_4&quot;],&quot;previousTitle&quot;:[0,&quot;3. Travel Money Feels Different&quot;],&quot;previousPhase&quot;:[0,&quot;meaning&quot;],&quot;nextKey&quot;:[0,&quot;authored_reading_section_6&quot;],&quot;nextTitle&quot;:[0,&quot;5. Shops Make Fast Decisions Feel Natural&quot;],&quot;nextPhase&quot;:[0,&quot;meaning&quot;],&quot;sameTypePreviousKey&quot;:[0,&quot;authored_reading_section_4&quot;],&quot;sameTypeNextKey&quot;:[0,&quot;authored_reading_section_6&quot;],&quot;connectionLabel&quot;:[0,&quot;meaning -&gt; meaning -&gt; meaning&quot;]}],[0,{&quot;key&quot;:[0,&quot;authored_reading_section_6&quot;],&quot;blockId&quot;:[0,&quot;authored_reading_section_6&quot;],&quot;type&quot;:[0,&quot;authored_context&quot;],&quot;typeIndex&quot;:[0,5],&quot;index&quot;:[0,6],&quot;title&quot;:[0,&quot;5. Shops Make Fast Decisions Feel Natural&quot;],&quot;preview&quot;:[0,&quot;Impulse buying is not only a personal weakness. Research on impulse buying shows that quick purchases come from both internal and external factors. Internal factors include mood, tiredness, excitement, self-control, and the wish for pleasure. External factors include displays, prices, promotions, product placement, music, smell, lighting, and the behavior of other people. Tourist shops often combine many of these signals. The objects are small. The prices look manageable. The displays are colorful. The seller may be friendly. Friends or family may react with approval. The buyer may be tired, excited, or short on time. Together, these signals reduce the feeling of risk. Buying becomes the easy action. Walking away becomes the action that needs effort.&quot;],&quot;family&quot;:[0,&quot;support&quot;],&quot;role&quot;:[0,&quot;forward-context&quot;],&quot;actionPattern&quot;:[0,&quot;read&quot;],&quot;phase&quot;:[0,&quot;meaning&quot;],&quot;style&quot;:[0,&quot;&quot;],&quot;anchor&quot;:[0,&quot;&quot;],&quot;selectorKind&quot;:[0,&quot;blockId&quot;],&quot;sourcePath&quot;:[0,&quot;lessonBlocks[6].blockId&quot;],&quot;previousKey&quot;:[0,&quot;authored_reading_section_5&quot;],&quot;previousTitle&quot;:[0,&quot;4. Scarcity Creates Future Regret&quot;],&quot;previousPhase&quot;:[0,&quot;meaning&quot;],&quot;nextKey&quot;:[0,&quot;authored_reading_section_7&quot;],&quot;nextTitle&quot;:[0,&quot;6. Souvenirs Can Carry Identity And Social Meaning&quot;],&quot;nextPhase&quot;:[0,&quot;meaning&quot;],&quot;sameTypePreviousKey&quot;:[0,&quot;authored_reading_section_5&quot;],&quot;sameTypeNextKey&quot;:[0,&quot;authored_reading_section_7&quot;],&quot;connectionLabel&quot;:[0,&quot;meaning -&gt; meaning -&gt; meaning&quot;]}],[0,{&quot;key&quot;:[0,&quot;authored_reading_section_7&quot;],&quot;blockId&quot;:[0,&quot;authored_reading_section_7&quot;],&quot;type&quot;:[0,&quot;authored_context&quot;],&quot;typeIndex&quot;:[0,6],&quot;index&quot;:[0,7],&quot;title&quot;:[0,&quot;6. Souvenirs Can Carry Identity And Social Meaning&quot;],&quot;preview&quot;:[0,&quot;People also buy meanings about themselves. On vacation, a person may feel more relaxed, more adventurous, more cultured, more romantic, or more connected to nature. A souvenir can support that temporary identity. This explains why an object can feel perfect during the trip and strange at home. The object matched the vacation self, not the ordinary self. Souvenirs are also social. A gift can say, \&quot;I remembered you.\&quot; In some families and cultures, bringing something back is a normal way to show care. Even a simple snack box can carry relationship meaning. So a souvenir may be useless as an object but useful as a message.&quot;],&quot;family&quot;:[0,&quot;support&quot;],&quot;role&quot;:[0,&quot;forward-context&quot;],&quot;actionPattern&quot;:[0,&quot;read&quot;],&quot;phase&quot;:[0,&quot;meaning&quot;],&quot;style&quot;:[0,&quot;&quot;],&quot;anchor&quot;:[0,&quot;&quot;],&quot;selectorKind&quot;:[0,&quot;blockId&quot;],&quot;sourcePath&quot;:[0,&quot;lessonBlocks[7].blockId&quot;],&quot;previousKey&quot;:[0,&quot;authored_reading_section_6&quot;],&quot;previousTitle&quot;:[0,&quot;5. Shops Make Fast Decisions Feel Natural&quot;],&quot;previousPhase&quot;:[0,&quot;meaning&quot;],&quot;nextKey&quot;:[0,&quot;authored_reading_section_8&quot;],&quot;nextTitle&quot;:[0,&quot;7. The After-Trip Problem&quot;],&quot;nextPhase&quot;:[0,&quot;meaning&quot;],&quot;sameTypePreviousKey&quot;:[0,&quot;authored_reading_section_6&quot;],&quot;sameTypeNextKey&quot;:[0,&quot;authored_reading_section_8&quot;],&quot;connectionLabel&quot;:[0,&quot;meaning -&gt; meaning -&gt; meaning&quot;]}],[0,{&quot;key&quot;:[0,&quot;authored_reading_section_8&quot;],&quot;blockId&quot;:[0,&quot;authored_reading_section_8&quot;],&quot;type&quot;:[0,&quot;authored_context&quot;],&quot;typeIndex&quot;:[0,7],&quot;index&quot;:[0,8],&quot;title&quot;:[0,&quot;7. The After-Trip Problem&quot;],&quot;preview&quot;:[0,&quot;The psychology changes again when the person returns home. The vacation context disappears. The shop music is gone. The beach, street, museum, and travel mood are gone. The object now has to live inside normal life. This is when regret can change direction. Before buying, the person may fear missing the chance. After buying, the person may regret the clutter, the money, or the weak connection to daily life. The object was not necessarily a bad purchase. It may still protect a memory. But if it has no place, no use, no real story, and no strong emotional link, it becomes clutter.&quot;],&quot;family&quot;:[0,&quot;support&quot;],&quot;role&quot;:[0,&quot;forward-context&quot;],&quot;actionPattern&quot;:[0,&quot;read&quot;],&quot;phase&quot;:[0,&quot;meaning&quot;],&quot;style&quot;:[0,&quot;&quot;],&quot;anchor&quot;:[0,&quot;&quot;],&quot;selectorKind&quot;:[0,&quot;blockId&quot;],&quot;sourcePath&quot;:[0,&quot;lessonBlocks[8].blockId&quot;],&quot;previousKey&quot;:[0,&quot;authored_reading_section_7&quot;],&quot;previousTitle&quot;:[0,&quot;6. Souvenirs Can Carry Identity And Social Meaning&quot;],&quot;previousPhase&quot;:[0,&quot;meaning&quot;],&quot;nextKey&quot;:[0,&quot;authored_reading_section_9&quot;],&quot;nextTitle&quot;:[0,&quot;8. A Cleaner Buying Test&quot;],&quot;nextPhase&quot;:[0,&quot;meaning&quot;],&quot;sameTypePreviousKey&quot;:[0,&quot;authored_reading_section_7&quot;],&quot;sameTypeNextKey&quot;:[0,&quot;authored_reading_section_9&quot;],&quot;connectionLabel&quot;:[0,&quot;meaning -&gt; meaning -&gt; meaning&quot;]}],[0,{&quot;key&quot;:[0,&quot;authored_reading_section_9&quot;],&quot;blockId&quot;:[0,&quot;authored_reading_section_9&quot;],&quot;type&quot;:[0,&quot;authored_context&quot;],&quot;typeIndex&quot;:[0,8],&quot;index&quot;:[0,9],&quot;title&quot;:[0,&quot;8. A Cleaner Buying Test&quot;],&quot;preview&quot;:[0,&quot;The most useful test is not \&quot;Do I need this?\&quot; Many meaningful things are not strictly needed. A better test is: \&quot;What job will this object do after the trip?\&quot; If the job is clear, the purchase may make sense. It may remind you of a person. It may support a local maker. It may become a real gift. It may be used often. It may hold a memory that matters. If the job is only hurry, pressure, panic, or fear of missing out, the object is probably not the best memory tool. A photo, a short note, one better gift, or a slower walk through the place may do the job with less clutter.&quot;],&quot;family&quot;:[0,&quot;support&quot;],&quot;role&quot;:[0,&quot;forward-context&quot;],&quot;actionPattern&quot;:[0,&quot;read&quot;],&quot;phase&quot;:[0,&quot;meaning&quot;],&quot;style&quot;:[0,&quot;&quot;],&quot;anchor&quot;:[0,&quot;&quot;],&quot;selectorKind&quot;:[0,&quot;blockId&quot;],&quot;sourcePath&quot;:[0,&quot;lessonBlocks[9].blockId&quot;],&quot;previousKey&quot;:[0,&quot;authored_reading_section_8&quot;],&quot;previousTitle&quot;:[0,&quot;7. The After-Trip Problem&quot;],&quot;previousPhase&quot;:[0,&quot;meaning&quot;],&quot;nextKey&quot;:[0,&quot;authored_reading_section_10&quot;],&quo 0,&quot;2. Education Plus Entertainment&quot;],&quot;preview&quot;:[0,&quot;Sesame Street became famous because it did not feel like a normal lesson. It mixed teaching with entertainment. A child could see a funny scene, hear a song, watch a short animation, and meet a real person on the street. This mix matters because attention is part of learning. If children are bored, they stop watching. If the show is only noise, they may laugh but learn little. Sesame Street tried to stay in the middle: fun enough to hold attention, but clear enough to teach. The show also used repetition. A letter, number, word, or social idea could appear again in different forms. Repetition helps children remember, but the different scenes keep the lesson fresh.&quot;],&quot;family&quot;:[0,&quot;forward&quot;],&quot;role&quot;:[0,&quot;forward-context&quot;],&quot;actionPattern&quot;:[0,&quot;read&quot;],&quot;phase&quot;:[0,&quot;meaning&quot;],&quot;style&quot;:[0,&quot;&quot;],&quot;anchor&quot;:[0,&quot;&quot;],&quot;selectorKind&quot;:[0,&quot;blockId&quot;],&quot;sourcePath&quot;:[0,&quot;lessonBlocks[6].blockId&quot;],&quot;previousKey&quot;:[0,&quot;authored_reading_check_2&quot;],&quot;previousTitle&quot;:[0,&quot;Why did television seem useful for early learning?&quot;],&quot;previousPhase&quot;:[0,&quot;check&quot;],&quot;nextKey&quot;:[0,&quot;authored_reading_check_3&quot;],&quot;nextTitle&quot;:[0,&quot;Why did Sesame Street mix education with entertainment?&quot;],&quot;nextPhase&quot;:[0,&quot;check&quot;],&quot;sameTypePreviousKey&quot;:[0,&quot;authored_reading_section_2&quot;],&quot;sameTypeNextKey&quot;:[0,&quot;authored_reading_section_4&quot;],&quot;connectionLabel&quot;:[0,&quot;check -&gt; meaning -&gt; check&quot;]}],[0,{&quot;key&quot;:[0,&quot;authored_reading_check_3&quot;],&quot;blockId&quot;:[0,&quot;authored_reading_check_3&quot;],&quot;type&quot;:[0,&quot;micro_quiz&quot;],&quot;typeIndex&quot;:[0,2],&quot;index&quot;:[0,7],&quot;title&quot;:[0,&quot;Why di nity.&quot;],&quot;family&quot;:[0,&quot;forward&quot;],&quot;role&quot;:[0,&quot;forward-context&quot;],&quot;actionPattern&quot;:[0,&quot;read&quot;],&quot;phase&quot;:[0,&quot;meaning&quot;],&quot;style&quot;:[0,&quot;&quot;],&quot;anchor&quot;:[0,&quot;&quot;],&quot;selectorKind&quot;:[0,&quot;blockId&quot;],&quot;sourcePath&quot;:[0,&quot;lessonBlocks[8].blockId&quot;],&quot;previousKey&quot;:[0,&quot;authored_reading_check_3&quot;],&quot;previousTitle&quot;:[0,&quot;Why did Sesame Street mix education with entertainment?&quot;],&quot;previousPhase&quot;:[0,&quot;check&quot;],&quot;nextKey&quot;:[0,&quot;authored_reading_check_4&quot;],&quot;nextTitle&quot;:[0,&quot;What feeling does the title Sesame Street create?&quot;],&quot;nextPhase&quot;:[0,&quot;check&quot;],&quot;sameTypePreviousKey&quot;:[0,&quot;authored_reading_section_3&quot;],&quot;sameTypeNextKey&quot;:[0,&quot;authored_reading_section_5&quot;],&quot;connectionLabel&quot;:[0,&quot;check -&gt; meaning -&gt; check&quot;]}],[0,{&quot;key&quot;:[0,&quot;authored_reading_check_4&quot;],&quot;blockId&quot;:[0,&quot;authored_reading_check_4&quot;],&quot;type&quot;:[0,&quot;micro_quiz&quot;],&quot;typeIndex&quot;:[0,3],&quot;index&quot;:[0,9],&quot;title&quot;:[0,&quot;What feeling does the title Sesame Street create?&quot;],&quot;preview&quot;:[0,&quot;What feeling does the title Sesame Street create?&quot;],&quot;family&quot;:[0,&quot;practice&quot;],&quot;role&quot;:[0,&quot;understanding-check&quot;],&quot;actionPattern&quot;:[0,&quot;reveal-answer&quot;],&quot;phase&quot;:[0,&quot;check&quot;],&quot;style&quot;:[0,&quot;&quot;],&quot;anchor&quot;:[0,&quot;&quot;],&quot;selectorKind&quot;:[0,&quot;blockId&quot;],&quot;sourcePath&quot;:[0,&quot;lessonBlocks[9].blockId&quot;],&quot;previousKey&quot;:[0,&quot;authored_reading_section_4&quot;],&quot;previousTitle&quot;:[0,&quot;3. Why It Is Called Sesame Street&quot;],&quot;previousPhase&quot;:[0,&quot;meaning&quot;],&quot;nextKey&quot;:[0,&quot;authored_ k_7&quot;],&quot;nextTitle&quot;:[0,&quot;Choose one player. What was that player&#39;s clear strength?&quot;],&quot;nextPhase&quot;:[0,&quot;check&quot;],&quot;sameTypePreviousKey&quot;:[0,&quot;authored_reading_section_6&quot;],&quot;sameTypeNextKey&quot;:[0,&quot;authored_reading_section_8&quot;],&quot;connectionLabel&quot;:[0,&quot;check -&gt; meaning -&gt; check&quot;]}],[0,{&quot;key&quot;:[0,&quot;authored_reading_check_7&quot;],&quot;blockId&quot;:[0,&quot;authored_reading_check_7&quot;],&quot;type&quot;:[0,&quot;micro_quiz&quot;],&quot;typeIndex&quot;:[0,6],&quot;index&quot;:[0,15],&quot;title&quot;:[0,&quot;Choose one player. What was that player&#39;s clear strength?&quot;],&quot;preview&quot;:[0,&quot;Choose one player. What was that player&#39;s clear strength?&quot;],&quot;family&quot;:[0,&quot;practice&quot;],&quot;role&quot;:[0,&quot;understanding-check&quot;],&quot;actionPattern&quot;:[0,&quot;reveal-answer&quot;],&quot;phase&quot;:[0,&quot;check&quot;],&quot;style&quot;:[0,&quot;&quot;],&quot;anchor&quot;:[0,&quot;&quot;],&quot;selectorKind&quot;:[0,&quot;blockId&quot;],&quot;sourcePath&quot;:[0,&quot;lessonBlocks[15].blockId&quot;],&quot;previousKey&quot;:[0,&quot;authored_reading_section_7&quot;],&quot;previousTitle&quot;:[0,&quot;6. Great Players, Different Strengths&quot;],&quot;previousPhase&quot;:[0,&quot;meaning&quot;],&quot;nextKey&quot;:[0,&quot;authored_reading_section_8&quot;],&quot;nextTitle&quot;:[0,&quot;7. How to Watch One Point Better&quot;],&quot;nextPhase&quot;:[0,&quot;meaning&quot;],&quot;sameTypePreviousKey&quot;:[0,&quot;authored_reading_check_6&quot;],&quot;sameTypeNextKey&quot;:[0,&quot;authored_reading_check_8&quot;],&quot;connectionLabel&quot;:[0,&quot;meaning -&gt; check -&gt; meaning&quot;]}],[0,{&quot;key&quot;:[0,&quot;authored_reading_section_8&quot;],&quot;blockId&quot;:[0,&quot;authored_reading_section_8&quot;],&quot;type&quot;:[0,&quot;authored_context&quot;],&quot;typeIndex&quot;:[0,7],&quot;index&quot;:[0,16],&quot;title&quot;:[0,&quot;7. How to Watch One Point Better&quot;],&quot;preview&quot;:[0,&quot;When you watch tennis, do not watch only the ball. Watch the first choice. Where did the serve go? Wide, to the body, or down the middle? Then watch the return. Was it deep, short, safe, or aggressive? Next, watch who controls the space. One player may push the other player back with a deep shot. Then the player may hit wide to open the court. The point becomes a small story: serve, return, control, pressure, and finish. You can use five simple questions: - Where did the serve go? - Was the return deep or short? - Who moved the other player first? - Did the player attack open space? - Did the score make the shot harder? This watching plan makes tennis clearer. You begin to see why a player wins before the final shot.&quot;],&quot;family&quot;:[0,&quot;forward&quot;],&quot;role&quot;:[0,&quot;forward-context&quot;],&quot;actionPattern&quot;:[0,&quot;read&quot;],&quot;phase&quot;:[0,&quot;meaning&quot;],&quot;style&quot;:[0,&quot;&quot;],&quot;anchor&quot;:[0,&quot;&quot;],&quot;selectorKind&quot;:[0,&quot;blockId&quot;],&quot;sourcePath&quot;:[0,&quot;lessonBlocks[16].blockId&quot;],&quot;previousKey&quot;:[0,&quot;authored_reading_check_7&quot;],&quot;previousTitle&quot;:[0,&quot;Choose one player. What was that player&#39;s clear strength?&quot;],&quot;previousPhase&quot;:[0,&quot;check&quot;],&quot;nextKey&quot;:[0,&quot;authored_reading_check_8&quot;],&quot;nextTitle&quot;:[0,&quot;What should you watch after the serve?&quot;],&quot;nextPhase&quot;:[0,&quot;check&quot;],&quot;sameTypePreviousKey&quot;:[0,&quot;authored_reading_section_7&quot;],&quot;sameTypeNextKey&quot;:[0,&quot;&quot;],&quot;connectionLabel&quot;:[0,&quot;check -&gt; meaning -&gt; check&quot;]}],[0,{&quot;key&quot;:[0,&quot;authored_reading_check_8&quot;],&quot;blockId&quot;:[0,&quot;authored_reading_check_8&quot;],&quot;type&quot;:[0,&quot;micro_quiz&quot;],&quot;typeIndex&quot;:[0,7],&quot;index&quot;
