imply entering your eyes and appearing in your mind. But your brain is not outside in the room. It sits inside a dark skull. It does not directly touch the table or the wall. It receives signals from the eyes, ears, skin, nose, and body. Those signals are useful, but they are not a finished picture of reality. So the brain has a problem. It must ask, \&quot;What is probably out there? What is probably happening? What should this body do next?\&quot; This is why some scientists describe perception as active. The brain is not only receiving the world. It is also making its best guess about the world.&quot;],&quot;family&quot;:[0,&quot;support&quot;],&quot;role&quot;:[0,&quot;forward-context&quot;],&quot;actionPattern&quot;:[0,&quot;read&quot;],&quot;phase&quot;:[0,&quot;meaning&quot;],&quot;style&quot;:[0,&quot;&quot;],&quot;anchor&quot;:[0,&quot;&quot;],&quot;selectorKind&quot;:[0,&quot;blockId&quot;],&quot;sourcePath&quot;:[0,&quot;lessonBlocks[2].blockId&quot;],&quot;previousKey&quot;:[0,&quot;authored_reading_warmup&quot;],&quot;previousTitle&quot;:[0,&quot;Warm-Up Questions&quot;],&quot;previousPhase&quot;:[0,&quot;opening&quot;],&quot;nextKey&quot;:[0,&quot;authored_reading_check_1&quot;],&quot;nextTitle&quot;:[0,&quot;Why is perception not as simple as a camera recording the world?&quot;],&quot;nextPhase&quot;:[0,&quot;check&quot;],&quot;sameTypePreviousKey&quot;:[0,&quot;&quot;],&quot;sameTypeNextKey&quot;:[0,&quot;authored_reading_section_2&quot;],&quot;connectionLabel&quot;:[0,&quot;opening -&gt; meaning -&gt; check&quot;]}],[0,{&quot;key&quot;:[0,&quot;authored_reading_check_1&quot;],&quot;blockId&quot;:[0,&quot;authored_reading_check_1&quot;],&quot;type&quot;:[0,&quot;micro_quiz&quot;],&quot;typeIndex&quot;:[0,0],&quot;index&quot;:[0,3],&quot;title&quot;:[0,&quot;Why is perception not as simple as a camera recording the world?&quot;],&quot;preview&quot;:[0,&quot;Why is perception not as simple as a camera recording the world?&quot;],&quot;family&quot;:[0,&quot;support&quot;],&quot;role&quot;:[0,&quot;understanding-check&quot;],&quot;actionPattern&quot;:[0,&quot;reveal-answer&quot;],&quot;phase&quot;:[0,&quot;check&quot;],&quot;style&quot;:[0,&quot;&quot;],&quot;anchor&quot;:[0,&quot;&quot;],&quot;selectorKind&quot;:[0,&quot;blockId&quot;],&quot;sourcePath&quot;:[0,&quot;lessonBlocks[3].blockId&quot;],&quot;previousKey&quot;:[0,&quot;authored_reading_section_1&quot;],&quot;previousTitle&quot;:[0,&quot;1. The Room Feels Direct&quot;],&quot;previousPhase&quot;:[0,&quot;meaning&quot;],&quot;nextKey&quot;:[0,&quot;authored_reading_section_2&quot;],&quot;nextTitle&quot;:[0,&quot;2. Prediction Comes Before Correction&quot;],&quot;nextPhase&quot;:[0,&quot;meaning&quot;],&quot;sameTypePreviousKey&quot;:[0,&quot;&quot;],&quot;sameTypeNextKey&quot;:[0,&quot;authored_reading_check_2&quot;],&quot;connectionLabel&quot;:[0,&quot;meaning -&gt; check -&gt; meaning&quot;]}],[0,{&quot;key&quot;:[0,&quot;authored_reading_section_2&quot;],&quot;blockId&quot;:[0,&quot;authored_reading_section_2&quot;],&quot;type&quot;:[0,&quot;authored_context&quot;],&quot;typeIndex&quot;:[0,1],&quot;index&quot;:[0,4],&quot;title&quot;:[0,&quot;2. Prediction Comes Before Correction&quot;],&quot;preview&quot;:[0,&quot;Imagine you hear a noise behind you. Before you turn around, your brain already begins to predict what it might be. Maybe it is a door. Maybe it is a friend. Maybe it is your phone falling from a table. Maybe it is danger. The brain uses memory, context, and expectation to prepare a possible answer. Then new sensory information checks that answer. If the prediction is wrong, the brain updates the model. This is sometimes called predictive processing. A simple way to say it is this: The brain predicts first, then corrects. This does not mean the outside world is imaginary. It means experience is a meeting between the outside world and the brain&#39;s model. When the model works well, the world feels stable. You walk through a doorway without thinking about every piece of light. You understand a friend&#39;s face quickly. You hear a sentence even when the room is a little noisy. The model is not perfect truth. It is useful reality.&quot;],&quot;family&quot;:[0,&quot;support&quot;],&quot;role&quot;:[0,&quot;forward-context&quot;],&quot;actionPattern&quot;:[0,&quot;read&quot;],&quot;phase&quot;:[0,&quot;meaning&quot;],&quot;style&quot;:[0,&quot;&quot;],&quot;anchor&quot;:[0,&quot;&quot;],&quot;selectorKind&quot;:[0,&quot;blockId&quot;],&quot;sourcePath&quot;:[0,&quot;lessonBlocks[4].blockId&quot;],&quot;previousKey&quot;:[0,&quot;authored_reading_check_1&quot;],&quot;previousTitle&quot;:[0,&quot;Why is perception not as simple as a camera recording the world?&quot;],&quot;previousPhase&quot;:[0,&quot;check&quot;],&quot;nextKey&quot;:[0,&quot;authored_reading_check_2&quot;],&quot;nextTitle&quot;:[0,&quot;What happens when the brain&#39;s prediction is wrong?&quot;],&quot;nextPhase&quot;:[0,&quot;check&quot;],&quot;sameTypePreviousKey&quot;:[0,&quot;authored_reading_section_1&quot;],&quot;sameTypeNextKey&quot;:[0,&quot;authored_reading_section_3&quot;],&quot;connectionLabel&quot;:[0,&quot;check -&gt; meaning -&gt; check&quot;]}],[0,{&quot;key&quot;:[0,&quot;authored_reading_check_2&quot;],&quot;blockId&quot;:[0,&quot;authored_reading_check_2&quot;],&quot;type&quot;:[0,&quot;micro_quiz&quot;],&quot;typeIndex&quot;:[0,1],&quot;index&quot;:[0,5],&quot;title&quot;:[0,&quot;What happens when the brain&#39;s prediction is wrong?&quot;],&quot;preview&quot;:[0,&quot;What happens when the brain&#39;s prediction is wrong?&quot;],&quot;family&quot;:[0,&quot;support&quot;],&quot;role&quot;:[0,&quot;understanding-check&quot;],&quot;actionPattern&quot;:[0,&quot;reveal-answer&quot;],&quot;phase&quot;:[0,&quot;check&quot;],&quot;style&quot;:[0,&quot;&quot;],&quot;anchor&quot;:[0,&quot;&quot;],&quot;selectorKind&quot;:[0,&quot;blockId&quot;],&quot;sourcePath&quot;:[0,&quot;lessonBlocks[5].blockId&quot;],&quot;previousKey&quot;:[0,&quot;authored_reading_section_2&quot;],&quot;previousTitle&quot;:[0,&quot;2. Prediction Comes Before Correction&quot;],&quot;previousPhase&quot;:[0,&quot;meaning&quot;],&quot;nextKey&quot;:[0,&quot;authored_reading_section_3&quot;],&quot;nextTitle&quot;:[0,&quot;3. Reality as a Survival Dashboard&quot;],&quot;nextPhase&quot;:[0,&quot;meaning&quot;],&quot;sameTypePreviousKey&quot;:[0,&quot;authored_reading_check_1&quot;],&quot;sameTypeNextKey&quot;:[0,&quot;authored_reading_check_3&quot;],&quot;connectionLabel&quot;:[0,&quot;meaning -&gt; check -&gt; meaning&quot;]}],[0,{&quot;key&quot;:[0,&quot;authored_reading_section_3&quot;],&quot;blockId&quot;:[0,&quot;authored_reading_section_3&quot;],&quot;type&quot;:[0,&quot;authored_context&quot;],&quot;typeIndex&quot;:[0,2],&quot;index&quot;:[0,6],&quot;title&quot;:[0,&quot;3. Reality as a Survival Dashboard&quot;],&quot;preview&quot;:[0,&quot;A car dashboard does not show the full engine. It shows speed, fuel, temperature, and warning lights. That is enough for the driver to act. Perception may work in a similar way. The brain does not need to show every atom, wave, force, and hidden process. It needs to show what matters for this body now. Is that object near or far? Is that person angry or friendly? Is that food safe? Is that sound important? This is why your experience is powerful but selective. The brain highlights what it thinks you need. It reduces many details. It turns a complicated world into colors, sounds, objects, distances, emotions, and stories. The dashboard is not fake. But it is not the whole engine. In the same way, your world is not fake. But your experience of the world is shaped.&quot;],&quot;family&quot;:[0,&quot;support&quot;],&quot;role&quot;:[0,&quot;forward-context&quot;],&quot;actionPattern&quot;:[0,&quot;read&quot;],&quot;phase&quot;:[0,&quot;meaning&quot;],&quot;style&quot;:[0,&quot;&quot;],&quot;anchor&quot;:[0,&quot;&quot;],&quot;selectorKind&quot;:[0,&quot;blockId&quot;],&quot;sourcePath&quot;:[0,&quot;lessonBlocks[6].blockId&quot;],&quot;previousKey&quot;:[0,&quot;authored_reading_check_2&quot;],&quot;previousTitle&quot;:[0,&quot;What happens when the brain&#39;s prediction is wrong?&quot;],&quot;previousPhase&quot;:[0,&quot;check&quot;],&quot;nextKey&quot;:[0,&quot;authored_reading_check_3&quot;],&quot;nextTitle&quot;:[0,&quot;Why does the lesson compare perception to a dashboard?&quot;],&quot;nextPhase&quot;:[0,&quot;check&quot;],&quot;sameTypePreviousKey&quot;:[0,&quot;authored_reading_section_2&quot;],&quot;sameTypeNextKey&quot;:[0,&quot;authored_reading_section_4&quot;],&quot;connectionLabel&quot;:[0,&quot;check -&gt; meaning -&gt; check&quot;]}],[0,{&quot;key&quot;:[0,&quot;authored_reading_check_3&quot;],&quot;blockId&quot;:[0,&quot;authored_reading_check_3&quot;],&quot;type&quot;:[0,&quot;micro_quiz&quot;],&quot;typeIndex&quot;:[0,2],&quot;index&quot;:[0,7],&quot;title&quot;:[0,&quot;Why does the lesson compare perception to a dashboard?&quot;],&quot;preview&quot;:[0,&quot;Why does the lesson compare perception to a dashboard?&quot;],&quot;family&quot;:[0,&quot;support&quot;],&quot;role&quot;:[0,&quot;understanding-check&quot;],&quot;actionPattern&quot;:[0,&quot;reveal-answer&quot;],&quot;phase&quot;:[0,&quot;check&quot;],&quot;style&quot;:[0,&quot;&quot;],&quot;anchor&quot;:[0,&quot;&quot;],&quot;selectorKind&quot;:[0,&quot;blockId&quot;],&quot;sourcePath&quot;:[0,&quot;lessonBlocks[7].blockId&quot;],&quot;previousKey&quot;:[0,&quot;authored_reading_section_3&quot;],&quot;previousTitle&quot;:[0,&quot;3. Reality as a Survival Dashboard&quot;],&quot;previousPhase&quot;:[0,&quot;meaning&quot;],&quot;nextKey&quot;:[0,&quot;authored_reading_section_4&quot;],&quot;nextTitle&quot;:[0,&quot;4. The Self Is Also a Model&quot;],&quot;nextPhase&quot;:[0,&quot;meaning&quot;],&quot;sameTypePreviousKey&quot;:[0,&quot;authored_reading_check_2&quot;],&quot;sameTypeNextKey&quot;:[0,&quot;authored_reading_check_4&quot;],&quot;connectionLabel&quot;:[0,&quot;meaning -&gt; check -&gt; meaning&quot;]}],[0,{&quot;key&quot;:[0,&quot;authored_reading_section_4&quot;],&quot;blockId&quot;:[0,&quot;authored_reading_section_4&quot;],&quot;type&quot;:[0,&quot;authored_context&quot;],&quot;typeIndex&quot;:[0,3],&quot;index&quot;:[0,8],&quot;title&quot;:[0,&quot;4. The Self Is Also a Model&quot;],&quot;preview&quot;:[0,&quot;Now the idea becomes more personal. The brain does not only build a model of tables, rooms, voices, and faces. It also builds a model of \&quot;me.\&quot; This model is very useful. It helps the body survive. It helps you remember your past, plan your future, protect your body, explain your actions, and live with other people. But the self may not be a tiny person sitting behind your eyes. It may be a pattern made by the brain. You can feel this in ordinary life. Sometimes your self feels strong: \&quot;I know who I am. I know what I want.\&quot; At other times, the self feels softer. During deep music, prayer, meditation, sport, art, or love, people sometimes feel less separate from the world. The important point is not \&quot;the self is useless.\&quot; The point is more careful: The self is useful, but it is constructed.&quot;],&quot;family&quot;:[0,&quot;support&quot;],&quot;role&quot;:[0,&quot;forward-context&quot;],&quot;actionPattern&quot;:[0,&quot;read&quot;],&quot;phase&quot;:[0,&quot;meaning&quot;],&quot;style&quot;:[0,&quot;&quot;],&quot;anchor&quot;:[0,&quot;&quot;],&quot;selectorKind&quot;:[0,&quot;blockId&quot;],&quot;sourcePath&quot;:[0,&quot;lessonBlocks[8].blockId&quot;],&quot;previousKey&quot;:[0,&quot;authored_reading_check_3&quot;],&quot;previousTitle&quot;:[0,&quot;Why does the lesson compare perception to a dashboard?&quot;],&quot;previousPhase&quot;:[0,&quot;check&quot;],&quot;nextKey&quot;:[0,&quot;authored_reading_check_4&quot;],&quot;nextTitle&quot;:[0,&quot;Why is the self-model useful?&quot;],&quot;nextPhase&quot;:[0,&quot;check&quot;],&quot;sameTypePreviousKey&quot;:[0,&quot;autho ndering, autobiographical memory, and thinking about the past or future. In simple words, the DMN is related to the brain&#39;s habit of building a personal story: Who am I? What happened to me? What will happen next? What do other people think about me? This story can help us. It lets us learn from experience and plan. But it can also trap us. For example, a person may think, \&quot;I always fail,\&quot; \&quot;Nobody respects me,\&quot; or \&quot;This feeling will never change.\&quot; These thoughts may feel like reality. But they may be strong predictions, not final truth. The brain needs order. But too much order can become a prison.&quot;],&quot;family&quot;:[0,&quot;support&quot;],&quot;role&quot;:[0,&quot;forward-context&quot;],&quot;actionPattern&quot;:[0,&quot;read&quot;],&quot;phase&quot;:[0,&quot;meaning&quot;],&quot;style&quot;:[0,&quot;&quot;],&quot;anchor&quot;:[0,&quot;&quot;],&quot;selectorKind&quot;:[0,&quot;blockId&quot;],&quot;sourcePath&quot;:[0,&quot;lessonBlocks[10].blockId&quot;],&quot;previousKey&quot;:[0,&quot;authored_reading_check_4&quot;],&quot;previousTitle&quot;:[0,&quot;Why is the self-model useful?&quot;],&quot;previousPhase&quot;:[0,&quot;check&quot;],&quot;nextKey&quot;:[0,&quot;authored_reading_check_5&quot;],&quot;nextTitle&quot;:[0,&quot;What kinds of mental activity are often linked with the default mode network?&quot;],&quot;nextPhase&quot;:[0,&quot;check&quot;],&quot;sameTypePreviousKey&quot;:[0,&quot;authored_reading_section_4&quot;],&quot;sameTypeNextKey&quot;:[0,&quot;authored_reading_section_6&quot;],&quot;connectionLabel&quot;:[0,&quot;check -&gt; meaning -&gt; check&quot;]}],[0,{&quot;key&quot;:[0,&quot;authored_reading_check_5&quot;],&quot;blockId&quot;:[0,&quot;authored_reading_check_5&quot;],&quot;type&quot;:[0,&quot;micro_quiz&quot;],&quot;typeIndex&quot;:[0,4],&quot;index&quot;:[0,11],&quot;title&quot;:[0,&quot;What kinds of mental activity are often linked with the default mode network?&quot;],&quot;preview&quot;:[0,&quot;What kinds of mental activity are often linked with the default mode network?&quot;],&quot;family&quot;:[0,&quot;support&quot;],&quot;role&quot;:[0,&quot;understanding-check&quot;],&quot;actionPattern&quot;:[0,&quot;reveal-answer&quot;],&quot;phase&quot;:[0,&quot;check&quot;],&quot;style&quot;:[0,&quot;&quot;],&quot;anchor&quot;:[0,&quot;&quot;],&quot;selectorKind&quot;:[0,&quot;blockId&quot;],&quot;sourcePath&quot;:[0,&quot;lessonBlocks[11].blockId&quot;],&quot;previousKey&quot;:[0,&quot;authored_reading_section_5&quot;],&quot;previousTitle&quot;:[0,&quot;5. The Default Mode Network&quot;],&quot;previousPhase&quot;:[0,&quot;meaning&quot;],&quot;nextKey&quot;:[0,&quot;authored_reading_section_6&quot;],&quot;nextTitle&quot;:[0,&quot;6. Psychedelics as a Research Window&quot;],&quot;nextPhase&quot;:[0,&quot;meaning&quot;],&quot;sameTypePreviousKey&quot;:[0,&quot;authored_reading_check_4&quot;],&quot;sameTypeNextKey&quot;:[0,&quot;authored_reading_check_6&quot;],&quot;connectionLabel&quot;:[0,&quot;meaning -&gt; check -&gt; meaning&quot;]}],[0,{&quot;key&quot;:[0,&quot;authored_reading_section_6&quot;],&quot;blockId&quot;:[0,&quot;authored_reading_section_6&quot;],&quot;type&quot;:[0,&quot;authored_context&quot;],&quot;typeIndex&quot;:[0,5],&quot;index&quot;:[0,12],&quot;title&quot;:[0,&quot;6. Psychedelics as a Research Window&quot;],&quot;preview&quot;:[0,&quot;Classic psychedelics, such as psilocybin, can strongly change perception, emotion, and the sense of self. Scientists study them partly because they can show how flexible normal consciousness may be. This does not mean psychedelics reveal the final truth about reality. It is more careful to say that they may reveal how much the brain normally constructs and controls experience. Some studies suggest that psychedelics can disrupt usual patterns in the default mode network and increase communication between brain networks that do not usually talk as much. Researchers connect this with unusual perception, intense emotion, and experiences in which the self feels less fixed. But this topic needs care. These substances can carry serious risks, especially outside controlled research or clinical settings. The legal status also depends on place and context. This lesson is for understanding ideas, not for telling anyone what to do. Good science does not need hype. It needs clear language, careful limits, and respect for risk.&quot;],&quot;family&quot;:[0,&quot;support&quot;],&quot;role&quot;:[0,&quot;forward-context&quot;],&quot;actionPattern&quot;:[0,&quot;read&quot;],&quot;phase&quot;:[0,&quot;meaning&quot;],&quot;style&quot;:[0,&quot;&quot;],&quot;anchor&quot;:[0,&quot;&quot;],&quot;selectorKind&quot;:[0,&quot;blockId&quot;],&quot;sourcePath&quot;:[0,&quot;lessonBlocks[12].blockId&quot;],&quot;previousKey&quot;:[0,&quot;authored_reading_check_5&quot;],&quot;previousTitle&quot;:[0,&quot;What kinds of mental activity are often linked with the default mode network?&quot;],&quot;previousPhase&quot;:[0,&quot;check&quot;],&quot;nextKey&quot;:[0,&quot;authored_reading_check_6&quot;],&quot;nextTitle&quot;:[0,&quot;What is the careful claim about psychedelics in this lesson?&quot;],&quot;nextPhase&quot;:[0,&quot;check&quot;],&quot;sameTypePreviousKey&quot;:[0,&quot;authored_reading_section_5&quot;],&quot;sameTypeNextKey&quot;:[0,&quot;authored_reading_section_7&quot;],&quot;connectionLabel&quot;:[0,&quot;check -&gt; meaning -&gt; check&quot;]}],[0,{&quot;key&quot;:[0,&quot;authored_reading_check_6&quot;],&quot;blockId&quot;:[0,&quot;authored_reading_check_6&quot;],&quot;type&quot;:[0,&quot;micro_quiz&quot;],&quot;typeIndex&quot;:[0,5],&quot;index&quot;:[0,13],&quot;title&quot;:[0,&quot;What is the careful claim about psychedelics in this lesson?&quot;],&quot;preview&quot;:[0,&quot;What is the careful claim about psychedelics in this lesson?&quot;],&quot;family&quot;:[0,&quot;support&quot;],&quot;role&quot;:[0,&quot;understanding-check&quot;],&quot;actionPattern&quot;:[0,&quot;reveal-answer&quot;],&quot;phase&quot;:[0,&quot;check&quot;],&quot;style&quot;:[0,&quot;&quot;],&quot;anchor&quot;:[0,&quot;&quot;],&quot;selectorKind&quot;:[0,&quot;blockId&quot;],&quot;sourcePath&quot;:[0,&quot;lessonBlocks[13].blockId&quot;],&quot;previousKey&quot;:[0,&quot;authored_reading_section_6&quot;],&quot;previousTitle&quot;:[0,&quot;6. Psychedelics as a Research Window&quot;],&quot;previousPhase&quot;:[0,&quot;meaning&quot;],&quot;nextKey&quot;:[0,&quot;authored_reading_section_7&quot;],&quot;nextTitle&quot;:[0,&quot;7. Relaxed Priors&quot;],&quot;nextPhase&quot;:[0,&quot;meaning&quot;],&quot;sameTypePreviousKey&quot;:[0,&quot;authored_reading_check_5&quot;],&quot;sameTypeNextKey&quot;:[0,&quot;authored_reading_check_7&quot;],&quot;connectionLabel&quot;:[0,&quot;meaning -&gt; check -&gt; meaning&quot;]}],[0,{&quot;key&quot;:[0,&quot;authored_reading_section_7&quot;],&quot;blockId&quot;:[0,&quot;authored_reading_section_7&quot;],&quot;type&quot;:[0,&quot;authored_context&quot;],&quot;typeIndex&quot;:[0,6],&quot;index&quot;:[0,14],&quot;title&quot;:[0,&quot;7. Relaxed Priors&quot;],&quot;preview&quot;:[0,&quot;One important idea is called relaxed priors. A prior is an expectation that the brain already has. For example, if you enter your home at night, you expect the furniture to be in familiar places. If you meet your close friend, you expect their face and voice to feel familiar. Priors help the brain save energy. They also help the world feel stable. But some priors are too strong. A person may expect rejection everywhere. Another person may expect danger even when the situation is safe. Another may believe, \&quot;I can never change.\&quot; The REBUS idea, linked with Robin Carhart-Harris and Karl Friston, suggests that psychedelics may relax the precision of high-level priors. In simpler language, the brain&#39;s strongest expectations may temporarily become less powerful. When that happens, bottom-up information may have more room to enter awareness. Colors may feel brighter. Patterns may feel stronger. Emotions may rise. Old stories may loosen. This can sound beautiful, but it can also be intense or difficult. Context, support, and integration matter.&quot;],&quot;family&quot;:[0,&quot;support&quot;],&quot;role&quot;:[0,&quot;forward-context&quot;],&quot;actionPattern&quot;:[0,&quot;read&quot;],&quot;phase&quot;:[0,&quot;meaning&quot;],&quot;style&quot;:[0,&quot;&quot;],&quot;anchor&quot;:[0,&quot;&quot;],&quot;selectorKind&quot;:[0,&quot;blockId&quot;],&quot;sourcePath&quot;:[0,&quot;lessonBlocks[14].blockId&quot;],&quot;previousKey&quot;:[0,&quot;authored_reading_check_6&quot;],&quot;previousTitle&quot;:[0,&quot;What is the careful claim about psychedelics in this lesson?&quot;],&quot;previousPhase&quot;:[0,&quot;check&quot;],&quot;nextKey&quot;:[0,&quot;authored_reading_check_7&quot;],&quot;nextTitle&quot;:[0,&quot;What is a prior?&quot;],&quot;nextPhase&quot;:[0,&quot;check&quot;],&quot;sameTypePreviousKey&quot;:[0,&quot;authored_reading_section_6&quot;],&quot;sameTypeNextKey&quot;:[0,&quot;authored_reading_section_8&quot;],&quot;connectionLabel&quot;:[0,&quot;check -&gt; meaning -&gt; check&quot;]}],[0,{&quot;key&quot;:[0,&quot;authored_reading_check_7&quot;],&quot;blockId&quot;:[0,&quot;authored_reading_check_7&quot;],&quot;type&quot;:[0,&quot;micro_quiz&quot;],&quot;typeIndex&quot;:[0,6],&quot;index&quot;:[0,15],&quot;title&quot;:[0,&quot;What is a prior?&quot;],&quot;preview&quot;:[0,&quot;What is a prior?&quot;],&quot;family&quot;:[0,&quot;support&quot;],&quot;role&quot;:[0,&quot;understanding-check&quot;],&quot;actionPattern&quot;:[0,&quot;reveal-answer&quot;],&quot;phase&quot;:[0,&quot;check&quot;],&quot;style&quot;:[0,&quot;&quot;],&quot;anchor&quot;:[0,&quot;&quot;],&quot;selectorKind&quot;:[0,&quot;blockId&quot;],&quot;sourcePath&quot;:[0,&quot;lessonBlocks[15].blockId&quot;],&quot;previousKey&quot;:[0,&quot;authored_reading_section_7&quot;],&quot;previousTitle&quot;:[0,&quot;7. Relaxed Priors&quot;],&quot;previousPhase&quot;:[0,&quot;meaning&quot;],&quot;nextKey&quot;:[0,&quot;authored_reading_section_8&quot;],&quot;nextTitle&quot;:[0,&quot;8. Entropy: More Possible Patterns&quot;],&quot;nextPhase&quot;:[0,&quot;meaning&quot;],&quot;sameTypePreviousKey&quot;:[0,&quot;authored_reading_check_6&quot;],&quot;sameTypeNextKey&quot;:[0,&quot;authored_reading_check_8&quot;],&quot;connectionLabel&quot;:[0,&quot;meaning -&gt; check -&gt; meaning&quot;]}],[0,{&quot;key&quot;:[0,&quot;authored_reading_section_8&quot;],&quot;blockId&quot;:[0,&quot;authored_reading_section_8&quot;],&quot;type&quot;:[0,&quot;authored_context&quot;],&quot;typeIndex&quot;:[0,7],&quot;index&quot;:[0,16],&quot;title&quot;:[0,&quot;8. Entropy: More Possible Patterns&quot;],&quot;preview&quot;:[0,&quot;Entropy can be a difficult word, but here is a useful classroom version. Low entropy means more order and fewer possible patterns. High entropy means more uncertainty and more possible patterns. Normal waking consciousness is usually ordered. The brain keeps experience stable. You know your name, your body, your place, and your plans. The entropic brain hypothesis suggests that psychedelic states can increase the variety of brain activity patterns. In other words, the mind may become less locked into its usual paths for a time. This may help explain why some people report new connections, strange images, deep emotions, or a weaker sense of separation. Again, a wider range of patterns is not automatically wisdom. A storm has many patterns too. The useful question is what happens after the experience. Can the person integrate anything helpful? Can they become kinder, clearer, less trapped, or more honest? Or was it only a dramatic event?&quot;],&quot;family&quot;:[0,&quot;support&quot;],&quot;role&quot;:[0,&quot;forward-context&quot;],&quot;actionPattern&quot;:[0,&quot;read&quot;],&quot;phase&quot;:[0,&quot;meaning&quot;],&quot;style&quot;:[0,&quot;&quot;],&quot;anchor&quot;:[0,&quot;&quot;],&quot;selectorKind&quot;:[0,&quot;blockId&quot;],&quot;sourcePath&quot;:[0,&quot;lessonBlocks[16].blockId&quot;],&quot;previousKey&quot;:[0,&quot;authored_reading_check_7&quot;],&quot;previousTitle&quot;:[0,&quot;What is a prior?&quot;],&quot;previousPhase&quot;:[0,&quot;check&quot;],&quot;nextKey&quot;:[0,&quot;authored_reading_check_8&quot;],&quot;nextTitle&quot;:[0,&quot;In this lesson, what does higher entropy mean?&quot;],&quot;nextPhase&quot;:[0,&quot;check&quot;],&quot;sameTypePreviousKey&quot;:[0,&quot;authored_reading_section_7&quot;],&quot;sameTypeNextKey&quot;:[0,&quot;authored_reading_section_9&quot;],&quot;connectionLabel&quot;:[0,&quot;check -&gt; meaning -&gt; check&quot;]}],[0,{&quot;key&quot;:[0,&quot;authored_reading_check_8&quot;],&quot;blockId&quot;:[0,&quot;authored_reading_check_8&quot;],&quot;type&quot;:[0,&quot;micro_quiz&quot;],&quot;typeIndex&quot;:[0,7],&quot;index&quot;:[0,17],&quot;title&quot;:[0,&quot;In this lesson, what does higher entropy mean?&quot;],&quot;preview&quot;:[0,&quot;In this lesson, what does higher entropy mean?&quot;],&quot;family&quot;:[0,&quot;support&quot;],&quot;role&quot;:[0,&quot;understanding-check&quot;],&quot;actionPattern&quot;:[0,&quot;reveal-answer&quot;],&quot;phase&quot;:[0,&quot;check&quot;],&quot;style&quot;:[0,&quot;&quot;],&quot;anchor&quot;:[0,&quot;&quot;],&quot;selectorKind&quot;:[0,&quot;blockId&quot;],&quot;sourcePath&quot;:[0,&quot;lessonBlocks[17].blockId&quot;],&quot;previousKey&quot;:[0,&quot;authored_reading_section_8&quot;],&quot;previousTitle&quot;:[0,&quot;8. Entropy: More Possible Patterns&quot;],&quot;previousPhase&quot;:[0,&quot;meaning&quot;],&quot;nextKey&quot;:[0,&quot;authored_reading_section_9&quot;],&quot;nextTitle&quot;:[0,&quot;9. Integration: Bringing Insight Back to Life&quot;],&quot;nextPhase&quot;:[0,&quot;meaning&quot;],&quot;sameTypePreviousKey&quot;:[0,&quot;authored_reading_check_7&quot;],&quot;sameTypeNextKey&quot;:[0,&quot;authored_reading_check_9&quot;],&quot;connectionLabel& kill that helps for years, the result can become non-linear. If you build a study template, the first effort can make future study easier. If you make a useful guide, many people can use the same work. High-leverage actions often keep helping after the first effort is finished. This is why good systems, skills, and assets can be more powerful than simply adding more hours.&quot;],&quot;family&quot;:[0,&quot;forward&quot;],&quot;role&quot;:[0,&quot;forward-context&quot;],&quot;actionPattern&quot;:[0,&quot;read&quot;],&quot;phase&quot;:[0,&quot;meaning&quot;],&quot;style&quot;:[0,&quot;&quot;],&quot;anchor&quot;:[0,&quot;&quot;],&quot;selectorKind&quot;:[0,&quot;blockId&quot;],&quot;sourcePath&quot;:[0,&quot;lessonBlocks[6].blockId&quot;],&quot;previousKey&quot;:[0,&quot;authored_reading_check_2&quot;],&quot;previousTitle&quot;:[0,&quot;Why does a physical lever help?&quot;],&quot;previousPhase&quot;:[0,&quot;check&quot;],&quot;nextKey&quot;:[0,&quot;authored_reading_check_3&quot;],&quot;nextTitle&quot;:[0,&quot;What is the difference between linear work and non-linear work?&quot;],&quot;nextPhase&quot;:[0,&quot;check&quot;],&quot;sameTypePreviousKey&quot;:[0,&quot;authored_reading_section_2&quot;],&quot;sameTypeNextKey&quot;:[0,&quot;authored_reading_section_4&quot;],&quot;connectionLabel&quot;:[0,&quot;check -&gt; meaning -&gt; check&quot;]}],[0,{&quot;key&quot;:[0,&quot;authored_reading_check_3&quot;],&quot;blockId&quot;:[0,&quot;authored_reading_check_3&quot;],&quot;type&quot;:[0,&quot;micro_quiz&quot;],&quot;typeIndex&quot;:[0,2],&quot;index&quot;:[0,7],&quot;title&quot;:[0,&quot;What is the difference between linear work and non-linear work?&quot;],&quot;preview&quot;:[0,&quot;What is the difference between linear work and non-linear work?&quot;],&quot;family&quot;:[0,&quot;practice&quot;],&quot;role&quot;:[0,&quot;understanding-check&quot;],&quot;actionPattern&quot;:[0,&quot;reveal-answer&quot;],&quot;phase&quot;:[0,&quot;check&quot;],&quot;style&quot;:[0,&quot ng&quot;],&quot;sameTypePreviousKey&quot;:[0,&quot;authored_reading_check_3&quot;],&quot;sameTypeNextKey&quot;:[0,&quot;authored_reading_check_5&quot;],&quot;connectionLabel&quot;:[0,&quot;meaning -&gt; check -&gt; meaning&quot;]}],[0,{&quot;key&quot;:[0,&quot;authored_reading_section_5&quot;],&quot;blockId&quot;:[0,&quot;authored_reading_section_5&quot;],&quot;type&quot;:[0,&quot;authored_context&quot;],&quot;typeIndex&quot;:[0,4],&quot;index&quot;:[0,10],&quot;title&quot;:[0,&quot;4. Feedback Loops: Reality Teaches the Next Step&quot;],&quot;preview&quot;:[0,&quot;A feedback loop is a cycle: try, get a result, learn from the result, adjust, and try again. It is one of the strongest forms of leverage because each round can make the next round smarter. Feedback is not only praise or criticism. Good feedback gives information. It helps answer questions like: - What was I trying to do? - What happened? - What should I change next? Research on classroom feedback shows an important limit. Feedback can help learning a lot, but the type of feedback matters. Vague comments like \&quot;good job\&quot; or \&quot;bad answer\&quot; are weaker than specific information about the task, the process, and the next step. This is why serious learners test, measure, and adjust. They do not only repeat effort. They let reality update the system.&quot;],&quot;family&quot;:[0,&quot;forward&quot;],&quot;role&quot;:[0,&quot;forward-context&quot;],&quot;actionPattern&quot;:[0,&quot;read&quot;],&quot;phase&quot;:[0,&quot;meaning&quot;],&quot;style&quot;:[0,&quot;&quot;],&quot;anchor&quot;:[0,&quot;&quot;],&quot;selectorKind&quot;:[0,&quot;blockId&quot;],&quot;sourcePath&quot;:[0,&quot;lessonBlocks[10].blockId&quot;],&quot;previousKey&quot;:[0,&quot;authored_reading_check_4&quot;],&quot;previousTitle&quot;:[0,&quot;What does compounding mean?&quot;],&quot;previousPhase&quot;:[0,&quot;check&quot;],&quot;nextKey&quot;:[0,&quot;authored_reading_check_5&quot;],&quot;nextTitle&quot;:[0,&quot;Why c w&quot;:[0,&quot;The pasted draft gives a strong example: turn one article into many outputs. This idea is supported by learning science. One useful principle is retrieval practice. Retrieval means remembering without looking. A review by Roediger and Butler explains that pulling information from memory can improve long-term retention more than simply reading the same material again. Another useful principle is distributed practice. A large review by Dunlosky and colleagues rated practice testing and spreading study sessions over time as high-utility learning techniques. In simple words: test yourself, and do not put all study into one tired night. Retrieval is a science word, but the idea is simple. Bring the answer back from memory before you check the page. That small struggle is part of the learning. This makes the \&quot;one article -&gt; many outputs\&quot; system powerful. You are not only reading. You are retrieving, explaining, using, and reviewing the same idea in different ways.&quot;],&quot;family&quot;:[0,&quot;forward&quot;],&quot;role&quot;:[0,&quot;forward-context&quot;],&quot;actionPattern&quot;:[0,&quot;read&quot;],&quot;phase&quot;:[0,&quot;meaning&quot;],&quot;style&quot;:[0,&quot;&quot;],&quot;anchor&quot;:[0,&quot;&quot;],&quot;selectorKind&quot;:[0,&quot;blockId&quot;],&quot;sourcePath&quot;:[0,&quot;lessonBlocks[12].blockId&quot;],&quot;previousKey&quot;:[0,&quot;authored_reading_check_5&quot;],&quot;previousTitle&quot;:[0,&quot;Why can feedback create leverage?&quot;],&quot;previousPhase&quot;:[0,&quot;check&quot;],&quot;nextKey&quot;:[0,&quot;authored_reading_check_6&quot;],&quot;nextTitle&quot;:[0,&quot;What is retrieval practice?&quot;],&quot;nextPhase&quot;:[0,&quot;check&quot;],&quot;sameTypePreviousKey&quot;:[0,&quot;authored_reading_section_5&quot;],&quot;sameTypeNextKey&quot;:[0,&quot;authored_reading_section_7&quot;],&quot;connectionLabel&quot;:[0,&quot;check -&gt; meaning -&gt; check&quot;]}],[0,{&quot;key&quot;:[0,&quot;authored_r k the result.&quot;],&quot;family&quot;:[0,&quot;forward&quot;],&quot;role&quot;:[0,&quot;forward-context&quot;],&quot;actionPattern&quot;:[0,&quot;read&quot;],&quot;phase&quot;:[0,&quot;meaning&quot;],&quot;style&quot;:[0,&quot;&quot;],&quot;anchor&quot;:[0,&quot;&quot;],&quot;selectorKind&quot;:[0,&quot;blockId&quot;],&quot;sourcePath&quot;:[0,&quot;lessonBlocks[16].blockId&quot;],&quot;previousKey&quot;:[0,&quot;authored_reading_check_7&quot;],&quot;previousTitle&quot;:[0,&quot;Why can a system beat motivation?&quot;],&quot;previousPhase&quot;:[0,&quot;check&quot;],&quot;nextKey&quot;:[0,&quot;authored_reading_check_8&quot;],&quot;nextTitle&quot;:[0,&quot;Why are digital tools not magic?&quot;],&quot;nextPhase&quot;:[0,&quot;check&quot;],&quot;sameTypePreviousKey&quot;:[0,&quot;authored_reading_section_7&quot;],&quot;sameTypeNextKey&quot;:[0,&quot;authored_reading_section_9&quot;],&quot;connectionLabel&quot;:[0,&quot;check -&gt; meaning -&gt; check&quot;]}],[0,{&quot;key&quot;:[0,&quot;authored_reading_check_8&quot;],&quot;blockId&quot;:[0,&quot;authored_reading_check_8&quot;],&quot;type&quot;:[0,&quot;micro_quiz&quot;],&quot;typeIndex&quot;:[0,7],&quot;index&quot;:[0,17],&quot;title&quot;:[0,&quot;Why are digital tools not magic?&quot;],&quot;preview&quot;:[0,&quot;Why are digital tools not magic?&quot;],&quot;family&quot;:[0,&quot;practice&quot;],&quot;role&quot;:[0,&quot;understanding-check&quot;],&quot;actionPattern&quot;:[0,&quot;reveal-answer&quot;],&quot;phase&quot;:[0,&quot;check&quot;],&quot;style&quot;:[0,&quot;&quot;],&quot;anchor&quot;:[0,&quot;&quot;],&quot;selectorKind&quot;:[0,&quot;blockId&quot;],&quot;sourcePath&quot;:[0,&quot;lessonBlocks[17].blockId&quot;],&quot;previousKey&quot;:[0,&quot;authored_reading_section_8&quot;],&quot;previousTitle&quot;:[0,&quot;7. Digital Tools as Leverage, Not Magic&quot;],&quot;previousPhase&quot;:[0,&quot;meaning&quot;],&quot;nextKey&quot;:[0,&quot;authored_reading_section_9&quot;],&quot;nextTitle&quot;:[0,&quot; ckId&quot;:[0,&quot;authored_reading_warmup&quot;],&quot;type&quot;:[0,&quot;authored_intro&quot;],&quot;typeIndex&quot;:[0,0],&quot;index&quot;:[0,1],&quot;title&quot;:[0,&quot;Warm-Up Questions&quot;],&quot;preview&quot;:[0,&quot;&quot;],&quot;family&quot;:[0,&quot;forward&quot;],&quot;role&quot;:[0,&quot;forward-context&quot;],&quot;actionPattern&quot;:[0,&quot;read&quot;],&quot;phase&quot;:[0,&quot;opening&quot;],&quot;style&quot;:[0,&quot;&quot;],&quot;anchor&quot;:[0,&quot;&quot;],&quot;selectorKind&quot;:[0,&quot;blockId&quot;],&quot;sourcePath&quot;:[0,&quot;lessonBlocks[1].blockId&quot;],&quot;previousKey&quot;:[0,&quot;authored_reading_goal&quot;],&quot;previousTitle&quot;:[0,&quot;Lesson Goal&quot;],&quot;previousPhase&quot;:[0,&quot;opening&quot;],&quot;nextKey&quot;:[0,&quot;authored_reading_section_1&quot;],&quot;nextTitle&quot;:[0,&quot;Introduction&quot;],&quot;nextPhase&quot;:[0,&quot;meaning&quot;],&quot;sameTypePreviousKey&quot;:[0,&quot;&quot;],&quot;sameTypeNextKey&quot;:[0,&quot;&quot;],&quot;connectionLabel&quot;:[0,&quot;opening -&gt; opening -&gt; meaning&quot;]}],[0,{&quot;key&quot;:[0,&quot;authored_reading_section_1&quot;],&quot;blockId&quot;:[0,&quot;authored_reading_section_1&quot;],&quot;type&quot;:[0,&quot;authored_context&quot;],&quot;typeIndex&quot;:[0,0],&quot;index&quot;:[0,2],&quot;title&quot;:[0,&quot;Introduction&quot;],&quot;preview&quot;:[0,&quot;For several years, most public AI news sounded like a contest: which model could write better, solve harder problems, or answer faster? That still matters. But the more important shift in recent AI product news is different. AI is moving from \&quot;a system that answers\&quot; toward \&quot;a system that completes parts of a workflow.\&quot; A workflow is a connected series of steps. In language learning, a workflow might be: understand a student&#39;s mistake, choose a short explanation, create practice, listen to the student&#39;s answer, give feedback, and remember what to practise next time. In a company, a workflow might be: read a document, extract facts, compare options, draft a plan, check risks, and send a report for approval. The useful question is not only \&quot;Which model is best?\&quot; The better question is \&quot;Which system can do the job safely, clearly, and affordably?\&quot; This lesson uses recent AI developments as a reading case. The goal is not to memorise every model name. The goal is to learn how advanced AI products are being built, where the promise is real, and where human judgment is still necessary.&quot;],&quot;family&quot;:[0,&quot;forward&quot;],&quot;role&quot;:[0,&quot;forward-context&quot;],&quot;actionPattern&quot;:[0,&quot;read&quot;],&quot;phase&quot;:[0,&quot;meaning&quot;],&quot;style&quot;:[0,&quot;&quot;],&quot;anchor&quot;:[0,&quot;&quot;],&quot;selectorKind&quot;:[0,&quot;blockId&quot;],&quot;sourcePath&quot;:[0,&quot;lessonBlocks[2].blockId&quot;],&quot;previousKey&quot;:[0,&quot;authored_reading_warmup&quot;],&quot;previousTitle&quot;:[0,&quot;Warm-Up Questions&quot;],&quot;previousPhase&quot;:[0,&quot;opening&quot;],&quot;nextKey&quot;:[0,&quot;authored_reading_check_1&quot;],&quot;nextTitle&quot;:[0,&quot;What is the main shift described in the introduction?&quot;],&quot;nextPhase&quot;:[0,&quot;check&quot;],&quot;sameTypePreviousKey&quot;:[0,&quot;&quot;],&quot;sameTypeNextKey&quot;:[0,&quot;authored_reading_section_2&quot;],&quot;connectionLabel&quot;:[0,&quot;opening -&gt; meaning -&gt; check&quot;]}],[0,{&quot;key&quot;:[0,&quot;authored_reading_check_1&quot;],&quot;blockId&quot;:[0,&quot;authored_reading_check_1&quot;],&quot;type&quot;:[0,&quot;micro_quiz&quot;],&quot;typeIndex&quot;:[0,0],&quot;index&quot;:[0,3],&quot;title&quot;:[0,&quot;What is the main shift described in the introduction?&quot;],&quot;preview&quot;:[0,&quot;What is the main shift described in the introduction?&quot;],&quot;family&quot;:[0,&quot;practice&quot;],&quot;role&quot;:[0,&quot;understanding-check&quot;],&quot;actionPattern&quot;:[0,&quot;reveal-answer&quot;],&quot;phase&quot;:[0,&quot;check&quot;],&quot;style&quot;:[0,&quot;&quot;],&quot;anchor&quot;:[0,&quot;&quot;],&quot;selectorKind&quot;:[0,&quot;blockId&quot;],&quot;sourcePath&quot;:[0,&quot;lessonBlocks[3].blockId&quot;],&quot;previousKey&quot;:[0,&quot;authored_reading_section_1&quot;],&quot;previousTitle&quot;:[0,&quot;Introduction&quot;],&quot;previousPhase&quot;:[0,&quot;meaning&quot;],&quot;nextKey&quot;:[0,&quot;authored_reading_section_2&quot;],&quot;nextTitle&quot;:[0,&quot;Part 1: From Chatbots to Workflow-Completing Systems&quot;],&quot;nextPhase&quot;:[0,&quot;meaning&quot;],&quot;sameTypePreviousKey&quot;:[0,&quot;&quot;],&quot;sameTypeNextKey&quot;:[0,&quot;authored_reading_check_2&quot;],&quot;connectionLabel&quot;:[0,&quot;meaning -&gt; check -&gt; meaning&quot;]}],[0,{&quot;key&quot;:[0,&quot;authored_reading_section_2&quot;],&quot;blockId&quot;:[0,&quot;authored_reading_section_2&quot;],&quot;type&quot;:[0,&quot;authored_context&quot;],&quot;typeIndex&quot;:[0,1],&quot;index&quot;:[0,4],&quot;title&quot;:[0,&quot;Part 1: From Chatbots to Workflow-Completing Systems&quot;],&quot;preview&quot;:[0,&quot;A normal chatbot can be useful, but it usually handles one turn at a time. You ask, it answers. An AI agent is different because it can work toward a goal through several steps. It may plan, call tools, search, run code, compare evidence, ask a specialist subagent for help, and then report back. This is why product announcements now talk so much about agents. Google described a move from AI that assists to agents that can navigate complex tasks across a workflow. It also announced Managed Agents in the Gemini API, where a single API call can provide an agent with a remote sandbox. Anthropic announced dynamic workflows in Claude Code, where large tasks can be divided among many subagents before results are verified. Alibaba&#39;s Qwen3.7-Plus announcement similarly focuses on multimodal agents that can work across both graphical interfaces and command-line environments. The important language point is the word \&quot;system.\&quot; A model is the brain-like part. A system includes the model, tools, data, memory, permissions, user interface, checks, and cost limits. Many failures happen because people praise the model but ignore the system around it.&quot;],&quot;family&quot;:[0,&quot;forward&quot;],&quot;role&quot;:[0,&quot;forward-context&quot;],&quot;actionPattern&quot;:[0,&quot;read&quot;],&quot;phase&quot;:[0,&quot;meaning&quot;],&quot;style&quot;:[0,&quot;&quot;],&quot;anchor&quot;:[0,&quot;&quot;],&quot;selectorKind&quot;:[0,&quot;blockId&quot;],&quot;sourcePath&quot;:[0,&quot;lessonBlocks[4].blockId&quot;],&quot;previousKey&quot;:[0,&quot;authored_reading_check_1&quot;],&quot;previousTitle&quot;:[0,&quot;What is the main shift described in the introduction?&quot;],&quot;previousPhase&quot;:[0,&quot;check&quot;],&quot;nextKey&quot;:[0,&quot;authored_reading_check_2&quot;],&quot;nextTitle&quot;:[0,&quot;Why is the word \&quot;system\&quot; important in this lesson?&quot;],&quot;nextPhase&quot;:[0,&quot;check&quot;],&quot;sameTypePreviousKey&quot;:[0,&quot;authored_reading_section_1&quot;],&quot;sameTypeNextKey&quot;:[0,&quot;authored_reading_section_3&quot;],&quot;connectionLabel&quot;:[0,&quot;check -&gt; meaning -&gt; check&quot;]}],[0,{&quot;key&quot;:[0,&quot;authored_reading_check_2&quot;],&quot;blockId&quot;:[0,&quot;authored_reading_check_2&quot;],&quot;type&quot;:[0,&quot;micro_quiz&quot;],&quot;typeIndex&quot;:[0,1],&quot;index&quot;:[0,5],&quot;title&quot;:[0,&quot;Why is the word \&quot;system\&quot; important in this lesson?&quot;],&quot;preview&quot;:[0,&quot;Why is the word \&quot;system\&quot; important in this lesson?&quot;],&quot;family&quot;:[0,&quot;practice&quot;],&quot;role&quot;:[0,&quot;understanding-check&quot;],&quot;actionPattern&quot;:[0,&quot;reveal-answer&quot;],&quot;phase&quot;:[0,&quot;check&quot;],&quot;style&quot;:[0,&quot;&quot;],&quot;anchor&quot;:[0,&quot;&quot;],&quot;selectorKind&quot;:[0,&quot;blockId&quot;],&quot;sourcePath&quot;:[0,&quot;lessonBlocks[5].blockId&quot;],&quot;previousKey&quot;:[0,&quot;authored_reading_section_2&quot;],&quot;previousTitle&quot;:[0,&quot;Part 1: From Chatbots to Workflow-Completing Systems&quot;],&quot;previousPhase&quot;:[0,&quot;meaning&quot;],&quot;nextKey&quot;:[0,&quot;authored_reading_section_3&quot;],&quot;nextTitle&quot;:[0,&quot;Part 2: Multimodal AI Means More Than Adding Pictures&quot;],&quot;nextPhase&quot;:[0,&quot;meaning&quot;],&quot;sameTypePreviousKey&quot;:[0,&quot;authored_reading_check_1&quot;],&quot;sameTypeNextKey&quot;:[0,&quot;authored_reading_check_3&quot;],&quot;connectionLabel&quot;:[0,&quot;meaning -&gt; check -&gt; meaning&quot;]}],[0,{&quot;key&quot;:[0,&quot;authored_reading_section_3&quot;],&quot;blockId&quot;:[0,&quot;authored_reading_section_3&quot;],&quot;type&quot;:[0,&quot;authored_context&quot;],&quot;typeIndex&quot;:[0,2],&quot;index&quot;:[0,6],&quot;title&quot;:[0,&quot;Part 2: Multimodal AI Means More Than Adding Pictures&quot;],&quot;preview&quot;:[0,&quot;Multimodal AI means a system can work with more than one type of information: text, images, audio, video, documents, screens, or code. At first, this sounded like a demo feature. A user could upload an image and ask a question. Now it is becoming a workflow feature. For example, a document AI system does not simply read words from a PDF. Mistral&#39;s OCR 4 announcement describes bounding boxes, block classification, and confidence scores. That means the system can say where information appears on the page, what kind of block it is, and how confident the extraction is. This matters for serious work because people need to check the source, not only read a smooth summary. Multimodality also changes software and tutoring. A multimodal agent may look at a screen, understand which button matters, operate a graphical interface, or turn a visual design into code. For language learning, the same idea could support a student who uploads homework, a photo of a worksheet, a short speaking recording, or a screenshot of an English problem. The risk is that multimodal output can feel more convincing than it deserves. A neat answer with a chart, a voice, or a marked-up document may look professional even when the reasoning is weak. Good products therefore need visible source links, confidence signals, and human review for important decisions.&quot;],&quot;family&quot;:[0,&quot;forward&quot;],&quot;role&quot;:[0,&quot;forward-context&quot;],&quot;actionPattern&quot;:[0,&quot;read&quot;],&quot;phase&quot;:[0,&quot;meaning&quot;],&quot;style&quot;:[0,&quot;&quot;],&quot;anchor&quot;:[0,&quot;&quot;],&quot;selectorKind&quot;:[0,&quot;blockId&quot;],&quot;sourcePath&quot;:[0,&quot;lessonBlocks[6].blockId&quot;],&quot;previousKey&quot;:[0,&quot;authored_reading_check_2&quot;],&quot;previousTitle&quot;:[0,&quot;Why is the word \&quot;system\&quot; important in this lesson?&quot;],&quot;previousPhase&quot;:[0,&quot;check&quot;],&quot;nextKey&quot;:[0,&quot;authored_reading_check_3&quot;],&quot;nextTitle&quot;:[0,&quot;Why are bounding boxes and confidence scores useful in document AI?&quot;],&quot;nextPhase&quot;:[0,&quot;check&quot;],&quot;sameTypePreviousKey&quot;:[0,&quot;authored_reading_section_2&quot;],&quot;sameTypeNextKey&quot;:[0,&quot;authored_reading_section_4&quot;],&quot;connectionLabel&quot;:[0,&quot;check -&gt; meaning -&gt; check&quot;]}],[0,{&quot;key&quot;:[0,&quot;authored_reading_check_3&quot;],&quot;blockId&quot;:[0,&quot;authored_reading_check_3&quot;],&quot;type&quot;:[0,&quot;micro_quiz&quot;],&quot;typeIndex&quot;:[0,2],&quot;index&quot;:[0,7],&quot;title&quot;:[0,&quot;Why are bounding boxes and confidence scores useful in document AI?&quot;],&quot;preview&quot;:[0,&quot;Why are bounding boxes and confidence scores useful in document AI?&quot;],&quot;family&quot;:[0,&quot;practice&quot;],&quot;role&quot;:[0,& ach that can connect speaking, listening, vocabulary, pronunciation, and learner history. However, a voice tutor must be careful. If it corrects every tiny mistake, the student may stop speaking. If it corrects too little, the student may repeat the same problem. If it remembers personal information without clear controls, trust becomes a privacy problem. OpenAI&#39;s newer memory work and enterprise controls show a broader industry pattern: personalisation is powerful, but it needs user control and administrative boundaries. The product lesson is simple: better voice is not enough. A good tutor needs timing, kindness, memory controls, and a clear learning plan.&quot;],&quot;family&quot;:[0,&quot;forward&quot;],&quot;role&quot;:[0,&quot;forward-context&quot;],&quot;actionPattern&quot;:[0,&quot;read&quot;],&quot;phase&quot;:[0,&quot;meaning&quot;],&quot;style&quot;:[0,&quot;&quot;],&quot;anchor&quot;:[0,&quot;&quot;],&quot;selectorKind&quot;:[0,&quot;blockId&quot;],&quot;sourcePath&quot;:[0,&quot;lessonBlocks[8].blockId&quot;],&quot;previousKey&quot;:[0,&quot;authored_reading_check_3&quot;],&quot;previousTitle&quot;:[0,&quot;Why are bounding boxes and confidence scores useful in document AI?&quot;],&quot;previousPhase&quot;:[0,&quot;check&quot;],&quot;nextKey&quot;:[0,&quot;authored_reading_check_4&quot;],&quot;nextTitle&quot;:[0,&quot;Why is a voice tutor more than a talking chatbot?&quot;],&quot;nextPhase&quot;:[0,&quot;check&quot;],&quot;sameTypePreviousKey&quot;:[0,&quot;authored_reading_section_3&quot;],&quot;sameTypeNextKey&quot;:[0,&quot;authored_reading_section_5&quot;],&quot;connectionLabel&quot;:[0,&quot;check -&gt; meaning -&gt; check&quot;]}],[0,{&quot;key&quot;:[0,&quot;authored_reading_check_4&quot;],&quot;blockId&quot;:[0,&quot;authored_reading_check_4&quot;],&quot;type&quot;:[0,&quot;micro_quiz&quot;],&quot;typeIndex&quot;:[0,3],&quot;index&quot;:[0,9],&quot;title&quot;:[0,&quot;Why is a voice tutor more than a talking chatbot?&quot;],&quot;preview&quot;:[0,&quot;Why is a voice tutor more than a talking chatbot?&quot;],&quot;family&quot;:[0,&quot;practice&quot;],&quot;role&quot;:[0,&quot;understanding-check&quot;],&quot;actionPattern&quot;:[0,&quot;reveal-answer&quot;],&quot;phase&quot;:[0,&quot;check&quot;],&quot;style&quot;:[0,&quot;&quot;],&quot;anchor&quot;:[0,&quot;&quot;],&quot;selectorKind&quot;:[0,&quot;blockId&quot;],&quot;sourcePath&quot;:[0,&quot;lessonBlocks[9].blockId&quot;],&quot;previousKey&quot;:[0,&quot;authored_reading_section_4&quot;],&quot;previousTitle&quot;:[0,&quot;Part 3: Voice Tutors Are Becoming a Serious Product Direction&quot;],&quot;previousPhase&quot;:[0,&quot;meaning&quot;],&quot;nextKey&quot;:[0,&quot;authored_reading_section_5&quot;],&quot;nextTitle&quot;:[0,&quot;Part 4: Enterprise AI Is Becoming a Management Problem&quot;],&quot;nextPhase&quot;:[0,&quot;meaning&quot;],&quot;sameTypePreviousKey&quot;:[0,&quot;authored_reading_check_3&quot;],&quot;sameTypeNextKey&quot;:[0,&quot;authored_reading_check_5&quot;],&quot;connectionLabel&quot;:[0,&quot;meaning -&gt; check -&gt; meaning&quot;]}],[0,{&quot;key&quot;:[0,&quot;authored_reading_section_5&quot;],&quot;blockId&quot;:[0,&quot;authored_reading_section_5&quot;],&quot;type&quot;:[0,&quot;authored_context&quot;],&quot;typeIndex&quot;:[0,4],&quot;index&quot;:[0,10],&quot;title&quot;:[0,&quot;Part 4: Enterprise AI Is Becoming a Management Problem&quot;],&quot;preview&quot;:[0,&quot;Many people imagine AI progress as a technical race. But recent enterprise announcements show another truth: the business problem is management. OpenAI&#39;s Partner Network announcement says the limiting factor is not only model capability, but also choosing the right use cases, redesigning workflows, integrating systems, and helping people actually adopt the tools. That is why spend controls and usage analytics matter. If one employee uses an expensive reasoning model for every small task, costs can rise quickly. If a company cannot see which teams use AI well, it cannot learn from successful workflows. If a powerful agent can access sensitive data without the right permission, a productivity tool becomes a security risk. For product teams, this means model choice should not be emotional. A serious team might use a fast model for conversation, a stronger reasoning model for difficult checking, and a specialised document model for PDF or image intake. The system should also have quotas, logs, evaluation tests, and provider failover. In plain English: do not build your whole product as one giant call to one impressive model. Build a portfolio of tools, and prove that each tool is doing the right job.&quot;],&quot;family&quot;:[0,&quot;forward&quot;],&quot;role&quot;:[0,&quot;forward-context&quot;],&quot;actionPattern&quot;:[0,&quot;read&quot;],&quot;phase&quot;:[0,&quot;meaning&quot;],&quot;style&quot;:[0,&quot;&quot;],&quot;anchor&quot;:[0,&quot;&quot;],&quot;selectorKind&quot;:[0,&quot;blockId&quot;],&quot;sourcePath&quot;:[0,&quot;lessonBlocks[10].blockId&quot;],&quot;previousKey&quot;:[0,&quot;authored_reading_check_4&quot;],&quot;previousTitle&quot;:[0,&quot;Why is a voice tutor more than a talking chatbot?&quot;],&quot;previousPhase&quot;:[0,&quot;check&quot;],&quot;nextKey&quot;:[0,&quot;authored_reading_check_5&quot;],&quot;nextTitle&quot;:[0,&quot;Why are spend controls and usage analytics part of the AI story?&quot;],&quot;nextPhase&quot;:[0,&quot;check&quot;],&quot;sameTypePreviousKey&quot;:[0,&quot;authored_reading_section_4&quot;],&quot;sameTypeNextKey&quot;:[0,&quot;authored_reading_section_6&quot;],&quot;connectionLabel&quot;:[0,&quot;check -&gt; meaning -&gt; check&quot;]}],[0,{&quot;key&quot;:[0,&quot;authored_reading_check_5&quot;],&quot;blockId&quot;:[0,&quot;authored_reading_check_5&quot;],&quot;type&quot;:[0,&quot;micro_quiz&quot;],&quot;typeIndex&quot;:[0,4],&quot;index&quot;:[0,11],&quot;title&quot;:[0,&quot;Why are spend controls and usage analytics part of the AI story?&quot;],&quot;preview&quot;:[0,&quot;Why are spend controls and usage analytics part of the AI story?&quot;],&quot;family&quot;:[0,&quot;practice&quot;],&quot;role&quot;:[0,&quot;understanding-check&quot;],&quot;actionPattern&quot;:[0,&quot;reveal-answer&quot;],&quot;phase&quot;:[0,&quot;check&quot;],&quot;style&quot;:[0,&quot;&quot;],&quot;anchor&quot;:[0,&quot;&quot;],&quot;selectorKind&quot;:[0,&quot;blockId&quot;],&quot;sourcePath&quot;:[0,&quot;lessonBlocks[11].blockId&quot;],&quot;previousKey&quot;:[0,&quot;authored_reading_section_5&quot;],&quot;previousTitle&quot;:[0,&quot;Part 4: Enterprise AI Is Becoming a Management Problem&quot;],&quot;previousPhase&quot;:[0,&quot;meaning&quot;],&quot;nextKey&quot;:[0,&quot;authored_reading_section_6&quot;],&quot;nextTitle&quot;:[0,&quot;Part 5: The Big Limit Is Reliability, Not Imagination&quot;],&quot;nextPhase&quot;:[0,&quot;meaning&quot;],&quot;sameTypePreviousKey&quot;:[0,&quot;authored_reading_check_4&quot;],&quot;sameTypeNextKey&quot;:[0,&quot;authored_reading_check_6&quot;],&quot;connectionLabel&quot;:[0,&quot;meaning -&gt; check -&gt; meaning&quot;]}],[0,{&quot;key&quot;:[0,&quot;authored_reading_section_6&quot;],&quot;blockId&quot;:[0,&quot;authored_reading_section_6&quot;],&quot;type&quot;:[0,&quot;authored_context&quot;],&quot;typeIndex&quot;:[0,5],&quot;index&quot;:[0,12],&quot;title&quot;:[0,&quot;Part 5: The Big Limit Is Reliability, Not Imagination&quot;],&quot;preview&quot;:[0,&quot;The current AI story is exciting because many systems can do more than before. Some can work with longer context. Some can use tools more effectively. Some can reason over documents or screens. Some can operate through enterprise platforms such as Amazon Bedrock. Z.ai&#39;s GLM-5.2 release notes emphasise long-horizon work and a 1M context window. AWS describes Grok 4.3 in Bedrock with configurable reasoning effort, tool calling, structured output, and streaming. But none of this means that agents are ready for unattended control of important systems. Long-horizon work is hard. A model may succeed for several steps and then misunderstand the goal. It may use the wrong source, miss a hidden constraint, or produce a result that looks finished but is incomplete. Anthropic&#39;s Opus 4.8 announcement even highlights honesty and flagging uncertainty as a major improvement, which tells us that unsupported confidence is still a serious problem. There is also a policy risk. Anthropic reported that access to Fable 5 and Mythos 5 had to be suspended after a U.S. export-control directive. Whatever someone thinks about that decision, it shows a product reality: model access can change quickly because of law, safety, geopolitics, or provider policy. So the wise conclusion is balanced. AI systems are becoming powerful enough to reshape work, learning, and software. They are not reliable enough to remove human responsibility.&quot;],&quot;family&quot;:[0,&quot;forward&quot;],&quot;role&quot;:[0,&quot;forward-context&quot;],&quot;actionPattern&quot;:[0,&quot;read&quot;],&quot;phase&quot;:[0,&quot;meaning&quot;],&quot;style&quot;:[0,&quot;&quot;],&quot;anchor&quot;:[0,&quot;&quot;],&quot;selectorKind&quot;:[0,&quot;blockId&quot;],&quot;sourcePath&quot;:[0,&quot;lessonBlocks[12].blockId&quot;],&quot;previousKey&quot;:[0,&quot;authored_reading_check_5&quot;],&quot;previousTitle&quot;:[0,&quot;Why are spend controls and usage analytics part of the AI story?&quot;],&quot;previousPhase&quot;:[0,&quot;check&quot;],&quot;nextKey&quot;:[0,&quot;authored_reading_check_6&quot;],&quot;nextTitle&quot;:[0,&quot;What is the balanced conclusion of this section?&quot;],&quot;nextPhase&quot;:[0,&quot;check&quot;],&quot;sameTypePreviousKey&quot;:[0,&quot;authored_reading_section_5&quot;],&quot;sameTypeNextKey&quot;:[0,&quot;authored_reading_section_7&quot;],&quot;connectionLabel&quot;:[0,&quot;check -&gt; meaning -&gt; check&quot;]}],[0,{&quot;key&quot;:[0,&quot;authored_reading_check_6&quot;],&quot;blockId&quot;:[0,&quot;authored_reading_check_6&quot;],&quot;type&quot;:[0,&quot;micro_quiz&quot;],&quot;typeIndex&quot;:[0,5],&quot;index&quot;:[0,13],&quot;title&quot;:[0,&quot;What is the balanced conclusion of this section?&quot;],&quot;preview&quot;:[0,&quot;What is the balanced conclusion of this section?&quot;],&quot;family&quot;:[0,&quot;practice&quot;],&quot;role&quot;:[0,&quot;understanding-check&quot;],&quot;actionPattern&quot;:[0,&quot;reveal-answer&quot;],&quot;phase&quot;:[0,&quot;check&quot;],&quot;style&quot;:[0,&quot;&quot;],&quot;anchor&quot;:[0,&quot;&quot;],&quot;selectorKind&quot;:[0,&quot;blockId&quot;],&quot;sourcePath&quot;:[0,&quot;lessonBlocks[13].blockId&quot;],&quot;previousKey&quot;:[0,&quot;authored_reading_section_6&quot;],&quot;previousTitle&quot;:[0,&quot;Part 5: The Big Limit Is Reliability, Not Imagination&quot;],&quot;previousPhase&quot;:[0,&quot;meaning&quot;],&quot;nextKey&quot;:[0,&quot;authored_reading_section_7&quot;],&quot;nextTitle&quot;:[0,&quot;Part 6: What This Means for English Learners and Product Teams&quot;],&quot;nextPhase&quot;:[0,&quot;meaning&quot;],&quot;sameTypePreviousKey&quot;:[0,&quot;authored_reading_check_5&quot;],&quot;sameTypeNextKey&quot;:[0,&quot;authored_reading_check_7&quot;],&quot;connectionLabel&quot;:[0,&quot;meaning -&gt; check -&gt; meaning&quot;]}],[0,{&quot;key&quot;:[0,&quot;authored_reading_section_7&quot;],&quot;blockId&quot;:[0,&quot;authored_reading_section_7&quot;],&quot;type&quot;:[0,&quot;authored_context&quot;],&quot;typeIndex&quot;:[0,6],&quot;index&quot;:[0,14],&quot;title&quot;:[0,&quot;Part 6: What This Means for English Learners and Product Teams&quot;],&quot;preview&quot;:[0,&quot;For English learners, these AI developments point toward a richer learning experience. A future lesson might start from the student&#39;s real material: a work email, a science article, a travel problem, a video clip, or a speaking recording. The tutor could explain the content, highlight useful language, create practice, listen to the student&#39;s answer, and remember what needs review. For a product team like an English school, the opportunity is practical. A fast model can handle live conversation. A stronger reasoning model can check lesson quality. A document model can read uploaded materials. A voice system can support pronunciation and listening. A memory layer can remember goals, weak skills, preferred correction style, and exam targets. But every opportunity has a discipline attached to it. Voice needs latency control. Memory needs privacy controls. Document intake needs source checking. Agents need permission boundaries. Expensive models need quotas. Learner feedback needs evaluation, not just good feelings. The best teams will not ask, \&quot;What is the most impressive model this month?\&quot; They will ask, \&quot;What learning problem are we solving, what proof do we have, and what guardrail stops the system from harming trust?\&quot;&quot;],&quot;family&quot;:[0,&quot;forward&quot;],&quot;role&quot;:[0,&quot;forward-context&quot;],&quot;actionPattern&quot;:[0,&quot;read&quot;],&quot;phase&quot;:[0,&quot;meaning&quot;],&quot;style&quot;:[0,&quot;&quot;],&quot;anchor&quot;:[0,&quot;&quot;],&quot;selectorKind&quot;:[0,&quot;blockId&quot;],&quot;sourcePath&quot;:[0,&quot;lessonBlocks[14].blockId&quot;],&quot;previousKey&quot;:[0,&quot;authored_reading_check_6&quot;],&quot;previousTitle&quot;:[0,&quot;What is the balanced conclusion of this section?&quot;],&quot;previousPhase&quot;:[0,&quot;check&quot;],&quot;nextKey&quot;:[0,&quot;authored_reading_check_7&quot;],&quot;nextTitle&quot;:[0,&quot;What is one practical AI architecture for an English-learning product?&quot;],&quot;nextPhase&quot;:[0,&quot;check&quot;],&quot;sameTypePreviousKey&quot;:[0,&quot;authored_reading_section_6&quot;],&quot;sameTypeNextKey&quot;:[0,&quot;authored_reading_section_8&quot;],&quot;connectionLabel&quot;:[0,&quot;check -&gt; meaning -&gt; check&quot;]}],[0,{&quot;key&quot;:[0,&quot;authored_reading_check_7&quot;],&q , edit, operate a screen, run code, or complete a workflow? Second, ask what evidence supports the claim. Is it a vendor benchmark, an independent test, a customer quote, a demo, or a live product? Third, ask what happens when it fails. Can a human review the work? Are actions limited? Are logs available? Is private data protected? Fourth, ask whether the cost fits the value. This is the skill behind serious AI literacy. Do not be anti-AI, and do not be blindly excited. Read announcements like a product designer, a teacher, and a risk manager at the same time. The future may belong to people who can direct AI systems well. But directing is not just giving commands. It means choosing goals, checking sources, setting limits, noticing weak evidence, and taking responsibility for the final result.&quot;],&quot;family&quot;:[0,&quot;forward&quot;],&quot;role&quot;:[0,&quot;forward-context&quot;],&quot;actionPattern&quot;:[0,&quot;read&quot;],&quot;phase&quot;:[0,&quot;meaning&quot;],&quot;style&quot;:[0,&quot;&quot;],&quot;anchor&quot;:[0,&quot;&quot;],&quot;selectorKind&quot;:[0,&quot;blockId&quot;],&quot;sourcePath&quot;:[0,&quot;lessonBlocks[16].blockId&quot;],&quot;previousKey&quot;:[0,&quot;authored_reading_check_7&quot;],&quot;previousTitle&quot;:[0,&quot;What is one practical AI architecture for an English-learning product?&quot;],&quot;previousPhase&quot;:[0,&quot;check&quot;],&quot;nextKey&quot;:[0,&quot;authored_reading_check_8&quot;],&quot;nextTitle&quot;:[0,&quot;What four questions should readers ask about an AI announcement?&quot;],&quot;nextPhase&quot;:[0,&quot;check&quot;],&quot;sameTypePreviousKey&quot;:[0,&quot;authored_reading_section_7&quot;],&quot;sameTypeNextKey&quot;:[0,&quot;authored_reading_section_9&quot;],&quot;connectionLabel&quot;:[0,&quot;check -&gt; meaning -&gt; check&quot;]}],[0,{&quot;key&quot;:[0,&quot;authored_reading_check_8&quot;],&quot;blockId&quot;:[0,&quot;authored_reading_check_8&quot;],&quot;type&quot;:[0,&quot;micro_quiz&quot;] ;authored_reading_section_1&quot;],&quot;blockId&quot;:[0,&quot;authored_reading_section_1&quot;],&quot;type&quot;:[0,&quot;authored_context&quot;],&quot;typeIndex&quot;:[0,0],&quot;index&quot;:[0,2],&quot;title&quot;:[0,&quot;Introduction&quot;],&quot;preview&quot;:[0,&quot;Missing socks are funny because the problem is small, but it feels strangely personal. You remember putting two socks somewhere. Later, only one sock returns. It feels like the house has a secret. Of course, socks do not disappear by magic. The real explanation is more interesting. A sock is small, soft, easy to hide, and easy to forget. It moves through many places: floor, basket, washer, dryer or drying rack, folding area, and drawer. At each step, one small failure is enough. This lesson treats the missing sock as a tiny science case. The question is not only \&quot;Where did it go?\&quot; The better question is \&quot;Why are humans, machines, and homes so good at losing small things?\&quot;&quot;],&quot;family&quot;:[0,&quot;forward&quot;],&quot;role&quot;:[0,&quot;forward-context&quot;],&quot;actionPattern&quot;:[0,&quot;read&quot;],&quot;phase&quot;:[0,&quot;meaning&quot;],&quot;style&quot;:[0,&quot;&quot;],&quot;anchor&quot;:[0,&quot;&quot;],&quot;selectorKind&quot;:[0,&quot;blockId&quot;],&quot;sourcePath&quot;:[0,&quot;lessonBlocks[2].blockId&quot;],&quot;previousKey&quot;:[0,&quot;authored_reading_warmup&quot;],&quot;previousTitle&quot;:[0,&quot;Warm-Up Questions&quot;],&quot;previousPhase&quot;:[0,&quot;opening&quot;],&quot;nextKey&quot;:[0,&quot;authored_reading_check_1&quot;],&quot;nextTitle&quot;:[0,&quot;Why is the missing sock problem more than a joke?&quot;],&quot;nextPhase&quot;:[0,&quot;check&quot;],&quot;sameTypePreviousKey&quot;:[0,&quot;&quot;],&quot;sameTypeNextKey&quot;:[0,&quot;authored_reading_section_2&quot;],&quot;connectionLabel&quot;:[0,&quot;opening -&gt; meaning -&gt; check&quot;]}],[0,{&quot;key&quot;:[0,&quot;authored_reading_check_1&quot;],&quot;blockId&quot;:
