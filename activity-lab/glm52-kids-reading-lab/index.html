quot;passed&quot;:[0,true]}],[0,{&quot;id&quot;:[0,&quot;word_bank_frequency_fit&quot;],&quot;label&quot;:[0,&quot;Word-bank and frequency fit&quot;],&quot;passed&quot;:[0,true]}],[0,{&quot;id&quot;:[0,&quot;sequence_dependency_fit&quot;],&quot;label&quot;:[0,&quot;Sequence dependency fit&quot;],&quot;passed&quot;:[0,true]}],[0,{&quot;id&quot;:[0,&quot;benchmarkable_output&quot;],&quot;label&quot;:[0,&quot;Benchmarkable output&quot;],&quot;passed&quot;:[0,true]}],[0,{&quot;id&quot;:[0,&quot;hidden_owner_lab_boundary&quot;],&quot;label&quot;:[0,&quot;Hidden owner lab boundary&quot;],&quot;passed&quot;:[0,true]}],[0,{&quot;id&quot;:[0,&quot;no_forbidden_promotion&quot;],&quot;label&quot;:[0,&quot;No forbidden promotion language&quot;],&quot;passed&quot;:[0,true]}],[0,{&quot;id&quot;:[0,&quot;route_purity&quot;],&quot;label&quot;:[0,&quot;GLM route purity&quot;],&quot;passed&quot;:[0,true]}]]],&quot;sourceCounts&quot;:[0,{&quot;stageCount&quot;:[0,12],&quot;lessonCount&quot;:[0,18],&quot;ruleCount&quot;:[0,49],&quot;bookCount&quot;:[0,18],&quot;wordBankEntryCount&quot;:[0,83],&quot;blockedCandidateCount&quot;:[0,59],&quot;pilotPathCount&quot;:[0,0],&quot;nextRuleQueueCount&quot;:[0,0]}],&quot;responseText&quot;:[0,&quot;## Product Shape\nThe Feature Lab is an owner-only experimental tool accessible at `/school/#reading-lab`. It provides a text-only interface for Ovi and Codex to co-author small phonics books. The tool focuses on generating structured packets for capability evaluation rather than automatic production content. It integrates with existing kids-reading data, hidden routes, and validation/export commands, allowing teachers to review, edit, benchmark, and copy the output.\n\n## Coauthor Workflow\n1. **Rule Selection:** Codex or Ovi selects one main phonics rule from the existing snapshot (e.g., `short_a_cvc`).\n2. **Story Context:** Ovi inputs a tiny story context to anchor the book, ensuring it is not a rare-word pattern drill.\n3. **Word Generation:** Codex proposes 4-6 core words and 2-4 support words based on frequency, utility, and grammar roles, while explicitly blocking trap words.\n4. **Sentence Drafting:** Codex drafts 4 short, meaningful page sentences fitting the chosen grammar frame.\n5. **Review &amp; Benchmark:** Ovi reviews the draft against existing `requiredReviewChecks` and word-bank evidence.\n6. **Export:** The validated packet is copied as structured text for evaluation.\n\n## Word Choice Rules\n- **Utility First:** Words must be concrete, useful, and backed by frequency/utility evidence from the existing word bank.\n- **Grammar Fit:** Words must fit declared grammar frames (e.g., `name_plus_action`, `thing_is_place`).\n- **Trap Blocking:** Words listed in `blockedRows` for the selected rule must be strictly avoided (e.g., blocking `have` or `give` for quiet e).\n- **Story Context:** Word selection is driven by the tiny story context, not just pattern matching.\n\n## Sequence Recommendation\nFollow the existing stage progression from `stage_0_sound_and_letters` through `stage_11_advanced_patterns`. Ensure prerequisite rules are met before introducing new ones. For example, complete `short_a_cvc` before moving to `digraph_sh`. Use the lab to fill gaps in stages with fewer books (e.g., `stage_6_r_controlled` or `stage_8_syllable_patterns`).\n\n## Prototype UI\nA text-only interface at `/school/#reading-lab` with the following sections:\n- **Rule Selector:** Dropdown to choose a single `ruleId`.\n- **Story Context Input:** Text field for the tiny story seed.\n- **Word Bank Display:** Shows proposed core, support, and blocked words with utility scores.\n- **Sentence Builder:** Displays 4 drafted page sentences.\n- **Validation Status:** Shows pass/fail for `requiredReviewChecks`.\n- **Export Packet:** Button to copy the structured packet as markdown/JSON.\n\n## Benchmarks\n- Validate against all `requiredReviewChecks` (e.g., `one_main_rule`, `useful_vocabulary`, `grammar_frame`).\n- Verify word utility scores and frequency bands match the existing snapshot.\n- Ensure no blocked trap words are included.\n- Confirm the output is a structured packet for evaluation, not production content.\n\n## Integration Risks\n- **Data Misalignment:** The lab must correctly read the existing snapshot; otherwise, word choices may lack evidence.\n- **Validation Bypass:** If the teacher skips the benchmark step, blocked words might slip through.\n- **Over-Generation:** Generating too many books at once could overwhelm the review process.\n- **Dependency on Existing Routes:** The tool must not alter hidden routes or existing kids-reading validation commands.\n\n## Candidate Book Sketch\n- **ruleId:** `r_controlled_ar`\n- **Core Words:** `car`, `park`, `star`, `jar` *(Note: `jar` needs word-bank evidence before use)*\n- **Support Words:** `is`, `in`, `the`, `a`\n- **Avoid/Trap Words:** `war`, `warm`, `word`, `were`\n- **Grammar Frame:** `thing_is_place`\n- **Page Sentences:**\n  1. The car is in the park.\n  2. A star is in the jar.\n  3. The car is by the star.\n  4. The star is in the park.\n- **Tap-Sound Plan:** Tap the `ar` in `car`, `park`, `star`, and `jar` to hear the r-controlled sound.&quot;],&quot;candidate&quot;:[0,{&quot;title&quot;:[0,&quot;GLM 5.2 kids reading coauthor workbench&quot;],&quot;accessPath&quot;:[0,&quot;/activity-lab/glm52-kids-reading-lab/?access=glm52-kids-reading-lab-ovi-20260617&quot;],&quot;decisionBoundary&quot;:[0,&quot;research_only_no_promote&quot;]}],&quot;intendedWorkflow&quot;:[0,{&quot;currentMode&quot;:[0,&quot;api_chat_scout&quot;],&quot;currentLabel&quot;:[0,&quot;OpenRouter chat benchmark&quot;],&quot;currentSummary&quot;:[0,&quot;The current saved runs use OpenRouter Chat Completions. They are useful for model scouting, but they are not the best test of GLM-5.2 as a coding agent.&quot;],&quot;targetMode&quot;:[0,&quot;coding_agent_cli&quot;],&quot;targetLabel&quot;:[0,&quot;GLM Coding Plan agent run&quot;],&quot;targetSummary&quot;:[0,&quo raint-first UI that filters possibilities before drafting begins&quot;],[0,&quot;Generating a &#39;Codex Packet&#39; rather than a final asset to maintain the no-promote boundary&quot;],[0,&quot;Live heuristic check for &#39;disguised word lists&#39; vs. real sentences&quot;]]],&quot;risks&quot;:[1,[[0,&quot;The AI might struggle to generate coherent stories with highly constrained vocabularies&quot;],[0,&quot;Over-reliance on automated checks might miss subtle pedagogical nuances&quot;],[0,&quot;The &#39;Workshop&#39; aesthetic might feel too slow for rapid prototyping&quot;]]],&quot;benchmarkPlan&quot;:[1,[[0,&quot;Inject identical source snapshot data into Constrained, Full-Take, and CLI modes&quot;],[0,&quot;Task all modes with creating a 4-page book for a specific rule&quot;],[0,&quot;Evaluate on Pedagogical Fidelity (trap avoidance), Story Coherence, and Constraint Adherence&quot;],[0,&quot;Compare API text generation (Modes A/B) with file manipulation and script validation (Mode C)&quot;]]],&quot;designCouncilCaveat&quot;:[0,&quot;A design council becomes useless if it only grades prompt-shaped artifacts because it measures template obedience rather than actual product taste and pedagogical efficacy.&quot;],&quot;shouldPrototype&quot;:[0,true],&quot;currentLimitation&quot;:[0,&quot;Generated through OpenRouter API, not as a GLM Coding Plan coding-agent implementation.&quot;],&quot;responseText&quot;:[0,&quot;# Ovi&#39;s Loom: A Co-Authoring Lab for Decodable Phonics Books\n\n## 1. Feature Concept: The Loom\n\nOvi&#39;s Loom is an owner-only experimental workspace designed to bridge the gap between systematic phonics rules and meaningful storytelling. It is not a content generator; it is a **collaborative weaving environment**. \n\nIn this model, phonics rules, grammar frames, and approved vocabulary are the \&quot;yarn.\&quot; The story is the \&quot;fabric.\&quot; The Loom provides the structure (warp) and the shuttle (the AI/Codex agent) that weaves the yarn into the fabric under the owner&#39;s strict supervision.\n\n**Core Principles:**\n*   **Meaning First, Pattern Second:** The tool forces story coherence before phonics compliance. A word is only selected if it serves the tiny narrative.\n*   **Trap-Aware Yarn:** The \&quot;Yarn Basket\&quot; visually separates usable words from blocked traps, preventing accidental inclusion of pattern-breaking vocabulary (e.g., blocking \&quot;cow\&quot; in a long-o lesson).\n*   **No-Promote Boundary:** The Loom outputs to a \&quot;Review Tray,\&quot; never directly to the learner-facing app. It generates a \&quot;Codex Packet\&quot; for final implementation.\n\n## 2. Interaction Design &amp; Visual Direction\n\n**Visual/Tone Direction: \&quot;The Workshop\&quot;**\n*   **Aesthetic:** Warm, tactile, and calm. Analog textures (paper, wood, yarn) rendered in high-resolution digital UI. The tone is quiet and focused, reflecting the careful nature of early literacy.\n*   **Layout:** A three-panel workspace.\n    1.  **Left Panel (The Yarn Basket):** Displays the selected Stage, Rule, and Grammar Frame. Below, two columns: \&quot;Usable Words\&quot; (color-coded by utility score) and \&quot;Blocked Traps\&quot; (greyed out with reasons on hover).\n    2.  **Center Panel (The Loom):** The drafting space. Pages are represented as \&quot;cards\&quot; on a timeline. The AI suggests sentences; Ovi drags words from the Yarn Basket to manually edit or approve.\n    3.  **Right Panel (The Review Tray):** Live validation against `requiredReviewChecks`. Green checks appear as constraints are met. A \&quot;Generate Codex Packet\&quot; button sits at the bottom.\n\n**Interaction Model:**\n*   **Constraint-First Selection:** Ovi begins by locking in the `ruleId` and `grammarFrame`. The UI immediately filters the word bank.\n*   **Story Seeding:** Ovi inputs a \&quot;Story Seed\&quot; (e.g., \&quot;A goat on a boat\&quot;). The AI drafts 3 potential page sequences using *only* available yarn.\n*   **Tactile Editing:** Drag-and-drop words. If Ovi drags a blocked word, it snaps back with a red warning tooltip explaining the trap.\n\n## 3. Workflow: Sequence, Word Choice, Drafting, Review, Handoff\n\n1.  **Sequence &amp; Scope:** Ovi selects the target `stageId` and `ruleId` (e.g., `stage_5_vowel_teams`, `long_o_oa_ow_team`). The Loom loads the corresponding `vocabularyPolicy` and `grammarFrames`.\n2.  **Word Curation:** The Loom populates the Yarn Basket. Ovi reviews the `usefulWordRows` and selects the core meaning words for this specific book (e.g., *goat, boat, snow, road*). The `blockedRows` are visible but locked.\n3.  **Drafting (The Weave):** Ovi provides a story seed. The AI drafts pages. *Example constraint check:* \&quot;Does this sentence use the `name_has_thing` frame?\&quot; If yes, it passes.\n4.  **Review (The Inspection):** The Loom runs automated checks:\n    *   *One Main Rule:* Are all target words using the selected `ruleId`?\n    *   *Learner Load:* Is there only one sentence per page?\n    *   *Sentence Quality:* Is it a disguised word list? (Heuristic: Does it have a subject, verb, and object, or is it just \&quot;Goat. Boat. Snow.\&quot;?)\n5.  **Codex Handoff:** Upon approval, Ovi clicks \&quot;Weave Packet.\&quot; The Loom generates a structured JSON/Markdown packet containing the book data, the validation status, and specific instructions for Codex to finalize the asset (e.g., \&quot;Generate image prompt for: A goat on a boat. Do not include text in image.\&quot;).\n\n## 4. Benchmark Harness: The Fair Comparison\n\nTo evaluate GLM-5.2&#39;s taste and judgment, we need a harness that tests three modes fairly:\n\n*   **Mode A (Constrained Prompt):** The current baseline. A strict template prompt asking for a book based on a rule.\n*   **Mode B (Full-Take Prompt):** This creative pass. The AI is given the full context and asked to design the workflow and example.\n*   **Mode C (Future Coding-Agent CLI):** The AI operates in a temporary worktree, manipulating actual files (e.g., `book.json`, `word_bank.csv`) using CLI tools.\n\n**Harness Steps:**\n1.  **Seed Injection:** Provide all three modes with the identical `Source Snapshot` data for a specific stage (e.g., Stage 5).\n2.  **Task:** \&quot;Create a 4-page decodable book for the `long_o_oa_ow_team` rule.\&quot;\n3.  **Evaluation Metrics:**\n    *   **Pedagogical Fidelity:** Did it avoid blocked traps? (Binary: Yes/No). Did it use high-utility words? (Score 1-5 based on `utilityScore`).\n    *   **Story Coherence:** Human rating (1-5) on whether the story makes sense.\n    *   **Process Transparency:** Did the mode explain its word choices? (Binary).\n    *   **Constraint Adherence:** Did it follow the `grammarFrames`? (Binary).\n4.  **Execution:** Mode A and B are run via API. Mode C is run via CLI in a sandboxed repo where the agent must write the book to a file and run a validation script (`npm run validate-book`).\n\n## 5. Critique of the Design Council\n\n**The Echo Chamber Risk:** A design council becomes useless if it only grades \&quot;prompt-shaped artifacts\&quot; because it measures *compliance to a template*, not *product taste*. If the council only checks \&quot;Did the AI fill in the &#39;Story Seed&#39; field?\&quot;, it misses whether the seed was actually good. It rewards obedience over innovation. The council must evaluate the *holistic output*—the pedagogical soundness, the story charm, and the workflow efficiency—not just the structural fidelity to a pre-defined form. A truly creative AI might propose a better structure that the council&#39;s rubric doesn&#39;t account for.\n\n## 6. Concrete Book-Making Example (Advisory)\n\n**Target:** `stage_5_vowel_teams` -&gt; `long_o_oa_ow_team`\n**Grammar Frame:** `name_has_thing`, `thing_is_place`\n\n**Yarn Selection (Approved by Ovi):**\n*   *Core:* goat, boat, snow, road, row.\n*   *Support:* is, on, the, can.\n\n**Drafting:**\n*   *Page 1:* The goat is on a boat. (Frame: `thing_is_place`)\n*   *Page 2:* Snow is on the road. (Frame: `thing_is_place`)\n*   *Page 3:* The goat can row. (Frame: `can_plus_action` - *Note: This frame is allowed in Stage 5*).\n\n**Review Check:**\n*   *One Main Rule:* Pass. All target words (goat, boat, snow, road, row) use the `oa` or `ow` pattern.\n*   *Traps:* Pass. Did not use \&quot;cow\&quot; or \&quot;now\&quot; (blocked).\n*   *Evidence Gap:* The story is minimal. While decodable, it lacks a narrative arc. *Recommendation for Codex:* Add a 4th page: \&quot;The goat can row home.\&quot; (Wait, \&quot;home\&quot; is not in the selected yarn. Flag for owner review).\n\n```json\n{\n  \&quot;conceptName\&quot;: \&quot;Ovi&#39;s Loom\&quot;,\n  \&quot;oneLine\&quot;: \&quot;A collaborative weaving environment where phonics rules and approved vocabulary are interlaced into meaningful decodable stories under strict owner supervision.\&quot;,\n  \&quot;primaryWorkflow\&quot;: [\n    \&quot;Select Stage and Rule to filter the Yarn Basket\&quot;,\n    \&quot;Curate usable words and review blocked traps\&quot;,\n    \&quot;Draft pages using story seeds and grammar frames\&quot;,\n    \&quot;Run automated validation against requiredReviewChecks\&quot;,\n    \&quot;Generate a structured Codex Packet for final handoff\&quot;\n  ],\n  \&quot;designDirection\&quot;: [\n    \&quot;Warm, tactile &#39;Workshop&#39; aesthetic with analog textures\&quot;,\n    \&quot;Three-panel layout: Yarn Basket, Loom (Drafting), Review Tray\&quot;,\n    \&quot;Drag-and-drop interaction for word placement\&quot;,\n    \&quot;Visual locking of blocked words with contextual tooltips\&quot;\n  ],\n  \&quot;novelIdeas\&quot;: [\n    \&quot;The &#39;Yarn Basket&#39; metaphor separating usable words from traps visually\&quot;,\n    \&quot;Constraint-first UI that filters possibilities before drafting begins\&quot;,\n    \&quot;Generating a &#39;Codex Packet&#39; rather than a final asset to maintain the no-promote boundary\&quot;,\n    \&quot;Live heuristic check for &#39;disguised word lists&#39; vs. real sentences\&quot;\n  ],\n  \&quot;risks\&quot;: [\n    \&quot;The AI might struggle to generate coherent stories with highly constrained vocabularies\&quot;,\n    \&quot;Over-reliance on automated checks might miss subtle pedagogical nuances\&quot;,\n    \&quot;The &#39;Workshop&#39; aesthetic might feel too slow for rapid prototyping\&quot;\n  ],\n  \&quot;benchmarkPlan\&quot;: [\n    \&quot;Inject identical source snapshot data into Constrained, Full-Take, and CLI modes\&quot;,\n    \&quot;Task all modes with creating a 4-page book for a specific rule\&quot;,\n    \&quot;Evaluate on Pedagogical Fidelity (trap avoidance), Story Coherence, and Constraint Adherence\&quot;,\n    \&quot;Compare API text generation (Modes A/B) with file manipulation and script validation (Mode C)\&quot;\n  ],\n  \&quot;designCouncilCaveat\&quot;: \&quot;A design council becomes useless if it only grades prompt-shaped artifacts because it measures template obedience rather than actual product taste and pedagogical efficacy.\&quot;,\n  \&quot;shouldPrototype\&quot;: true\n}\n```&quot;]}]}],&quot;curriculum&quot;:[0,{&quot;version&quot;:[0,&quot;kids_reading_curriculum_v1&quot;],&quot;status&quot;:[0,&quot;draft_spine&quot;],&quot;lastUpdated&quot;:[0,&quot;2026-06-09&quot;],&quot;purpose&quot;:[0,&quot;Reusable Ovi Kids Reading curriculum spine that connects phonics rules with useful vocabulary, simple grammar frames, and tiny story meaning.&quot;],&quot;curriculumPolicy&quot;:[0,{&quot;sharedSpine&quot;:[0,&quot;All learners use the same core curriculum order. Accounts track progress, known rules, known words, and struggle points inside that shared order.&quot;],&quot;oneMainRulePerBook&quot;:[0,true],&quot;phonicsUse&quot;:[0,&quot;Each book teaches one main phonics rule and may review earlier rules.&quot;],&quot;grammarUse&quot;:[0,&quot;Each book also declares one small sentence grammar frame, such as name plus action or can plu
