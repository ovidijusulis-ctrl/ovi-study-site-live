  <script>
    (() => {
      const root = document.querySelector("[data-image-metadata-lab]");
      const template = document.querySelector("[data-image-metadata-template]");
      const mount = document.querySelector("[data-image-metadata-mount]");
      const lock = document.querySelector("[data-image-metadata-lock]");
      const storageKey = "ovi-image-metadata-access";
      const requiredKey = root?.getAttribute("data-required-key") || "";
      const params = new URLSearchParams(window.location.search || "");
      const unlocked = params.get("access") === requiredKey || window.sessionStorage.getItem(storageKey) === "1";
      const publishSnapshot = () => {
        if (!root) return;
        const images = Array.from(document.querySelectorAll(".image-meta-figure")).map((figure) => {
          const image = figure.querySelector("img");
          return {
            id: figure.getAttribute("data-image-id") || "",
            role: figure.getAttribute("data-image-role") || "",
            src: image?.getAttribute("src") || "",
            loading: image?.getAttribute("loading") || "",
            fetchpriority: image?.getAttribute("fetchpriority") || "",
            width: Number(image?.getAttribute("width") || 0),
            height: Number(image?.getAttribute("height") || 0),
            lqipSrc: figure.getAttribute("data-lqip-src") || "",
          };
        });
        window.__OVI_IMAGE_METADATA_LQIP_LAB = {
          state: root.getAttribute("data-image-metadata-state") || "locked",
          proofSurface: root.getAttribute("data-proof-surface") || "",
          targetPlacement: root.getAttribute("data-target-placement") || "",
          fixtureEpisode: root.getAttribute("data-fixture-episode") || "",
          assetMode: root.getAttribute("data-asset-mode") || "",
          imageCount: Number(root.getAttribute("data-image-count") || 0),
          heroCount: Number(root.getAttribute("data-hero-count") || 0),
          priorityCount: Number(root.getAttribute("data-priority-count") || 0),
          lazyBelowFoldCount: Number(root.getAttribute("data-lazy-below-fold-count") || 0),
          hasLqipSidecars: root.getAttribute("data-has-lqip-sidecars") === "true",
          lqipMaxBytes: Number(root.getAttribute("data-lqip-max-bytes") || 0),
          reviewedArtUnchanged: root.getAttribute("data-reviewed-art-unchanged") === "true",
          hasAbsolutePath: root.getAttribute("data-has-absolute-path") === "true",
          productionRouteIntegrated: root.getAttribute("data-production-route-integrated") === "true",
          outputContractChanged: root.getAttribute("data-output-contract-changed") === "true",
          canWriteLearnerEvidence: root.getAttribute("data-can-write-learner-evidence") === "true",
          canWriteMasteryEvidence: root.getAttribute("data-can-write-mastery-evidence") === "true",
          canPromotePublic: root.getAttribute("data-can-promote-public") === "true",
          safePayloadOnly: root.getAttribute("data-safe-payload-only") === "true",
          accessQueryCleaned: root.getAttribute("data-access-query-cleaned") === "true",
          images,
        };
      };
      if (!root || !template || !mount || !unlocked) return;

      window.sessionStorage.setItem(storageKey, "1");
      root.setAttribute("data-image-metadata-state", "ready");
      if (lock) lock.hidden = true;
      if (!mount.hasChildNodes()) {
        mount.appendChild(template.content.cloneNode(true));
      }
      if (window.history?.replaceState) {
        const url = new URL(window.location.href);
        if (url.searchParams.has("access")) {
          url.searchParams.delete("access");
          window.history.replaceState(window.history.state, document.title, `${url.pathname}${url.search}${url.hash}`);
        }
      }
      root.setAttribute("data-access-query-cleaned", String(!new URLSearchParams(window.location.search || "").has("access")));
      publishSnapshot();
    })();
  </script>
