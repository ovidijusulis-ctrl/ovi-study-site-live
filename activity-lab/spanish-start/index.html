      (() => {

        const ALLOWED = ["en", "ja", "es"];
        const normalizeLanguage = (value) => {
          const language = String(value || "").trim().toLowerCase();
          return ALLOWED.includes(language) ? language : "en";

        const readCookieLanguage = () => {
          const match = document.cookie.match(new RegExp(`(?:^|; )${COOKIE_KEY}=([^;]+)`));
          if (!match) return "";

            return normalizeLanguage(decodeURIComponent(match[1]));

            return normalizeLanguage(match[1]);

        const detectAssistLanguage = () => {
          return "en";

        let language = "en";
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          language = saved ? normalizeLanguage(saved) : (readCookieLanguage() || detectAssistLanguage());
        } catch (_err) {
          language = readCookieLanguage() || detectAssistLanguage();
        }

        document.documentElement.dataset.assistLanguage = language;
      })();
