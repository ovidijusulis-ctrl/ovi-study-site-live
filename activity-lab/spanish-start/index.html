      (() => {
        const STORAGE_KEY = "ovi-assist-language";
        const COOKIE_KEY = "ovi-assist-language";
        const ALLOWED = ["en", "ja", "es"];
        const normalizeLanguage = (value) => {
          const language = String(value || "").trim().toLowerCase();
          return ALLOWED.includes(language) ? language : "en";
        };
        const readCookieLanguage = () => {
          const match = document.cookie.match(new RegExp(`(?:^|; )${COOKIE_KEY}=([^;]+)`));
          if (!match) return "";
          try {
            return normalizeLanguage(decodeURIComponent(match[1]));
          } catch (_err) {
            return normalizeLanguage(match[1]);
          }
        };
        const detectAssistLanguage = () => {
          return "en";
        };

        let language = "en";
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          language = saved ? normalizeLanguage(saved) : (readCookieLanguage() || detectAssistLanguage());
        } catch (_err) {
          language = readCookieLanguage() || detectAssistLanguage();
        }

        document.documentElement.dataset.assistLanguage = language;
      })();

  <script>
    (() => {
      const root = document.querySelector("[data-spanish-start-lab]");
      const template = document.querySelector("[data-spanish-start-template]");
      const mount = document.querySelector("[data-spanish-start-mount]");
      const lock = document.querySelector("[data-spanish-start-lock]");
      const storageKey = "ovi-spanish-start-access";
      const requiredKey = root?.getAttribute("data-required-key") || "";
      const params = new URLSearchParams(window.location.search || "");
      const hasAccess = params.get("access") === requiredKey;
      const unlocked = hasAccess || window.sessionStorage.getItem(storageKey) === "1";
      if (!root || !template || !mount || !unlocked) return;

      window.sessionStorage.setItem(storageKey, "1");
      root.setAttribute("data-spanish-start-state", "ready");
      if (lock) lock.hidden = true;
      if (!mount.hasChildNodes()) {
        mount.appendChild(template.content.cloneNode(true));
      }
      if (hasAccess && window.history?.replaceState) {
        params.delete("access");
        const query = params.toString();
        window.history.replaceState({}, "", `${window.location.pathname}${query ? `?${query}` : ""}${window.location.hash || ""}`);
      }
    })();
