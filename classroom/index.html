d sport event in the same trip?&quot;],&quot;support&quot;:[1,[[0,&quot;When you travel, do you prefer famous places or smaller places with a hidden feeling?&quot;],[0,&quot;What makes a city memorable for you: views, history, food and drink, people, or atmosphere?&quot;],[0,&quot;Would you enjoy mixing slow sightseeing with a loud sport event in the same trip?&quot;]]],&quot;source&quot;:[0,&quot;OPENING&quot;],&quot;answer&quot;:[0,&quot;&quot;],&quot;choices&quot;:[1,[]],&quot;roles&quot;:[1,[[0,&quot;Customer&quot;],[0,&quot;Staff&quot;],[0,&quot;Observer&quot;]]],&quot;roleCards&quot;:[1,[]],&quot;meta&quot;:[0,{&quot;blockType&quot;:[0,&quot;authored_intro&quot;],&quot;audioStartSec&quot;:[0,41.626]}]}],[0,{&quot;id&quot;:[0,&quot;focus-authored-reading-section-1&quot;],&quot;type&quot;:[0,&quot;focus&quot;],&quot;title&quot;:[0,&quot;1. A Small Country with a Layered Identity&quot;],&quot;prompt&quot;:[0,&quot;Luxembourg sits between France, Belgium, and Germany. That position helps explain why the country feels international. Luxembourgish, French, German, and English can appear in different situations, and the country often feels like a meeting point rather than a simple national story. The interesting thing is the contrast. Luxembourg has medieval streets, stone bridges, river valleys, castles, and vineyards. It is also a financial center and a place connected with European institutions and international business. A visitor can feel both the old borderland and the modern European capital in the same day. This makes Luxembourg useful for travel English because it is not only a checklist destination. It rewards careful attention. You need to notice layers: language, geography, history, money, politics, wine, and quiet local pride.&quot;],&quot;support&quot;:[1,[]],&quot;source&quot;:[0,&quot;NEWS STORY&quot;],&quot;answer&quot;:[0,&quot;&quot;],&quot;choices&quot;:[1,[]],&quot;roles&quot;:[1,[[0,&quot;Customer&quot;],[0,&quot;Staff&quot;],[0,&quot;Observer&quot;]]],&quot;roleCards&quot;:[1,[]],&quot;meta&quot;:[0,{&quot;blockType&quot;:[0,&quot;authored_context&quot;],&quot;audioStartSec&quot;:[0,65.603]}]}],[0,{&quot;id&quot;:[0,&quot;focus-authored-reading-section-2&quot;],&quot;type&quot;:[0,&quot;focus&quot;],&quot;title&quot;:[0,&quot;2. Luxembourg City: A Fortress City on Different Levels&quot;],&quot;prompt&quot;:[0,&quot;Luxembourg City is not a flat capital that you understand from one street. It is built around cliffs, valleys, bridges, upper areas, and lower riverside districts such as Grund. This geography helped make the city naturally defensive. UNESCO describes Luxembourg as one of Europe&#39;s great fortified sites from the 16th century until 1867, when many walls were dismantled. Different European powers reinforced the fortress over several centuries. That is why the old quarters and fortifications matter: they are not just pretty old stones. They are evidence of a city shaped by strategy. For a traveller, this changes the walk. You move from viewpoints to bridges, from high streets down toward the Alzette valley, and from open views into narrow passages. The city feels almost theatrical, as if stone, water, height, and history are building the scene together.&quot;],&quot;support&quot;:[1,[]],&quot;source&quot;:[0,&quot;NEWS STORY&quot;],&quot;answer&quot;:[0,&quot;&quot;],&quot;choices&quot;:[1,[]],&quot;roles&quot;:[1,[[0,&quot;Customer&quot;],[0,&quot;Staff&quot;],[0,&quot;Observer&quot;]]],&quot;roleCards&quot;:[1,[]],&quot;meta&quot;:[0,{&quot;blockType&quot;:[0,&quot;authored_context&quot;],&quot;audioStartSec&quot;:[0,130.758]}]}],[0,{&quot;id&quot;:[0,&quot;focus-authored-reading-section-3&quot;],&quot;type&quot;:[0,&quot;focus&quot;],&quot;title&quot;:[0,&quot;3. The Bock Casemates: The Hidden City Under the View&quot;],&quot;prompt&quot;:[0,&quot;The Bock Casemates are underground defensive tunnels built into the rock below the old city. The Bock Promontory is also connected with the origin story of Luxembourg City, because Count Sigfried built a castle there in 963. Later, the fortress system became one reason the city was called the \&quot;Gibraltar of the North.\&quot; The casemates help learners understand an important idea: Luxembourg&#39;s beauty is not only on the surface. Above ground, you may see the Corniche, old walls, the river valley, and beautiful viewpoints. Under the rock, you find tunnels, gun chambers, loopholes, military routes, and the memory of siege. This is why the city feels layered in a literal way. The old town is not only streets and squares. It is also vertical space: cliff, bridge, tunnel, valley, and hidden passage. A good traveller notices both the postcard view and the system that made the view possible.&quot;],&quot;support&quot;:[1,[]],&quot;source&quot;:[0,&quot;NEWS STORY&quot;],&quot;answer&quot;:[0,&quot;&quot;],&quot;choices&quot;:[1,[]],&quot;roles&quot;:[1,[[0,&quot;Customer&quot;],[0,&quot;Staff&quot;],[0,&quot;Observer&quot;]]],&quot;roleCards&quot;:[1,[]],&quot;meta&quot;:[0,{&quot;blockType&quot;:[0,&quot;authored_context&quot;],&quot;audioStartSec&quot;:[0,202.234]}]}],[0,{&quot;id&quot;:[0,&quot;focus-authored-reading-section-4&quot;],&quot;type&quot;:[0,&quot;focus&quot;],&quot;title&quot;:[0,&quot;4. Vianden and the Meaning of Castle Culture&quot;],&quot;prompt&quot;:[0,&quot;If someone wants one strong castle image in Luxembourg, Vianden Castle is usually the first choice. The official castle history says it was built between the 11th and 14th centuries and became one of the important feudal residences of the Romanesque and Gothic periods in Europe. Vianden is beautiful, but its story is not only romantic. In the 19th century, the castle was sold piece by piece and became a ruin. In 1977, it was transferred to state ownership, and restoration work made the castle visible again as a major monument. Other castles show different moods. Beaufort combines medieval ruins with a later Renaissance castle. Larochette stands above a valley. Bourscheid overlooks the Sure River and is described as the largest castle in the country. Clervaux connects castle space with photography and museum culture. Together, they show that castles are not one idea. They can mean defense, family power, ruins, restoration, landscape, art, and national memory.&quot;],&quot;support&quot;:[1,[]],&quot;source&quot;:[0,&quot;NEWS STORY&quot;],&quot;answer&quot;:[0,&quot;&quot;],&quot;choices&quot;:[1,[]],&quot;roles&quot;:[1,[[0,&quot;Customer&quot;],[0,&quot;Staff&quot;],[0,&quot;Observer&quot;]]],&quot;roleCards&quot;:[1,[]],&quot;meta&quot;:[0,{&quot;blockType&quot;:[0,&quot;authored_context&quot;],&quot;audioStartSec&quot;:[0,279.377]}]}],[0,{&quot;id&quot;:[0,&quot;focus-authored-reading-section-5&quot;],&quot;type&quot;:[0,&quot;focus&quot;],&quot;title&quot;:[0,&quot;5. Moselle Wine: The Quiet Elegant Side&quot;],&quot;prompt&quot;:[0,&quot;Luxembourg&#39;s Moselle region is in the east and southeast of the country, along the river border with Germany. The public Luxembourg portal describes the Moselle as a 42 km natural border and a long-standing grape and wine growing region. This gives the trip a calmer side after cliffs, tunnels, and castles. The region is especially connected with white and sparkling wines. Visit Luxembourg lists grape varieties such as Pinots, Auxerrois, Riesling, Rivaner, and Elbling. Cremant de Luxembourg is a local sparkling wine style, and it can be a useful travel word because many people know Champagne but do not know Cremant. The important travel idea is scale. Luxembourg wine is not famous in the same global way as Bordeaux, Burgundy, or Tuscany. That can make it more interesting. Drinking local wine in the Moselle is a way to taste geography: river, cool climate, limestone, borderland culture, and local confidence without much shouting.&quot;],&quot;support&quot;:[1,[]],&quot;source&quot;:[0,&quot;NEWS STORY&quot;],&quot;answer&quot;:[0,&quot;&quot;],&quot;choices&quot;:[1,[]],&quot;roles&quot;:[1,[[0,&quot;Customer&quot;],[0,&quot;Staff&quot;],[0,&quot;Observer&quot;]]],&quot;roleCards&quot;:[1,[]],&quot;meta&quot;:[0,{&quot;blockType&quot;:[0,&quot;authored_context&quot;],&quot;audioStartSec&quot;:[0,359.054]}]}],[0,{&quot;id&quot;:[0,&quot;focus-authored-reading-section-6&quot;],&quot;type&quot;:[0,&quot;focus&quot;],&quot;title&quot;:[0,&quot;6. Formula 1 from Luxembourg: Spa Is the Sudden Energy Change&quot;],&quot;prompt&quot;:[0,&quot;The Formula 1 part of this trip changes the energy completely. Spa-Francorchamps is in Belgium, not Luxembourg, but it can fit naturally into a Luxembourg-based trip because the region is close enough for cross-border travel. The official Spa Grand Prix site lists the 2026 Belgian Grand Prix for 17-19 July 2026. Spa is famous because it is not a simple modern city circuit. Formula 1&#39;s official race page describes the original public-road circuit through Francorchamps, Malmedy, and Stavelot, and the modern circuit as 7.004 km through the forests and rolling hills of the Ardennes. It is long, fast, and shaped by elevation. Weather adds another layer of drama. Formula 1&#39;s Belgium fan guide warns that Spa weather is unpredictable and that rain is always possible. This matters because rain changes tire choice, visibility, braking, risk, and team strategy. One race weekend can become a lesson in speed, engineering, judgment, and patience.&quot;],&quot;support&quot;:[1,[]],&quot;source&quot;:[0,&quot;NEWS STORY&quot;],&quot;answer&quot;:[0,&quot;&quot;],&quot;choices&quot;:[1,[]],&quot;roles&quot;:[1,[[0,&quot;Customer&quot;],[0,&quot;Staff&quot;],[0,&quot;Observer&quot;]]],&quot;roleCards&quot;:[1,[]],&quot;meta&quot;:[0,{&quot;blockType&quot;:[0,&quot;authored_context&quot;],&quot;audioStartSec&quot;:[0,438.209]}]}],[0,{&quot;id&quot;:[0,&quot;focus-authored-reading-section-7&quot;],&quot;type&quot;:[0,&quot;focus&quot;],&quot;title&quot;:[0,&quot;7. One Trip, Many Moods&quot;],&quot;prompt&quot;:[0,&quot;An eight-day Luxembourg trip can have a surprising rhythm. One day may feel slow and historical: old streets, the Corniche, the Grund, or the Bock Casemates. Another day may feel architectural and visual: Vianden, Beaufort, Bourscheid, or Larochette. Another day may feel relaxed and elegant: Moselle wine, a river village, and local Cremant. Then Formula 1 adds noise, speed, crowds, weather pressure, and technology. At first, this seems like the opposite of castles and wine. But there is a connection. Castles show old systems of power and protection. F1 shows modern systems of speed, safety, engineering, and decision-making. The best travel memories often come from contrast. Quiet streets feel quieter after a race. A local glass of wine feels richer after a long walking day. A castle feels more powerful when you understand why it was built. Travel becomes deeper when you can explain the story behind the mood.&quot;],&quot;support&quot;:[1,[]],&quot;source&quot;:[0,&quot;NEWS STORY&quot;],&quot;answer&quot;:[0,&quot;&quot;],&quot;choices&quot;:[1,[]],&quot;roles&quot;:[1,[[0,&quot;Customer&quot;],[0,&quot;Staff&quot;],[0,&quot;Observer&quot;]]],&quot;roleCards&quot;:[1,[]],&quot;meta&quot;:[0,{&quot;blockType&quot;:[0,&quot;authored_context&quot;],&quot;audioStartSec&quot;:[0,517.438]}]}],[0,{&quot;id&quot;:[0,&quot;roleplay-luxembourg-castles-old-streets-&quot;],&quot;type&quot;:[0,&quot;roleplay&quot;],&quot;title&quot;:[0,&quot;Roleplay: Luxembourg: Castles, Old Streets, Wine, and Formula 1&quot;],&quot;prompt&quot;:[0,&quot;Practice this situation: Luxembourg: Castles, Old Streets, Wine, and Formula 1.&quot;],&quot;support&quot;:[1,[]],&quot;source&quot;:[0,&quot;practical material&quot;],&quot;answer&quot;:[0,&quot;&quot;],&quot;choices&quot;:[1,[]],&quot;roles&quot;:[1,[[0,&quot;Customer&quot;],[0,&quot;Staff&quot;],[0,&quot;Observer&quot;]]],&quot;roleCards&quot;:[1,[]],&quot;meta&quot;:[0,{}]}],[0,{&quot;id&quot;:[0,&quot;open-authore oment to stay safe, or is this the moment to take a risk?&quot;],[0,&quot;Tennis is played on different court surfaces. The main three are clay, grass, and hard court. The surface changes how the ball bounces and how fast a point can feel.&quot;],[0,&quot;Clay often makes the ball slower and higher after the bounce. This can make rallies longer, so patience matters. Grass often makes the ball stay lower and move faster, so quick reactions matter. Hard courts are often more balanced, so many styles can work.&quot;]]],&quot;activities&quot;:[1,[[0,{&quot;id&quot;:[0,&quot;focus-authored-reading-goal&quot;],&quot;type&quot;:[0,&quot;focus&quot;],&quot;title&quot;:[0,&quot;Lesson Goal&quot;],&quot;prompt&quot;:[0,&quot;Understand tennis rallies, safe and risky shots, court surfaces, and four famous tournament examples.&quot;],&quot;support&quot;:[1,[]],&quot;source&quot;:[0,&quot;OPENING&quot;],&quot;answer&quot;:[0,&quot;&quot;],&quot;choices&quot;:[1,[]],&quot;roles&quot;:[1,[[0,&quot;Customer&quot;],[0,&quot;Staff&quot;],[0,&quot;Observer&quot;]]],&quot;roleCards&quot;:[1,[]],&quot;meta&quot;:[0,{&quot;blockType&quot;:[0,&quot;lesson_goal&quot;],&quot;audioStartSec&quot;:[0,0]}]}],[0,{&quot;id&quot;:[0,&quot;focus-authored-reading-introduction&quot;],&quot;type&quot;:[0,&quot;focus&quot;],&quot;title&quot;:[0,&quot;Introduction&quot;],&quot;prompt&quot;:[0,&quot;Tennis is not only hitting the ball hard. This lesson shows one clear idea: players make smart choices inside a rally. You will learn what a rally is, why some shots are safe or risky, and how clay, grass, and hard courts can change the match.&quot;],&quot;support&quot;:[1,[]],&quot;source&quot;:[0,&quot;OPENING&quot;],&quot;answer&quot;:[0,&quot;&quot;],&quot;choices&quot;:[1,[]],&quot;roles&quot;:[1,[[0,&quot;Customer&quot;],[0,&quot;Staff&quot;],[0,&quot;Observer&quot;]]],&quot;roleCards&quot;:[1,[]],&quot;meta&quot;:[0,{&quot;blockType&quot;:[0,&quot;authored_intro&quot;],&quot;audioStartSec&quot;:[0,8.18 &quot;:[0,&quot;focus&quot;],&quot;title&quot;:[0,&quot;2. Safe Shots and Risky Shots&quot;],&quot;prompt&quot;:[0,&quot;A safe shot gives the player more room for error. It often goes higher over the net or deeper into the court. Safe does not mean weak. A deep safe shot can make the opponent move back and wait. A risky shot tries to finish the point faster. It may go close to a line, close to the net, or into a small open space. If it works, the player may win the point. If it misses, the point is over. Good tennis players do not attack every ball. They ask a quick question: Is this a good moment to stay safe, or is this the moment to take a risk?&quot;],&quot;support&quot;:[1,[]],&quot;source&quot;:[0,&quot;NEWS STORY&quot;],&quot;answer&quot;:[0,&quot;&quot;],&quot;choices&quot;:[1,[]],&quot;roles&quot;:[1,[[0,&quot;Customer&quot;],[0,&quot;Staff&quot;],[0,&quot;Observer&quot;]]],&quot;roleCards&quot;:[1,[]],&quot;meta&quot;:[0,{&quot;blockType&quot;:[0,&quot;authored_context&quot;],&quot;audioStartSec&quot;:[0,61.7]}]}],[0,{&quot;id&quot;:[0,&quot;focus-authored-reading-section-3&quot;],&quot;type&quot;:[0,&quot;focus&quot;],&quot;title&quot;:[0,&quot;3. Surfaces Change the Match&quot;],&quot;prompt&quot;:[0,&quot;Tennis is played on different court surfaces. The main three are clay, grass, and hard court. The surface changes how the ball bounces and how fast a point can feel. Clay often makes the ball slower and higher after the bounce. This can make rallies longer, so patience matters. Grass often makes the ball stay lower and move faster, so quick reactions matter. Hard courts are often more balanced, so many styles can work. The same player may need a different plan on each surface. On clay, one more patient shot may be smart. On grass, a fast first move may be important. On a hard court, balance and timing can matter a lot.&quot;],&quot;support&quot;:[1,[]],&quot;source&quot;:[0,&quot;NEWS STORY&quot;],&quot;answer&quot;:[0,&quot;&quot;],&quot;choices&quot;:[1,[]],&quot;roles&quot;:[1,[[0,&quot;Customer&quot;],[0,&quot;Staff&quot;],[0,&quot;Observer&quot;]]],&quot;roleCards&quot;:[1,[]],&quot;meta&quot;:[0,{&quot;blockType&quot;:[0,&quot;authored_context&quot;],&quot;audioStartSec&quot;:[0,103.42]}]}],[0,{&quot;id&quot;:[0,&quot;focus-authored-reading-section-4&quot;],&quot;type&quot;:[0,&quot;focus&quot;],&quot;title&quot;:[0,&quot;4. Four Tournament Examples&quot;],&quot;prompt&quot;:[0,&quot;The four Grand Slam tournaments show different tennis tests. The Australian Open is on hard courts in Melbourne. Roland-Garros, also called the French Open, is on clay in Paris. Wimbledon is on grass in London. The US Open is on hard courts in New York. These names are not only sports trivia. They show why a player needs more than one plan. On clay, patience can help. On grass, quick reactions can help. On hard courts, timing and balance can help.&quot;],&quot;support&quot;:[1,[]],&quot;source&quot;:[0,&quot;NEWS STORY&quot;],&quot;answer&quot;:[0,&quot;&quot;],&quot;choices&quot;:[1,[]],&quot;roles&quot;:[1,[[0,&quot;Customer&quot;],[0,&quot;Staff&quot;],[0,&quot;Observer&quot;]]],&quot;roleCards&quot;:[1,[]],&quot;meta&quot;:[0,{&quot;blockType&quot;:[0,&quot;authored_context&quot;],&quot;audioStartSec&quot;:[0,146.48]}]}],[0,{&quot;id&quot;:[0,&quot;focus-authored-reading-final-reflection&quot;],&quot;type&quot;:[0,&quot;focus&quot;],&quot;title&quot;:[0,&quot;Final Reflection&quot;],&quot;prompt&quot;:[0,&quot;Tennis is simple to start: serve, return, and keep the ball in. But inside that simple rule, players solve many small problems. A rally needs patience. A safe shot can build pressure. A risky shot can finish the point. A court surface can change the whole plan. When you watch tennis, try not to watch only the ball. Watch the choice. Did the player stay safe, attack open space, or change the plan because of the court?&quot;],&quot;support&quot;:[1,[]],&quot;source&quot;:[0,&quot;CLOSING&quot;],&quot;answer&quot;:[0,&q trong cultural image. Kyoto tells a different story. It is known for temples, shrines, gardens, old streets, and traditional culture. A visitor can see wooden buildings, stone paths, tea shops, and seasonal views. Nearby Nara is also important for old history and famous temples. These examples show a useful idea: one country can have many kinds of meaning. A mountain, an old city, and a modern capital can all explain Japan in different ways.&quot;],&quot;support&quot;:[1,[]],&quot;source&quot;:[0,&quot;NEWS STORY&quot;],&quot;answer&quot;:[0,&quot;&quot;],&quot;choices&quot;:[1,[]],&quot;roles&quot;:[1,[[0,&quot;Customer&quot;],[0,&quot;Staff&quot;],[0,&quot;Observer&quot;]]],&quot;roleCards&quot;:[1,[]],&quot;meta&quot;:[0,{&quot;blockType&quot;:[0,&quot;authored_context&quot;],&quot;audioStartSec&quot;:[0,113.34]}]}],[0,{&quot;id&quot;:[0,&quot;focus-authored-reading-section-5&quot;],&quot;type&quot;:[0,&quot;focus&quot;],&quot;title&quot;:[0,&quot;4. Seasons&quot;],&quot;prompt&quot;:[0,&quot;Japan has strong seasonal images. In spring, many people think of cherry blossoms. In autumn, people enjoy red and yellow leaves. In winter, some northern areas have deep snow. In summer, many places are hot and humid, and local festivals can fill the streets. The timing is not the same everywhere. Cherry blossoms may open earlier in warmer areas and later in colder areas. Autumn leaves also move by region. This makes a simple fact more interesting: season and place work together. Seasons also shape food, clothes, travel plans, school life, and public events. The same place can feel different in spring, summer, autumn, and winter.&quot;],&quot;support&quot;:[1,[]],&quot;source&quot;:[0,&quot;NEWS STORY&quot;],&quot;answer&quot;:[0,&quot;&quot;],&quot;choices&quot;:[1,[]],&quot;roles&quot;:[1,[[0,&quot;Customer&quot;],[0,&quot;Staff&quot;],[0,&quot;Observer&quot;]]],&quot;roleCards&quot;:[1,[]],&quot;meta&quot;:[0,{&quot;blockType&quot;:[0,&quot;authored_context&quot;],&quot;
