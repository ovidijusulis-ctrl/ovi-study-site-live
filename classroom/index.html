      (() => {
        const STORAGE_KEY = "ovi-assist-language";
        const COOKIE_KEY = "ovi-assist-language";
        const ALLOWED = ["en", "ja", "es"];
        const normalizeLanguage = (value) => {
          const language = String(value || "").trim().toLowerCase();
          return ALLOWED.includes(language) ? language : "en";
        };
        const readCookieLanguage = () => {
          const match = document.cookie.match(new RegExp(`(?:^|; )${COOKIE_KEY}=([^;]+)`));
          if (!match) return "";
          try {
            return normalizeLanguage(decodeURIComponent(match[1]));
          } catch (_err) {
            return normalizeLanguage(match[1]);
          }
        };
        const detectAssistLanguage = () => {
          return "en";
        };

        let language = "en";
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          language = saved ? normalizeLanguage(saved) : (readCookieLanguage() || detectAssistLanguage());
        } catch (_err) {
          language = readCookieLanguage() || detectAssistLanguage();
        }

        document.documentElement.dataset.assistLanguage = language;
      })();

hey may want power, revenge, money, control, or respect.&quot;],[0,&quot;A villain is not just a bad person. A strong villain is a force that pressures the hero into hard choices. Without that pressure, many stories feel flat. The hero needs a real challenge, and the villain often gives it.&quot;],[0,&quot;Villains are interesting because they usually want something very strongly. They do not wait quietly. They act, plan, and take risks. Their desire can be frightening, but it can also be fascinating.&quot;],[0,&quot;A villain may want to rule a kingdom, become the strongest person, change society, punish someone, or prove they are right. Their desire gives them direction. This is one reason villains can feel powerful. They know what they want, even if what they want is wrong.&quot;],[0,&quot;Simple villains are evil for no clear reason. They only enjoy destruction or chaos. This can be fun in a light story, but it is not always deep.&quot;],[0,&quot;More interesting villains usually have a reason. Maybe they were hurt in the past. Maybe they lost someone. Maybe they were treated unfairly. Maybe they believe the world is broken and they are the only person who can fix it.&quot;],[0,&quot;The reason does not excuse their actions. But it helps us understand them. A good villain can make us think, I do not agree with them, but I understand how they became this way.&quot;]]],&quot;activities&quot;:[1,[[0,{&quot;id&quot;:[0,&quot;focus-authored-reading-goal&quot;],&quot;type&quot;:[0,&quot;focus&quot;],&quot;title&quot;:[0,&quot;Lesson Goal&quot;],&quot;prompt&quot;:[0,&quot;In this lesson, you will learn why villains are often some of the most interesting characters in stories.&quot;],&quot;support&quot;:[1,[[0,&quot;You will see how villains create conflict, show human darkness, and help heroes grow.&quot;],[0,&quot;You will also think about style, charisma, tragedy, and why people enjoy villains safely in stories.&quot;]]],&quot;source&quot;:[0,&quot;OPENING&quot;],&quot;answer&quot;:[0,&quot;&quot;],&quot;choices&quot;:[1,[]],&quot;roles&quot;:[1,[[0,&quot;Customer&quot;],[0,&quot;Staff&quot;],[0,&quot;Observer&quot;]]],&quot;roleCards&quot;:[1,[]],&quot;meta&quot;:[0,{&quot;blockType&quot;:[0,&quot;lesson_goal&quot;],&quot;audioStartSec&quot;:[0,0]}]}],[0,{&quot;id&quot;:[0,&quot;focus-authored-reading-introduction&quot;],&quot;type&quot;:[0,&quot;focus&quot;],&quot;title&quot;:[0,&quot;Introduction&quot;],&quot;prompt&quot;:[0,&quot;Villains are often more memorable than heroes. A hero may be kind and brave, but a villain can be mysterious, clever, dangerous, or emotionally complicated. This does not mean we agree with the villain. It means the villain gives the story energy. A strong villain creates conflict, asks difficult questions, and pushes the hero to change.&quot;],&quot;support&quot;:[1,[]],&quot;source&quot;:[0,&quot;OPENING&quot;],&quot;answer&quot;:[0,&quot;&quot;],&quot;choices&quot;:[1,[]],&quot;roles&quot;:[1,[[0,&quot;Customer&quot;],[0,&quot;Staff&quot;],[0,&quot;Observer&quot;]]],&quot;roleCards&quot;:[1,[]],&quot;meta&quot;:[0,{&quot;blockType&quot;:[0,&quot;authored_intro&quot;],&quot;audioStartSec&quot;:[0,20.491]}]}],[0,{&quot;id&quot;:[0,&quot;focus-authored-reading-warmup&quot;],&quot;type&quot;:[0,&quot;focus&quot;],&quot;title&quot;:[0,&quot;Warm-Up Questions&quot;],&quot;prompt&quot;:[0,&quot;What makes a character interesting to you? Do you usually remember the hero or the villain more clearly? Can a bad character still be fascinating?&quot;],&quot;support&quot;:[1,[[0,&quot;What makes a character interesting to you?&quot;],[0,&quot;Do you usually remember the hero or the villain more clearly?&quot;],[0,&quot;Can a bad character still be fascinating?&quot;]]],&quot;source&quot;:[0,&quot;OPENING&quot;],&quot;answer&quot;:[0,&quot;&quot;],&quot;choices&quot;:[1,[]],&quot;roles&quot;:[1,[[0,&quot;Customer&quot;],[0,&quot;Staff&quot;],[0,&quot;Observer&quot;]]],&quot;roleCards&quot;:[1,[]],&quot;meta&quot;:[0,{&quot;blockType&quot;:[0,&quot;authored_intro&quot;],&quot;audioStartSec&quot;:[0,44.397]}]}],[0,{&quot;id&quot;:[0,&quot;focus-authored-reading-section-1&quot;],&quot;type&quot;:[0,&quot;focus&quot;],&quot;title&quot;:[0,&quot;1. Villains Create Conflict&quot;],&quot;prompt&quot;:[0,&quot;Every good story needs conflict. Conflict is a problem, struggle, or fight between different goals. Villains create conflict because they want something that hurts other people or blocks the hero. They may want power, revenge, money, control, or respect. A villain is not just a bad person. A strong villain is a force that pressures the hero into hard choices. Without that pressure, many stories feel flat. The hero needs a real challenge, and the villain often gives it.&quot;],&quot;support&quot;:[1,[]],&quot;source&quot;:[0,&quot;NEWS STORY&quot;],&quot;answer&quot;:[0,&quot;&quot;],&quot;choices&quot;:[1,[]],&quot;roles&quot;:[1,[[0,&quot;Customer&quot;],[0,&quot;Staff&quot;],[0,&quot;Observer&quot;]]],&quot;roleCards&quot;:[1,[]],&quot;meta&quot;:[0,{&quot;blockType&quot;:[0,&quot;authored_context&quot;],&quot;audioStartSec&quot;:[0,55.07]}]}],[0,{&quot;id&quot;:[0,&quot;focus-authored-reading-section-2&quot;],&quot;type&quot;:[0,&quot;focus&quot;],&quot;title&quot;:[0,&quot;2. Villains Often Have Strong Desires&quot;],&quot;prompt&quot;:[0,&quot;Villains are interesting because they usually want something very strongly. They do not wait quietly. They act, plan, and take risks. Their desire can be frightening, but it can also be fascinating. A villain may want to rule a kingdom, become the strongest person, change society, punish someone, or prove they are right. Their desire gives them direction. This is one reason villains can feel powerful. They know what they want, even if what they want is wrong.&quot;],&quot;support&quot;:[1,[]],&quot;source&quot;:[0,&quot;NEWS STORY&quot;],&quot;answer&quot;:[0,&quot;&quot;],&quot;choices&quot;:[1,[]],&quot;roles&quot;:[1,[[0,&quot;Customer&quot;],[0,&quot;Staff&quot;],[0,&quot;Observer&quot;]]],&quot;roleCards&quot;:[1,[]],&quot;meta&quot;:[0,{&quot;blockType&quot;:[0,&quot;authored_context&quot;],&quot;audioStartSec&quot;:[0,88.795]}]}],[0,{&quot;id&quot;:[0,&quot;focus-authored-reading-section-3&quot;],&quot;type&quot;:[0,&quot;focus&quot;],&quot;title&quot;:[0,&quot;3. A Good Villain Has a Reason&quot;],&quot;prompt&quot;:[0,&quot;Simple villains are evil for no clear reason. They only enjoy destruction or chaos. This can be fun in a light story, but it is not always deep. More interesting villains usually have a reason. Maybe they were hurt in the past. Maybe they lost someone. Maybe they were treated unfairly. Maybe they believe the world is broken and they are the only person who can fix it. The reason does not excuse their actions. But it helps us understand them. A good villain can make us think, I do not agree with them, but I understand how they became this way.&quot;],&quot;support&quot;:[1,[]],&quot;source&quot;:[0,&quot;NEWS STORY&quot;],&quot;answer&quot;:[0,&quot;&quot;],&quot;choices&quot;:[1,[]],&quot;roles&quot;:[1,[[0,&quot;Customer&quot;],[0,&quot;Staff&quot;],[0,&quot;Observer&quot;]]],&quot;roleCards&quot;:[1,[]],&quot;meta&quot;:[0,{&quot;blockType&quot;:[0,&quot;authored_context&quot;],&quot;audioStartSec&quot;:[0,122.093]}]}],[0,{&quot;id&quot;:[0,&quot;focus-authored-reading-section-4&quot;],&quot;type&quot;:[0,&quot;focus&quot;],&quot;title&quot;:[0,&quot;4. Villains Show the Dark Side of Human Nature&quot;],&quot;prompt&quot;:[0,&quot;Villains are interesting because they show parts of human nature that people usually hide. They may show jealousy, anger, pride, fear, greed, revenge, or the desire for control. These feelings exist in normal people too, but usually in smaller and safer ways. A villain is like an extreme version of a human problem. They show what can happen when one dark feeling becomes too strong. Pride can become arrogance. Fear can become cruelty. Pain can become revenge. The villain shows the danger of losing balance.&quot;],&quot;support&quot;:[1,[]],&quot;source&quot;:[0,&quot;NEWS STORY&quot;],&quot;answer&quot;:[0,&quot;&quot;],&quot;choices&quot;:[1,[]],&quot;roles&quot;:[1,[[0,&quot;Customer&quot;],[0,&quot;Staff&quot;],[0,&quot;Observer&quot;]]],&quot;roleCards&quot;:[1,[]],&quot;meta&quot;:[0,{&quot;blockType&quot;:[0,&quot;authored_context&quot;],&quot;audioStartSec&quot;:[0,166.49]}]}],[0,{&quot;id&quot;:[0,&quot;focus-authored-reading-section-5&quot;],&quot;type&quot;:[0,&quot;focus&quot;],&quot;title&quot;:[0,&quot;5. Villains Can Be Mirrors of the Hero&quot;],&quot;prompt&quot;:[0,&quot;Many great villains are connected to the hero. They are not just random enemies. They are like a dark mirror. A hero and villain may have similar pain, similar talent, or similar dreams. But they choose different paths. The hero may choose responsibility, while the villain chooses revenge. The hero may protect others, while the villain controls others. This makes the story deeper. The villain shows what the hero could become if they made different choices.&quot;],&quot;support&quot;:[1,[]],&quot;source&quot;:[0,&quot;NEWS STORY&quot;],&quot;answer&quot;:[0,&quot;&quot;],&quot;choices&quot;:[1,[]],&quot;roles&quot;:[1,[[0,&quot;Customer&quot;],[0,&quot;Staff&quot;],[0,&quot;Observer&quot;]]],&quot;roleCards&quot;:[1,[]],&quot;meta&quot;:[0,{&quot;blockType&quot;:[0,&quot;authored_context&quot;],&quot;audioStartSec&quot;:[0,202.777]}]}],[0,{&quot;id&quot;:[0,&quot;focus-authored-reading-section-6&quot;],&quot;type&quot;:[0,&quot;focus&quot;],&quot;title&quot;:[0,&quot;6. Villains Often Have Style and Charisma&quot;],&quot;prompt&quot;:[0,&quot;Some villains are interesting because of their style. They may have a strong voice, unusual clothes, a scary smile, or a dramatic way of speaking. Style makes a villain memorable. People often recognize them quickly. Some villains are also charismatic. This means they are good at attracting attention and influencing other people. They may understand people’s fears and make bad ideas sound reasonable. They can make others feel special, angry, or powerful. This is dangerous because they do not only fight with weapons. They also fight with ideas.&quot;],&quot;support&quot;:[1,[]],&quot;source&quot;:[0,&quot;NEWS STORY&quot;],&quot;answer&quot;:[0,&quot;&quot;],&quot;choices&quot;:[1,[]],&quot;roles&quot;:[1,[[0,&quot;Customer&quot;],[0,&quot;Staff&quot;],[0,&quot;Observer&quot;]]],&quot;roleCards&quot;:[1,[]],&quot;meta&quot;:[0,{&quot;blockType&quot;:[0,&quot;authored_context&quot;],&quot;audioStartSec&quot;:[0,235.221]}]}],[0,{&quot;id&quot;:[0,&quot;focus-authored-reading-section-7&quot;],&quot;type&quot;:[0,&quot;focus&quot;],&quot;title&quot;:[0,&quot;7. Tragic Villains and Funny Villains&quot;],&quot;prompt&quot;:[0,&quot;A tragic villain is a villain who makes us feel sadness. They may have started as a good person, but pain, fear, loss, or bad choices changed them. This type of villain is interesting because we can imagine another future for them. Maybe one different choice could have saved them. Not all villains are serious. Some are funny, dramatic, or strange. They may have silly plans or over-the-top reactions. Funny villains can give the audience a break from heavy conflict. They may still be selfish or proud, but they show these traits in a lighter way.&quot;],&quot;support&quot;:[1,[]],&quot;source&quot;:[0,&quot;NEWS STORY&quot;],&quot;answer&quot;:[0,&quot;&quot;],&quot;choices&quot;:[1,[]],&quot;roles&quot;:[1,[[0,&quot;Customer&quot;],[0,&quot;Staff&quot;],[0,&quot;Observer&quot;]]],&quot;roleCards&quot;:[1,[]],&quot;meta&quot;:[0,{&quot;blockType&quot;:[0,&quot;authored_context&quot;],&quot;audioStartSec&quot;:[0,272.788]}]}],[0,{&quot;id&quot;:[0,&quot;roleplay-why-villains-are-interesting&quot;],&quot;type&quot;:[0,&quot;roleplay&quot;],&quot;title&quot;:[0,&quot;Roleplay: Why Villains Are Interesting&quot;],&quot; uot;],&quot;support&quot;:[1,[]],&quot;source&quot;:[0,&quot;authored_reading_material&quot;],&quot;answer&quot;:[0,&quot;A tragic villain is a villain who makes us feel sadness.&quot;],&quot;choices&quot;:[1,[]],&quot;roles&quot;:[1,[[0,&quot;Customer&quot;],[0,&quot;Staff&quot;],[0,&quot;Observer&quot;]]],&quot;roleCards&quot;:[1,[]],&quot;meta&quot;:[0,{}]}],[0,{&quot;id&quot;:[0,&quot;quiz-how-can-a-villain-help-the-hero-gro&quot;],&quot;type&quot;:[0,&quot;quiz&quot;],&quot;title&quot;:[0,&quot;Quiz 8&quot;],&quot;prompt&quot;:[0,&quot;How can a villain help the hero grow?&quot;],&quot;support&quot;:[1,[]],&quot;source&quot;:[0,&quot;authored_reading_material&quot;],&quot;answer&quot;:[0,&quot;A strong villain makes the hero stronger.&quot;],&quot;choices&quot;:[1,[]],&quot;roles&quot;:[1,[[0,&quot;Customer&quot;],[0,&quot;Staff&quot;],[0,&quot;Observer&quot;]]],&quot;roleCards&quot;:[1,[]],&quot;meta&quot;:[0,{}]}]]]}],[0,{&quot;id&quot;:[0,&quot;episode-2026-07-08-heroes-in-comics-history-famous-heroes-and-why-they-last&quot;],&quot;slug&quot;:[0,&quot;2026-07-08-heroes-in-comics-history-famous-heroes-and-why-they-last&quot;],&quot;title&quot;:[0,&quot;Heroes in Comics&quot;],&quot;level&quot;:[0,&quot;B1&quot;],&quot;topic&quot;:[0,&quot;Heroes in Comics&quot;],&quot;summary&quot;:[0,&quot;Comic heroes last when they are simple enough to recognize and deep enough to reuse. A strong hero usually has a clear symbol, a strong problem to solve, and a world that can hold many stories.&quot;],&quot;lessonFormat&quot;:[0,&quot;reading_discussion&quot;],&quot;materialSections&quot;:[1,[[0,&quot;Comic heroes last when they are simple enough to recognize and deep enough to reuse. A strong hero usually has a clear symbol, a strong problem to solve, and a world that can hold many stories. Some heroes became famous because they matched the hopes and fears of their time. Others stayed popular because they feel human, even when they have extraordinary powers.&quot;],[0,&quot;Warm-up: Which comic heroes do you know? What makes a hero easy to remember: the costume, the powers, the story, or the values? Can a hero be famous even if the character is simple at first?&quot;],[0,&quot;One important turning point in comic history came in 1938 with Action Comics no. 1, which introduced Superman. The Library of Congress describes this issue as the birth of the Golden Age of Comics and the comic-book superhero. Superman worked because readers could understand him quickly: a clear costume, a public rescue image, a secret identity, and a direct promise of protection. Batman appeared in Detective Comics no. 27 in 1939, and Wonder Woman first appeared in All Star Comics no. 8 in 1941. These heroes showed that comics could mix action, mystery, myth, and moral purpose.&quot;],[0,&quot;Some heroes become famous because they match the moment when they appear. Captain America Comics no. 1 was published in 1941, and Marvel’s page highlights the wartime image on the cover. That matters because heroes are not only fantasy figures; they can also express a society’s fears and hopes. In a time of conflict, a patriotic hero can feel direct and urgent. This does not mean the hero is only about one period. It means the first success often comes from a strong connection between story and world.&quot;],[0,&quot;Spider-Man became famous for a different reason. Amazing Fantasy no. 15 was published in 1962, and Marvel presents Peter Parker as an everyday teenager under pressure. This is important because many readers relate more easily to a hero who has homework, money problems, family stress, or social worries. A hero does not need to be perfect to be powerful. In fact, weakness can make the story stronger. When a hero has to balance ordinary life and great responsibility, the character feels closer to real life.&quot;],[0,&quot;Black Panther first appeared in Fantastic Four no. 52 in 1966. Marvel’s page links the hero with T’Challa and Wakanda. This example shows another reason heroes last: they can carry a whole world, not only a single character. A hero can represent a place, a political idea, a style of technology, and a cultural imagination. For many readers, representation matters because it widens the kind of people and worlds they can see in popular stories. A strong hero can open a new space in the imagination, not just a new fight.&quot;],[0,&quot;Famous comic heroes usually survive for several connected reasons. First, they have a strong visual symbol that readers recognize quickly. Second, they begin with a simple origin story that explains why they act. Third, they have a human weakness or ordinary life problem. Fourth, they face villains, side characters, and moral choices that keep the story active. Fifth, their world is flexible enough for new stories. Finally, adaptation helps: comics can continue in radio, TV, film, games, and toys. A hero lasts when the character is easy to know but not easy to finish.&quot;],[0,&quot;Action Comics no. 1 is a useful anchor because it shows the beginning of modern superhero comics in a very clear form. Detective Comics no. 27 shows a different path: mystery, crime, and a secret identity can be just as important as powers. Amazing Fantasy no. 15 shows that a hero can become famous by feeling ordinary in some ways, not only by being impressive. These examples show that comic heroes are built from different strengths, but all of them need a strong idea that readers can remember and reuse.&quot;],[0,&quot;QUESTION: Which early heroes are named in this section, and what years did they first appear? ANSWER: The section names Superman in 1938, Batman in 1939, and Wonder Woman in 1941.&quot;],[0,&quot;QUESTION: What does Captain America show about the link between heroes and history? ANSWER: Captain America shows that a hero can become famous when the story connects with the fears and hopes of its time.&quot;]]],&quot;activities&quot;:[1,[[0,{&quot;id&quot;:[0,&quot;focus-authored-re ;&quot;],&quot;choices&quot;:[1,[]],&quot;roles&quot;:[1,[[0,&quot;Customer&quot;],[0,&quot;Staff&quot;],[0,&quot;Observer&quot;]]],&quot;roleCards&quot;:[1,[]],&quot;meta&quot;:[0,{}]}],[0,{&quot;id&quot;:[0,&quot;open-authored-reading-discussion-4&quot;],&quot;type&quot;:[0,&quot;open&quot;],&quot;title&quot;:[0,&quot;Open question 10&quot;],&quot;prompt&quot;:[0,&quot;Why is representation important in popular stories?&quot;],&quot;support&quot;:[1,[[0,&quot;Think about seeing different identities, places, and possibilities in fiction.&quot;]]],&quot;source&quot;:[0,&quot;Black Panther first appeared in Fantastic Four no. 52 in 1966. Marvel’s page links the hero with T’Challa and Wakanda. This example shows another reason heroes last: they can carry a whole world, not only a single character. A hero can represent a place, a political idea, a style of technology, and a cultural imagination. For many readers, representation matters because it widens the kind of people and worlds they can see in popular stories. A strong hero can open a new space in the imagination, not just a new fight.&quot;],&quot;answer&quot;:[0,&quot;&quot;],&quot;choices&quot;:[1,[]],&quot;roles&quot;:[1,[[0,&quot;Customer&quot;],[0,&quot;Staff&quot;],[0,&quot;Observer&quot;]]],&quot;roleCards&quot;:[1,[]],&quot;meta&quot;:[0,{}]}],[0,{&quot;id&quot;:[0,&quot;open-authored-reading-discussion-5&quot;],&quot;type&quot;:[0,&quot;open&quot;],&quot;title&quot;:[0,&quot;Open question 11&quot;],&quot;prompt&quot;:[0,&quot;Which factor do you think is most important for a hero’s long life: symbol, origin, weakness, or adaptation?&quot;],&quot;support&quot;:[1,[[0,&quot;There is no single correct answer. Choose one factor and explain why it matters most.&quot;]]],&quot;source&quot;:[0,&quot;Famous comic heroes usually survive for several connected reasons. First, they have a strong visual symbol that readers recognize quickly. Second, they begin with a simple origin story that explains why they act. Third, they have a human weakness or ordinary life problem. Fourth, they face villains, side characters, and moral choices that keep the story active. Fifth, their world is flexible enough for new stories. Finally, adaptation helps: comics can continue in radio, TV, film, games, and toys. A hero lasts when the character is easy to know but not easy to finish.&quot;],&quot;answer&quot;:[0,&quot;&quot;],&quot;choices&quot;:[1,[]],&quot;roles&quot;:[1,[[0,&quot;Customer&quot;],[0,&quot;Staff&quot;],[0,&quot;Observer&quot;]]],&quot;roleCards&quot;:[1,[]],&quot;meta&quot;:[0,{}]}],[0,{&quot;id&quot;:[0,&quot;open-authored-reading-discussion-6&quot;],&quot;type&quot;:[0,&quot;open&quot;],&quot;title&quot;:[0,&quot;Open question 12&quot;],&quot;prompt&quot;:[0,&quot;Which of these examples seems most memorable to you, and why?&quot;],&quot;support&quot;:[1,[[0,&quot;Think about symbol, style, and the kind of problem the hero faces.&quot;]]],&quot;source&quot;:[0,&quot;Action Comics no. 1 is a useful anchor because it shows the beginning of modern superhero comics in a very clear form. Detective Comics no. 27 shows a different path: mystery, crime, and a secret identity can be just as important as powers. Amazing Fantasy no. 15 shows that a hero can become famous by feeling ordinary in some ways, not only by being impressive. These examples show that comic heroes are built from different strengths, but all of them need a strong idea that readers can remember and reuse.&quot;],&quot;answer&quot;:[0,&quot;&quot;],&quot;choices&quot;:[1,[]],&quot;roles&quot;:[1,[[0,&quot;Customer&quot;],[0,&quot;Staff&quot;],[0,&quot;Observer&quot;]]],&quot;roleCards&quot;:[1,[]],&quot;meta&quot;:[0,{}]}],[0,{&quot;id&quot;:[0,&quot;quiz-which-early-heroes-are-named-in-thi&quot;],&quot;type&quot;:[0,&quot;quiz&quot;],&quot;title&quot;:[0,&quot;Quiz 1&quot;],&quot;prompt&quot;:[0,&quot;Which early heroes are named in this section, and what years did they first appear?&quot;],&quot;support&quot;:[1,[]],&quot;source&quot;:[0,&quot;authored_reading_material&quot;],&quot;answer&quot;:[0,&quot;The section names Superman in 1938, Batman in 1939, and Wonder Woman in 1941.&quot;],&quot;choices&quot;:[1,[]],&quot;roles&quot;:[1,[[0,&quot;Customer&quot;],[0,&quot;Staff&quot;],[0,&quot;Observer&quot;]]],&quot;roleCards&quot;:[1,[]],&quot;meta&quot;:[0,{}]}],[0,{&quot;id&quot;:[0,&quot;quiz-what-does-captain-america-show-abou&quot;],&quot;type&quot;:[0,&quot;quiz&quot;],&quot;title&quot;:[0,&quot;Quiz 2&quot;],&quot;prompt&quot;:[0,&quot;What does Captain America show about the link between heroes and history?&quot;],&quot;support&quot;:[1,[]],&quot;source&quot;:[0,&quot;authored_reading_material&quot;],&quot;answer&quot;:[0,&quot;Captain America shows that a hero can become famous when the story connects with the fears and hopes of its time.&quot;],&quot;choices&quot;:[1,[]],&quot;roles&quot;:[1,[[0,&quot;Customer&quot;],[0,&quot;Staff&quot;],[0,&quot;Observer&quot;]]],&quot;roleCards&quot;:[1,[]],&quot;meta&quot;:[0,{}]}],[0,{&quot;id&quot;:[0,&quot;quiz-what-kind-of-hero-is-spider-man-and&quot;],&quot;type&quot;:[0,&quot;quiz&quot;],&quot;title&quot;:[0,&quot;Quiz 3&quot;],&quot;prompt&quot;:[0,&quot;What kind of hero is Spider-Man, and why do many readers relate to him?&quot;],&quot;support&quot;:[1,[]],&quot;source&quot;:[0,&quot;authored_reading_material&quot;],&quot;answer&quot;:[0,&quot;Spider-Man is an everyday teenager under pressure, so many readers relate to his ordinary problems and responsibility.&quot;],&quot;choices&quot;:[1,[]],&quot;roles&quot;:[1,[[0,&quot;Customer&quot;],[0,&quot;Staff&quot;],[0,&quot;Observer&quot;]]],&quot;roleCards&quot;:[1,[]],&quot;meta&quot;:[0,{}]}],[0,{&quot;id&quot;:[0,&quot;quiz-what-does-black-panther-show-about-&quot;],&quot;type&quot;:[0,&quot;quiz&quot;],&quot;title&quot;:[0,&quot;Quiz 4&quot;],&quot;prompt&quot;:[0,&quot;What does Black Panther show about a hero and a story world?&quot;],&quot;support&quot;:[1,[]],&quot;source&quot;:[0,&quot;authored_reading_material&quot;],&quot;answer&quot;:[0,&quot;Black Panther shows that a hero can carry a whole story world, including a place, culture, technology, and imagination.&quot;],&quot;choices&quot;:[1,[]],&quot;roles&quot;:[1,[[0,&quot;Customer&quot;],[0,&quot;Staff&quot;],[0,&quot;Observer&quot;]]],&quot;roleCards&quot;:[1,[]],&quot;meta&quot;:[0,{}]}],[0,{&quot;id&quot;:[0,&quot;quiz-name-two-reasons-why-some-comic-her&quot;],&quot;type&quot;:[0,&quot;quiz&quot;],&quot;title&quot;:[0,&quot;Quiz 5&quot;],&quot;prompt&quot;:[0,&quot;Name two reasons why some comic heroes last over time.&quot;],&quot;support&quot;:[1,[]],&quot;source&quot;:[0,&quot;authored_reading_material&quot;],&quot;answer&quot;:[0,&quot;Two reasons are a clear symbol and a simple origin story. Other reasons include human weakness, active moral choices, a flexible world, and adaptation into new media.&quot;],&quot;choices&quot;:[1,[]],&quot;roles&quot;:[1,[[0,&quot;Customer&quot;],[0,&quot;Staff&quot;],[0,&quot;Observer&quot;]]],&quot;roleCards&quot;:[1,[]],&quot;meta&quot;:[0,{}]}],[0,{&quot;id&quot;:[0,&quot;quiz-what-do-action-comics-no-1-detectiv&quot;],&quot;type&quot;:[0,&quot;quiz&quot;],&quot;title&quot;:[0,&quot;Quiz 6&quot;],&quot;prompt&quot;:[0,&quot;What do Action Comics no. 1, Detective Comics no. 27, and Amazing Fantasy no. 15 each help explain?&quot;],&quot;support&quot;:[1,[]],&quot;source&quot;:[0,&quot;authored_reading_material&quot;],&quot;answer&quot;:[0,&quot;Action Comics no. 1 helps explain the start of modern superhero comics, Detective Comics no. 27 helps explain mystery and secret identity, and Amazing Fantasy no. 15 helps explain the power of an ordinary-feeling hero.&quot;],&quot;choices&quot;:[1,[]],&quot;roles&quot;:[1,[[0,&quot;Customer&quot;],[0,&quot;Staff&quot;],[0,&quot;Observer&quot;]]],&quot;roleCards&quot;:[1,[]],&quot;meta&quot;:[0,{}]}],[0,{&quot;id&quot;:[0,&quot;quiz-in-this-lesson-what-does-superhero-&quot;],&quot;type&quot;:[0,&quot;quiz&quot;],&quot;title&quot;:[0,&quot;Quiz 9&quot;],&quot;prompt&quot;:[0,&quot;In this lesson, what does \&quot;superhero\&quot; mean?&quot;],&quot;support&quot;:[1,[]],&quot;source&quot;:[0,&quot;learningChecks&quot;],&quot;answer&quot;:[0,&quot;a character built to protect people and carry a clear symbol&quot;],&quot;choices&quot;:[1,[[0,&quot;a character built to protect people and carry a clear symbol&quot;],[0,&quot;the event that explains why a hero becomes a hero&quot;],[0,&quot;the visual idea readers remember quickly&quot;],[0,&quot;the public and private sides of a hero&quot;]]],&quot;roles&quot;:[1,[[0,&quot;Customer&quot;],[0,&quot;Staff&quot;],[0,&quot;Observer&quot;]]],&quot;roleCards&quot;:[1,[]],&quot;meta&quot;:[0,{}]}],[0,{&quot;id&quot;:[0,&quot;quiz-in-this-lesson-what-does-origin-sto&quot;],&quot;type&quot;:[0,&quot;quiz&quot;],&quot;title&quot;:[0,&quot;Quiz 10&quot;],&quot;prompt&quot;:[0,&quot;In this lesson, what does \&quot;origin story\&quot; mean?&quot;],&quot;support&quot;:[1,[]],&quot;source&quot;:[0,&quot;learningChecks&quot;],&quot;answer&quot;:[0,&quot;the event that explains why a hero becomes a hero&quot;],&quot;choices&quot;:[1,[[0,&quot;the event that explains why a hero becomes a hero&quot;],[0,&quot;a character built to protect people and carry a clear symbol&quot;],[0,&quot;the visual idea readers remember quickly&quot;],[0,&quot;the public and private sides of a hero&quot;]]],&quot;roles&quot;:[1,[[0,&quot;Customer&quot;],[0,&quot;Staff&quot;],[0,&quot;Observer&quot;]]],&quot;roleCards&quot;:[1,[]],&quot;meta&quot;:[0,{}]}]]]}],[0,{&quot;id&quot;:[0,&quot;episode-2026-07-08-giving-clear-feedback-at-work&quot;],&quot;slug&quot;:[0,&quot;2026-07-08-giving-clear-feedback-at-work&quot;],&quot;title&quot;:[0,&quot;Giving Clear Feedback at Work&quot;],&quot;level&quot;:[0,&quot;B1&quot;],&quot;topic&quot;:[0,&quot;Giving Clear Feedback at Work&quot;],&quot;summary&quot;:[0,&quot;Feedback is part of normal workplace communication. It helps people improve, solve problems, and keep doing what works well. Clear feedback is not just honest. It is also specific, respectful, and useful.&quot;],&quot;lessonFormat&quot;:[0,&quot;reading_discussion&quot;],&quot;materialSections&quot;:[1,[[0,&quot;Feedback is part of normal workplace communication. It helps people improve, solve problems, and keep doing what works well. Clear feedback is not just honest. It is also specific, respectful, and useful. When feedback is unclear, the other person may feel confused or criticized without knowing what to change.&quot;],[0,&quot;Warm-up: When someone gives you feedback at work, what makes it easy to understand? Have you ever received feedback that was too general, too harsh, or not useful? Why can timing matter when giving feedback? What is the difference between talking about a person and talking about a specific action?&quot;],[0,&quot;Clear feedback explains a real behavior, result, or next step. It does not stay at the level of general praise or general criticism. For example, “Good job” may sound kind, but it does not tell the person what was good. “You are careless” may sound strong, but it attacks the person instead of helping them improve.&quot;],[0,&quot;A clearer comment focuses on what happened. For example, “The report was easy to follow because the main points were in order” tells the person what worked. Or, “The customer email needs a shorter introduction so the main request is easier to see” gives a specific improvement request. This kind of feedback is easier to use because the listener can act on it.&quot;],[0,&quot;Clear feedback often has three parts:&quot;],[0,&quot;The observation: what you saw or heard&quot;],[0,&quot;The effect: why it matters&quot;],[0,&quot;The next step: what should change or continue&quot;],[0,&quot;Real-world anchors show this idea well. In team meetings, a manager may say that one person’s update was helpful because it gave the deadline and the next action. In customer service, a supervisor may point out that a reply was polite but too long for a busy customer. In school or training, a teacher may explain that a presentation was strong because the examples matched the topic. In each case, the feedback is about a behavior and its effect, not a personal label.&quot;],[0,&quot;Vague feedback sounds simple, but it often creates more work later. A comment like “Be more professional” may feel important, but it is not easy to understand. What does “professional” mean in this case? Is the problem the tone, the speed, the wording, or the appearance of the document? Without a clear example, the listener has to guess.&quot;]]],&quot;activities&quot;:[1,[[0,{&quot;id&quot;:[0,&quot;focus-authored-reading-introduction&quot;],&quot;type&quot;:[0,&quot;focus&quot;],&quot;title&quot;:[0,&quot;Introduction&quot;],&quot;prompt&quot;:[0,&quot;Feedback is part of normal workplace communication. It helps people improve, solve problems, and keep doing what works well. Clear feedback is not just honest. It is also specific, respectful, and useful. When feedback is unclear, the other person may feel confused or criticized without knowing what to change.&quot;],&quot;support&quot;:[1,[]],&quot;source&quot;:[0,&quot;OPENING&quot;],&quot;answer&quot;:[0,&quot;&quot;],&quot;choices&quot;:[1,[]],&quot;roles&quot;:[1,[[0,&quot;Customer&quot;],[0,&quot;Staff&quot;],[0,&quot;Observer&quot;]]],&quot;roleCards&quot;:[1,[]],&quot;meta&quot;:[0,{&quot;blockType&quot;:[0,&quot;authored_intro&quot;],&quot;audioStartSec&quot;:[0,0]}]}],[0,{&quot;id&quot;:[0,&quot;focus-authored-reading-warmup&quot;],&quot;type&quot;:[0,&quot;focus&quot;],&quot;title&quot;:[0,&quot;Warm-Up Questions&quot;],&quot;prompt&quot;:[0,&quot;When someone gives you feedback at work, what makes it easy to understand? Have you ever received feedback that was too general, too harsh, or not useful? Why can timing matter when giving feedback?&quot;],&quot;support&quot;:[1,[[0,&quot;When someone gives you feedback at work, what makes it easy to understand?&quot;],[0,&quot;Have you ever received feedback that was too general, too harsh, or not useful?&quot;],[0,&quot;Why can timing matter when giving feedback?&quot;],[0,&quot;What is the difference between talking about a person and talking about a specific action?&quot;]]],&quot;source&quot;:[0,&quot;OPENING&quot;],&quot;answer&quot;:[0,&quot;&quot;],&quot;choices&quot;:[1,[]],&quot;roles&quot;:[1,[[0,&quot;Customer&quot;],[0,&quot;Staff&quot;],[0,&quot;Observer&quot;]]],&quot;roleCards&quot;:[1,[]],&quot;meta&quot;:[0,{&quot;blockType&quot;:[0,&quot;authored_intro&quot;],&quot;audioStartSec&quot;:[0,22.6]}]}],[0,{&quot;id&quot;:[0,&quot;focus-authored-reading-section-1&quot;],&quot;type&quot;:[0,&quot;focus&quot;],&quot;title&quot;:[0,&quot;1. What clear feedback really means&quot;],&quot;prompt&quot;:[0,&quot;Clear feedback explains a real behavior, result, or next step. It does not stay at the level of general praise or general criticism. For example, “Good job” may sound kind, but it does not tell the person what was good. “You are careless” may sound strong, but it attacks the person instead of helping them improve. A clearer comment focuses on what happened. For example, “The report was easy to follow because the main points were in order” tells the person what worked. Or, “The customer email needs a shorter introduction so the main request is easier to see” gives a specific improvement request. This kind of feedback is easier to use because the listener can act on it. Clear feedback often has three parts: The observation: what you saw or heard The effect: why it matters The next step: what should change or continue Real-world anchors show this idea well. In team meetings, a manager may say that one person’s update was helpful because it gave the deadline and the next action. In customer service, a supervisor may point out that a reply was polite but too long for a busy customer. In school or training, a teacher may explain that a presentation was strong because the examples matched the topic. In each case, the feedback is about a behavior and its effect, not a personal label.&quot;],&quot;support&quot;:[1,[]],&quot;source&quot;:[0,&quot;NEWS STORY&quot;],&quot;answer&quot;:[0,&quot;&quot;],&quot;choices&quot;:[1,[]],&quot;roles&quot;:[1,[[0,&quot;Customer&quot;],[0,&quot;Staff&quot;],[0,&quot;Observer&quot;]]],&quot;roleCards&quot;:[1,[]],&quot;meta&quot;:[0,{&quot;blockType&quot;:[0,&quot;authored_context&quot;],&quot;audioStartSec&quot;:[0,42.78]}]}],[0,{&quot;id&quot;:[0,&quot;focus-authored-reading-section-2&quot;],&quot;type&quot;:[0,&quot;focus&quot;],&quot;title&quot;:[0,&quot;2. Vague feedback and why it causes problems&quot;],&quot;prompt&quot;:[0,&quot;Vague feedback sounds simple, but it often creates more work later. A comment like “Be more professional” may feel important, but it is not easy to understand. What does “professional” mean in this case? Is the problem the tone, the speed, the wording, or the appearance of the document? Without a clear example, the listener has to guess. Vague praise can also be weak. Saying “Nice work” is pleasant, but it does not show what should be repeated. If a worker does not know what was effective, the good habit may disappear. Vague criticism can be even harder, because it may sound like a judgment rather than help. A person may leave the conversation feeling frustrated or defensive. Clear feedback reduces confusion. It also saves time. Instead of talking again and again about the same issue, people can move toward a solution. This is especially important when a team is busy or when the result affects a customer, a deadline, or another department. A useful test is simple: after hearing the feedback, can the person explain what to keep, what to change, or what to check next? If the answer is no, the feedback may still be too general.&quot;],&quot;support&quot;:[1,[]],&quot;source&quot;:[0,&quot;NEWS STORY&quot;],&quot;answer&quot;:[0,&quot;&quot;],&quot;choices&quot;:[1,[]],&quot;roles&quot;:[1,[[0,&quot;Customer&quot;],[0,&quot;Staff&quot;],[0,&quot;Observer&quot;]]],&quot;roleCards&quot;:[1,[]],&quot;meta&quot;:[0,{&quot;blockType&quot;:[0,&quot;authored_context&quot;],&quot;audioStartSec&quot;:[0,138.92]}]}],[0,{&quot;id&quot;:[0,&quot;focus-authored-reading-section-3&quot;],&quot;type&quot;:[0,&quot;focus&quot;],&quot;title&quot;:[0,&quot;3. Tone and respect: how feedback is heard&quot;],&quot;prompt&quot;:[0,&quot;The same message can feel very different depending on tone. Tone includes the words we choose, the timing, and the way we speak. A respectful tone does not mean avoiding problems. It means showing that the other person is still being treated fairly and professionally. This matters because people listen with emotions as well as logic. If feedback feels like an attack, they may stop listening to the useful part. If it feels calm and balanced, they are more likely to hear the message and respond well. Respectful feedback often separates the person from the problem. It says, in effect, “This action needs attention,” not “You are the problem.” Timing also matters. Some feedback is best given soon after the event, while the details are still fresh. Other feedback is better saved for a private moment, especially if it is sensitive. Public correction can embarrass someone and make them less open. Private feedback can feel safer and more constructive.&quot;],&quot;support&quot;:[1,[]],&quot;source&quot;:[0,&quot;NEWS STORY&quot;],&quot;answer&quot;:[0,&quot;&quot;],&quot;choices&quot;:[1,[]],&quot;roles&quot;:[1,[[0,&quot;Customer&quot;],[0,&quot;Staff&quot;],[0,&quot;Observer&quot;]]],&quot;roleCards&quot;:[1,[]],&quot;meta&quot;:[0,{&quot;blockType&quot;:[0,&quot;authored_context&quot;],&quot;audioStartSec&quot;:[0,220.04]}]}],[0,{&quot;id&quot;:[0,&quot;focus-authored-reading-section-4&quot;],&quot;type&quot;:[0,&quot;focus&quot;],&quot;title&quot;:[0,&quot;4. Making feedback specific and useful&quot;],&quot;prompt&quot;:[0,&quot;Specific feedback gives the listener a clear picture of what happened and what to do next. It often refers to a document, a meeting, an email, a call, or a task result. Instead of saying “This isn’t good,” a clearer comment might focus on one part: the opening, the structure, the deadline, or the amount of detail. Useful feedback often includes a next step. A next step turns criticism into action. For example: The email is clear, but the main request should come earlier. The meeting notes are detailed, but the action items need to be easier to find. The presentation has strong content, but the examples should be shorter. The customer reply is polite, but it needs a warmer closing line. Notice that these comments do not attack the person. They describe a change in the work. This makes the feedback more practical and less personal. It also gives the listener a chance to improve without guessing what was wrong. A follow-up question can make feedback even more useful. For example, “Do you want me to show one example?” or “What made this part difficult?” These questions can open a real conversation and help both sides understand the issue better. In many workplaces, that conversation is where improvement actually begins.&quot;],&quot;support&quot;:[1,[]],&quot;source&quot;:[0,&quot;NEWS STORY&quot;],&quot;answer&quot;:[0,&quot;&quot;],&quot;choices&quot;:[1,[]],&quot;roles&quot;:[1,[[0,&quot;Customer&quot;],[0,&quot;Staff&quot;],[0,&quot;Observer&quot;]]],&quot;roleCards&quot;:[1,[]],&quot;meta&quot;:[0,{&quot;blockType&quot;:[0,&quot;authored_context&quot;],&quot;audioStartSec&quot;:[0,287.32]}]}],[0,{&quot;id&quot;:[0,&quot;focus-authored-reading-section-5&quot;],&quot;type&quot;:[0,&quot;focus&quot;],&quot;title&quot;:[0,&quot;5. Feedback should fit the situation&quot;],&quot;prompt&quot;:[0,&quot;Good feedback is not only about words. It should also fit the situation. A small issue may need a short, direct comment. A bigger or repeated issue may need a longer conversation. A team may also need different feedback from different people, depending on their role and level of experience. For example, a new worker may need more explanation and examples. An experienced worker may prefer a shorter comment with less background. A customer-facing employee may need feedback focused on tone and speed. A project team may need feedback about deadlines, handovers, and communication between departments. The same “advice style” does not work in every situation. It is also important not to overload the listener with too much at once. If there are many problems, it is often better to focus on the most important one first. Otherwise, the person may not know where to start. Clear feedback does not mean “say everything.” It means choose the most useful point and make it easy to act on. This is one reason why workplaces value regular check-ins. Small, timely feedback is often easier to hear than a long list of complaints at the end of a project.&quot;],&quot;support&quot;:[1,[]],&quot;source&quot;:[0,&quot;NEWS STORY&quot;],&quot;answer&quot;:[0,&quot;&quot;],&quot;choices&quot;:[1,[]],&quot;roles&quot;:[1,[[0,&quot;Customer&quot;],[0,&quot;Staff&quot;],[0,&quot;Observer&quot;]]],&quot;roleCards&quot;:[1,[]],&quot;meta&quot;:[0,{&quot;blockType&quot;:[0,&quot;authored_context&quot;],&quot;audioStartSec&quot;:[0,376.02]}]}],[0,{&quot;id&quot;:[0,&quot;focus-authored-reading-section-6&quot;],&quot;type&quot;:[0,&quot;focus&quot;],&quot;title&quot;:[0,&quot;6. How feedback supports better work, not just correction&quot;],&quot;prompt&quot;:[0,&quot;At its best, feedback is not only about fixing mistakes. It also helps people understand what success looks like. Good feedback shows a pattern: what works, why it works, and how to repeat it. This is useful for both individuals and teams. When feedback is clear, people can improve faster. They can also feel more confident, because they know what to continue and what to adjust. Over time, this can improve trust in the team. People are less afraid of feedback when they know it will be specific and fair. In real life, we can see this idea in many work settings. In a restaurant, a supervisor may notice that a server explains the menu in a simple way, which helps customers choose faster. In an office, a team leader may point out that a shared document works well because the headings make the information easy to scan. In a call center, a coach may say that a worker’s calm voice helps handle difficult callers. These examples show that feedback is not only correction. It is also a way to build strong habits. Clear feedback is useful because it supports future work. It turns one moment into learning.&quot;],&quot;support&quot;:[1,[]],&quot;source&quot;:[0,&quot;NEWS STORY&quot;],&quot;answer&quot;:[0,&quot;&quot;],&quot;choices&quot;:[1,[]],&quot;roles&quot;:[1,[[0,&quot;Customer&quot;],[0,&quot;Staff&quot;],[0,&quot;Observer&quot;]]],&quot;roleCards&quot;:[1,[]],&quot;meta&quot;:[0,{&quot;blockType&quot;:[0,&quot;authored_context&quot;],&quot;audioStartSec&quot;:[0,457.48]}]}],[0,{&quot;id&quot;:[0,&quot;focus-authored-reading-final-reflection&quot;],&quot;type&quot;:[0,&quot;focus&quot;],&quot;title&quot;:[0,&quot;Final Reflection&quot;],&quot;prompt&quot;:[0,&quot;Think about a real work situation: a message, a meeting update, a report, or a task that needed improvement. Write a short judgment or recommendation with clear feedback. Include: what happened, why it was unclear or effective, and one specific next step. A strong learner output might look like this: The report was useful, but the main point was hidden in the middle. I would recommend putting the summary at the top so the reader can understand the result faster.&quot;],&quot;support&quot;:[1,[]],&quot;source&quot;:[0,&quot;CLOSING&quot;],&quot;answer&quot;:[0,&quot;&quot;],&quot;choices&quot;:[1,[]],&quot;roles&quot;:[1,[[0,&quot;Customer&quot;],[0,&quot;Staff&quot;],[0,&quot;Observer&quot;]]],&quot;roleCards&quot;:[1,[]],&quot;meta&quot;:[0,{&quot;blockType&quot;:[0,&quot;summary_block&quot;],&quot;audioStartSec&quot;:[0,614.32]}]}],[0,{&quot;id&quot;:[0,&quot;roleplay-giving-clear-feedback-at-work&quot;],&quot;type&quot;:[0,&quot;roleplay&quot;],&quot;title&quot;:[0,&quot;Roleplay: Giving Clear Feedback at Work&quot;],&quot;prompt&quot;:[0,&quot;Practice this situation: Giving Clear Feedback at Work.&quot;],&quot;support&quot;:[1,[]],&quot;source&quot;:[0,&quot;practical material&quot;],&quot;answer&quot;:[0,&quot;&quot;],&quot;choices&quot;:[1,[]],&quot;roles&quot;:[1,[[0,&quot;Customer&quot;],[0,&quot;Staff&quot;],[0,&quot;Observer&quot;]]],&quot;roleCards&quot;:[1,[]],&quot;meta&quot;:[0,{}]}],[0,{&quot;id&quot;:[0,&quot;open-authored-reading-question-1&quot;],&quot;type&quot;:[0,&quot;open&quot;],&quot;title&quot;:[0,&quot;Open question 1&quot;],&quot;prompt&quot;:[0,&quot;What are the three parts of clear feedback mentioned in this section?&quot;],&quot;support&quot;:[1,[]],&quot;source&quot;:[0,&quot;Clear feedback explains a real behavior, result, or next step. It does not stay at the level of general praise or general criticism. For example, “Good job” may sound kind, but it does not tell the person what was good. “You are careless” may sound strong, but it attacks the person instead of helping them improve.&quot;],&quot;answer&quot;:[0,&quot;Clear feedback explains a real behavior, result, or next step.&quot;],&quot;choices&quot;:[1,[]],&quot;roles&quot;:[1,[[0,&quot;Customer&quot;],[0,&quot;Staff&quot;],[0,&quot;Observer&quot;]]],&quot;roleCards&quot;:[1,[]],&quot;meta&quot;:[0,{}]}],[0,{&quot;id&quot;:[0,&quot;open-authored-reading-question-2&quot;],&quot;type&quot;:[0,&quot;open&quot;],&quot;title&quot;:[0,&quot;Open question 2&quot;],&quot;prompt&quot;:[0,&quot;Why can vague feedback create more work later?&quot;],&quot;support&quot;:[1,[]],&quot;source&quot;:[0,&quot;Vague prais ards&quot;:[1,[]],&quot;meta&quot;:[0,{}]}],[0,{&quot;id&quot;:[0,&quot;quiz-in-this-lesson-what-does-observatio&quot;],&quot;type&quot;:[0,&quot;quiz&quot;],&quot;title&quot;:[0,&quot;Quiz 9&quot;],&quot;prompt&quot;:[0,&quot;In this lesson, what does \&quot;observation\&quot; mean?&quot;],&quot;support&quot;:[1,[]],&quot;source&quot;:[0,&quot;learningChecks&quot;],&quot;answer&quot;:[0,&quot;a fact about what was seen, heard, or read&quot;],&quot;choices&quot;:[1,[[0,&quot;a fact about what was seen, heard, or read&quot;],[0,&quot;an action a person did, not their personality&quot;],[0,&quot;the action to take after feedback&quot;],[0,&quot;a question asked after the first comment to understand more&quot;]]],&quot;roles&quot;:[1,[[0,&quot;Customer&quot;],[0,&quot;Staff&quot;],[0,&quot;Observer&quot;]]],&quot;roleCards&quot;:[1,[]],&quot;meta&quot;:[0,{}]}],[0,{&quot;id&quot;:[0,&quot;quiz-in-this-lesson-what-does-behavior-m&quot;],&quot;type&quot;:[0,&quot;quiz&quot;],&quot;title&quot;:[0,&quot;Quiz 10&quot;],&quot;prompt&quot;:[0,&quot;In this lesson, what does \&quot;behavior\&quot; mean?&quot;],&quot;support&quot;:[1,[]],&quot;source&quot;:[0,&quot;learningChecks&quot;],&quot;answer&quot;:[0,&quot;an action a person did, not their personality&quot;],&quot;choices&quot;:[1,[[0,&quot;an action a person did, not their personality&quot;],[0,&quot;a fact about what was seen, heard, or read&quot;],[0,&quot;the action to take after feedback&quot;],[0,&quot;a question asked after the first comment to understand more&quot;]]],&quot;roles&quot;:[1,[[0,&quot;Customer&quot;],[0,&quot;Staff&quot;],[0,&quot;Observer&quot;]]],&quot;roleCards&quot;:[1,[]],&quot;meta&quot;:[0,{}]}]]]}],[0,{&quot;id&quot;:[0,&quot;episode-2026-07-08-choosing-useful-technology&quot;],&quot;slug&quot;:[0,&quot;2026-07-08-choosing-useful-technology&quot;],&quot;title&quot;:[0,&quot;Choosing Useful Technology&quot;],&quot;level&quot;:[0,&quot;B1&quot;],&quot;topic&quot;:[0,&quot;choosing useful technology&quot;],&quot;summary&quot;:[0,&quot;Technology is not useful just because it is new or popular. A useful tool solves a real problem in a simple way. It may save time, reduce stress, help you study, or support your work.&quot;],&quot;lessonFormat&quot;:[0,&quot;reading_discussion&quot;],&quot;materialSections&quot;:[1,[[0,&quot;Technology is not useful just because it is new or popular. A useful tool solves a real problem in a simple way. It may save time, reduce stress, help you study, or support your work. But every tool also has a cost: money, attention, learning time, privacy risk, or maintenance. Choosing useful technology means looking at both the benefit and the trade-off.&quot;],[0,&quot;Warm-up: What technology do you use every day? Which tool or app saves you the most time? Have you ever bought or downloaded something useful at first, but later stopped using it? When do you think technology becomes a distraction instead of a help?&quot;],[0,&quot;The best first question is simple: what problem am I trying to solve?&quot;],[0,&quot;A student may need a calendar app to remember deadlines. A worker may need a file-sharing tool to send documents quickly. A parent may want a map app that gives clear directions. If the technology does not solve a real problem, it is probably not necessary. Many people buy tools because they look modern, not because they help with daily life.&quot;],[0,&quot;A useful technology is often small and practical. It does one job well. For example, a notes app may be more useful than a large app with many extra features if all you need is quick writing and easy search.&quot;],[0,&quot;Real-life anchors:&quot;],[0,&quot;- Google Maps is widely used because it shows directions clearly and helps people avoid getting lost.&quot;],[0,&quot;- WhatsApp is useful for many people because it sends messages quickly and works for everyday communication.&quot;],[0,&quot;- A simple calendar app can be more useful than a complicated planner if the user only needs reminders and deadlines.&quot;],[0,&quot;What this shows: the value of technology is often about solving one clear problem, not doing everything.&quot;]]],&quot;activities&quot;:[1,[[0,{&quot;id&quot;:[0,&quot;focus-authored-reading-introduction&quot;],&quot;type&quot;:[0,&quot;focus&quot;],&quot;title&quot;:[0,&quot;Introduction&quot;],&quot;prompt&quot;:[0,&quot;Technology is not useful just because it is new or popular. A useful tool solves a real problem in a simple way. It may save time, reduce stress, help you study, or support your work. But every tool also has a cost: money, attention, learning time, privacy risk, or maintenance. Choosing useful technology means looking at both the benefit and the trade-off.&quot;],&quot;support&quot;:[1,[]],&quot;source&quot;:[0,&quot;OPENING&quot;],&quot;answer&quot;:[0,&quot;&quot;],&quot;choices&quot;:[1,[]],&quot;roles&quot;:[1,[[0,&quot;Customer&quot;],[0,&quot;Staff&quot;],[0,&quot;Observer&quot;]]],&quot;roleCards&quot;:[1,[]],&quot;meta&quot;:[0,{&quot;blockType&quot;:[0,&quot;authored_intro&quot;],&quot;audioStartSec&quot;:[0,0]}]}],[0,{&quot;id&quot;:[0,&quot;focus-authored-reading-warmup&quot;],&quot;type&quot;:[0,&quot;focus&quot;],&quot;title&quot;:[0,&quot;Warm-Up Questions&quot;],&quot;prompt&quot;:[0,&quot;What technology do you use every day? Which tool or app saves you the most time? Have you ever bought or downloaded something useful at first, but later stopped using it?&quot;],&quot;support&quot;:[1,[[0,&quot;What technology do you use every day?&quot;],[0,&quot;Which tool or app saves you the most time?&quot;],[0,&quot;Have you ever bought or downloaded something useful at first, but later stopped using it?&quot;],[0,&quot;When do you think technology becomes a distraction instead of a help?&quot;]]],&quot;source&quot;:[0,&quot;OPENING&quot;],&quot;answer&quot;:[0,&quot;&quot;],&quot;choices&quot;:[1,[]],&quot;roles&quot;:[1,[[0,&quot;Customer&quot;],[0,&quot;Staff&quot;],[0,&quot;Observer&quot;]]],&quot;roleCards&quot;:[1,[]],&quot;meta&quot;:[0,{&quot;blockType&quot;:[0,&quot;authored_intro&quot;],&quot;audioStartSec&quot;:[0,25.06]}]}],[0,{&quot;id&quot;:[0,&quot;focus-authored-reading-section-1&quot;],&quot;type&quot;:[0,&quot;focus&quot;],&quot;title&quot;:[0,&quot;1. Start with the real problem&quot;],&quot;prompt&quot;:[0,&quot;The best first question is simple: what problem am I trying to solve? A student may need a calendar app to remember deadlines. A worker may need a file-sharing tool to send documents quickly. A parent may want a map app that gives clear directions. If the technology does not solve a real problem, it is probably not necessary. Many people buy tools because they look modern, not because they help with daily life. A useful technology is often small and practical. It does one job well. For example, a notes app may be more useful than a large app with many extra features if all you need is quick writing and easy search. Real-life anchors: - Google Maps is widely used because it shows directions clearly and helps people avoid getting lost. - WhatsApp is useful for many people because it sends messages quickly and works for everyday communication. - A simple calendar app can be more useful than a complicated planner if the user only needs reminders and deadlines. What this shows: the value of technology is often about solving one clear problem, not doing everything.&quot;],&quot;support&quot;:[1,[]],&quot;source&quot;:[0,&quot;NEWS STORY&quot;],&quot;answer&quot;:[0,&quot;&quot;],&quot;choices&quot;:[1,[]],&quot;roles&quot;:[1,[[0,&quot;Customer&quot;],[0,&quot;Staff&quot;],[0,&quot;Observer&quot;]]],&quot;roleCards&quot;:[1,[]],&quot;meta&quot;:[0,{&quot;blockType&quot;:[0,&quot;authored_context&quot;],&quot;audioStartSec&quot;:[0,40.9]}]}],[0,{&quot;id&quot;:[0,&quot;focus-authored-reading-section-2&quot;],&quot;type&quot;:[0,&quot;focus&quot;],&quot;title&quot;:[0,&quot;2. Time saved is not always time well spent&quot;],&quot;prompt&quot;:[0,&quot;Many people choose technology because it saves time. That can be true, but time saving is only useful if the tool is actually easier than the old method. For example, automatic reminders can help people remember meetings or homework. Cloud storage can make it faster to find files from different devices. A scanner app can save time when you need to copy a paper document. These tools are useful because they remove small daily problems. However, some technology saves only a little time but creates more work later. A tool may need updates, account settings, new passwords, or constant checking. If the tool is complicated, the time saved may disappear. It is also possible to spend time learning a tool that you only use once a month. A good choice is often the one that gives the biggest practical benefit with the least extra effort.&quot;],&quot;support&quot;:[1,[]],&quot;source&quot;:[0,&quot;NEWS STORY&quot;],&quot;answer&quot;:[0,&quot;&quot;],&quot;choices&quot;:[1,[]],&quot;roles&quot;:[1,[[0,&quot;Customer&quot;],[0,&quot;Staff&quot;],[0,&quot;Observer&quot;]]],&quot;roleCards&quot;:[1,[]],&quot;meta&quot;:[0,{&quot;blockType&quot;:[0,&quot;authored_context&quot;],&quot;audioStartSec&quot;:[0,112.98]}]}],[0,{&quot;id&quot;:[0,&quot;focus-authored-reading-section-3&quot;],&quot;type&quot;:[0,&quot;focus&quot;],&quot;title&quot;:[0,&quot;3. Too many notifications can make a tool less useful&quot;],&quot;prompt&quot;:[0,&quot;Some technology helps people stay connected, but it can also steal attention. Notifications are a good example. A phone can be helpful when it gives important messages, but too many alerts can break concentration. This is a real problem for students, workers, and anyone who needs to focus. A useful tool should support your attention, not destroy it. Sometimes this means turning off unnecessary notifications, using silent mode, or choosing an app with better control settings. A tool is not useful if it makes you check your screen every few minutes. This is why some people prefer simple tools over “smart” ones. A basic device may do fewer things, but it can be easier to use and less distracting. Choosing useful technology is often about knowing when less is better. Real-life anchors: - Many phones allow notification settings because people need control over interruptions. - Headspace is one example of an app made to support focus and mental calm, showing that technology can help attention when designed carefully. - Do Not Disturb mode is a simple phone feature that shows how small settings can improve daily focus. What this shows: useful technology protects your attention, not just your convenience.&quot;],&quot;support&quot;:[1,[]],&quot;source&quot;:[0,&quot;NEWS STORY&quot;],&quot;answer&quot;:[0,&quot;&quot;],&quot;choices&quot;:[1,[]],&quot;roles&quot;:[1,[[0,&quot;Customer&quot;],[0,&quot;Staff&quot;],[0,&quot;Observer&quot;]]],&quot;roleCards&quot;:[1,[]],&quot;meta&quot;:[0,{&quot;blockType&quot;:[0,&quot;authored_context&quot;],&quot;audioStartSec&quot;:[0,171.2]}]}],[0,{&quot;id&quot;:[0,&quot;focus-authored-reading-section-4&quot;],&quot;type&quot;:[0,&quot;focus&quot;],&quot;title&quot;:[0,&quot;4. Cost matters, especially over time&quot;],&quot;prompt&quot;:[0,&quot;When people compare technology, they often think only about the first price. But cost is more than the amount you pay today. Some apps are free at first and then ask for a monthly subscription. Some tools need new parts, repairs, or upgrades. Others may be cheap now but expensive to keep using. This is important because a useful tool should be worth its total cost. A paid app subscription may be a good choice if it truly helps with work, study, or a business. But if the app does only one small thing that you barely use, the money may not be worth it. The same idea applies to hardware. A cheap device that breaks quickly can be more expensive in the long run than a stronger one that lasts longer. Useful technology is not always the cheapest option, but it should give clear value for the money.&quot;],&quot;support&quot;:[1,[]],&quot;source&quot;:[0,&quot;NEWS STORY&quot;],&quot;answer&quot;:[0,&quot;&quot;],&quot;choices&quot;:[1,[]],&quot;roles&quot;:[1,[[0,&quot;Customer&quot;],[0,&quot;Staff&quot;],[0,&quot;Observer&quot;]]],&quot;roleCards&quot;:[1,[]],&quot;meta&quot;:[0,{&quot;blockType&quot;:[0,&quot;authored_context&quot;],&quot;audioStartSec&quot;:[0,253.84]}]}],[0,{&quot;id&quot;:[0,&quot;focus-authored-reading-section-5&quot;],&quot;type&quot;:[0,&quot;focus&quot;],&quot;title&quot;:[0,&quot;5. Privacy and trust are part of usefulness&quot;],&quot;prompt&quot;:[0,&quot;A technology can be very convenient and still be a bad choice if it creates privacy problems. Many apps and devices collect personal data. Users may not always know what is being collected or how it is used. For this reason, trust matters. A useful tool should feel safe enough for everyday use. Before choosing a service, many people ask practical questions: Does it ask for too much personal information? Can I control my settings? Do I understand what I am sharing? If the answer is no, the technology may not be as useful as it seems. This does not mean people must avoid all digital tools. It means they should choose with care. A tool that protects your privacy can be more useful in the long term than one that looks exciting but feels risky. Real-life anchors: - Signal is known for privacy-focused messaging, which shows that some tools are designed with trust in mind. - Many browsers offer privacy settings and cookie controls, showing that users often want more control over data. - Password managers are useful because they can improve security while reducing the stress of remembering many passwords. What this shows: usefulness includes safety and trust, not only speed.&quot;],&quot;support&quot;:[1,[]],&quot;source&quot;:[0,&quot;NEWS STORY&quot;],&quot;answer&quot;:[0,&quot;&quot;],&quot;choices&quot;:[1,[]],&quot;roles&quot;:[1,[[0,&quot;Customer&quot;],[0,&quot;Staff&quot;],[0,&quot;Observer&quot;]]],&quot;roleCards&quot;:[1,[]],&quot;meta&quot;:[0,{&quot;blockType&quot;:[0,&quot;authored_context&quot;],&quot;audioStartSec&quot;:[0,313.14]}]}],[0,{&quot;id&quot;:[0,&quot;focus-authored-reading-section-6&quot;],&quot;type&quot;:[0,&quot;focus&quot;],&quot;title&quot;:[0,&quot;6. Learning curve and maintenance can affect the choice&quot;],&quot;prompt&quot;:[0,&quot;Some technology looks useful but takes too long to learn. This is called a learning curve. If a tool is complicated, people may not use it well or may give up too soon. For daily life, simple design is often valuable because it makes the tool easier to use right away. Maintenance matters too. Some tools need regular charging, updates, cleaning, backups, or repairs. If a device or app creates too many small jobs, it may become annoying. A useful tool should reduce problems, not add new ones. This is why people often replace technology that has become more trouble than help. For example, a phone with a bad battery may cause constant stress. A work tool that crashes often may waste more time than it saves. In these cases, replacing the tool can be a practical decision, not a wasteful one.&quot;],&quot;support&quot;:[1,[]],&quot;source&quot;:[0,&quot;NEWS STORY&quot;],&quot;answer&quot;:[0,&quot;&quot;],&quot;choices&quot;:[1,[]],&quot;roles&quot;:[1,[[0,&quot;Customer&quot;],[0,&quot;Staff&quot;],[0,&quot;Observer&quot;]]],&quot;roleCards&quot;:[1,[]],&quot;meta&quot;:[0,{&quot;blockType&quot;:[0,&quot;authored_context&quot;],&quot;audioStartSec&quot;:[0,393.88]}]}],[0,{&quot;id&quot;:[0,&quot;focus-authored-reading-section-7&quot;],&quot;type&quot;:[0,&quot;focus&quot;],&quot;title&quot;:[0,&quot;7. Choose what fits your real life&quot;],&quot;prompt&quot;:[0,&quot;Useful technology is personal. The best choice for one person may not be the best choice for another. A student, a teacher, a freelancer, and a parent may all need different tools. That is why it helps to compare options based on real use, not just advertisements or trends. A good final check is to ask: will this tool help me often enough to matter? If the answer is yes, the tool may be worth it. If the answer is no, it may be better to keep things simple. This way of thinking is practical and honest. It helps people use technology with purpose instead of just collecting more apps, devices, and subscriptions.&quot;],&quot;support&quot;:[1,[]],&quot;source&quot;:[0,&quot;NEWS STORY&quot;],&quot;answer&quot;:[0,&quot;&quot;],&quot;choices&quot;:[1,[]],&quot;roles&quot;:[1,[[0,&quot;Customer&quot;],[0,&quot;Staff&quot;],[0,&quot;Observer&quot;]]],&quot;roleCards&quot;:[1,[]],&quot;meta&quot;:[0,{&quot;blockType&quot;:[0,&quot;authored_context&quot;],&quot;audioStartSec&quot;:[0,450.2]}]}],[0,{&quot;id&quot;:[0,&quot;focus-authored-reading-final-reflection&quot;],&quot;type&quot;:[0,&quot;focus&quot;],&quot;title&quot;:[0,&quot;Final Reflection&quot;],&quot;prompt&quot;:[0,&quot;Choose one technology you use now, such as a phone feature, an app, or a work tool. Give a clear judgment: is it useful for you or not? Explain your reason using at least two points from the lesson, such as time saved, distraction, cost, privacy, learning curve, or maintenance. Example of a real learner output: This calendar app is useful for me because it helps me remember deadlines and appointments. It is also simple to use, so I do not waste time learning it. I would keep it because it solves a real problem in my daily life.&quot;],&quot;support&quot;:[1,[]],&quot;source&quot;:[0,&quot;CLOSING&quot;],&quot;answer&quot;:[0,&quot;&quot;],&quot;choices&quot;:[1,[]],&quot;roles&quot;:[1,[[0,&quot;Customer&quot;],[0,&quot;Staff&quot;],[0,&quot;Observer&quot;]]],&quot;roleCards&quot;:[1,[]],&quot;meta&quot;:[0,{&quot;blockType&quot;:[0,&quot;summary_block&quot;],&quot;audioStartSec&quot;:[0,561.38]}]}],[0,{&quot;id&quot;:[0,&quo akes attention away from work or study&quot;],[0,&quot;a message or alert from a phone or app&quot;]]],&quot;roles&quot;:[1,[[0,&quot;Customer&quot;],[0,&quot;Staff&quot;],[0,&quot;Observer&quot;]]],&quot;roleCards&quot;:[1,[]],&quot;meta&quot;:[0,{}]}]]]}],[0,{&quot;id&quot;:[0,&quot;episode-2026-07-07-luxembourg-castles-old-streets-wine-and-formula-1&quot;],&quot;slug&quot;:[0,&quot;2026-07-07-luxembourg-castles-old-streets-wine-and-formula-1&quot;],&quot;title&quot;:[0,&quot;Luxembourg: Castles, Old Streets, Wine, and Formula 1&quot;],&quot;level&quot;:[0,&quot;B2&quot;],&quot;topic&quot;:[0,&quot;Luxembourg: Castles, Old Streets, Wine, and Formula 1&quot;],&quot;summary&quot;:[0,&quot;Explain how Luxembourg connects fortress history, old streets, castle culture, Moselle wine, and a nearby Formula 1 race, and use those contrasts to discuss travel with deeper knowledge.&quot;],&quot;lessonFormat&quot;:[0,&quot;reading_discussion&quot;],&quot;materialSections&quot;:[1,[[0,&quot;Explain how Luxembourg connects fortress history, old streets, castle culture, Moselle wine, and a nearby Formula 1 race, and use those contrasts to discuss travel with deeper knowledge.&quot;],[0,&quot;Luxembourg is small, but it does not feel simple. In this lesson, we connect old fortress streets, castles, local wine, and a nearby Formula 1 race at Spa-Francorchamps. The goal is not to memorize tourist facts. The goal is to understand why one trip can feel quiet, elegant, historical, and suddenly very fast.&quot;],[0,&quot;Warm-up: When you travel, do you prefer famous places or smaller places with a hidden feeling? What makes a city memorable for you: views, history, food and drink, people, or atmosphere? Would you enjoy mixing slow sightseeing with a loud sport event in the same trip?&quot;],[0,&quot;Luxembourg sits between France, Belgium, and Germany. That position helps explain why the country feels international. Luxembourgish, French, German, and English can appear in different situations, and the country often feels like a meeting point rather than a simple national story.&quot;],[0,&quot;The interesting thing is the contrast. Luxembourg has medieval streets, stone bridges, river valleys, castles, and vineyards. It is also a financial center and a place connected with European institutions and international business. A visitor can feel both the old borderland and the modern European capital in the same day.&quot;],[0,&quot;This makes Luxembourg useful for travel English because it is not only a checklist destination. It rewards careful attention. You need to notice layers: language, geography, history, money, politics, wine, and quiet local pride.&quot;],[0,&quot;Luxembourg City is not a flat capital that you understand from one street. It is built around cliffs, valleys, bridges, upper areas, and lower riverside districts such as Grund. This geography helped make the city naturally defensive.&quot;],[0,&quot;UNESCO describes Luxembourg as one of Europe&#39;s great fortified sites from the 16th century until 1867, when many walls were dismantled. Different European powers reinforced the fortress over several centuries. That is why the old quarters and fortifications matter: they are not just pretty old stones. They are evidence of a city shaped by strategy.&quot;],[0,&quot;For a traveller, this changes the walk. You move from viewpoints to bridges, from high streets down toward the Alzette valley, and from open views into narrow passages. The city feels almost theatrical, as if stone, water, height, and history are building the scene together.&quot;],[0,&quot;The Bock Casemates are underground defensive tunnels built into the rock below the old city. The Bock Promontory is also connected with the origin story of Luxembourg City, because Count Sigfried built a castle there in 963. Later, the fortress system became one reason the city was called the \&quot;Gibraltar of the North.\&quot;&quot;]]],&quot;activities&quot;:[1,[[0,{&quot;id&quot;:[0
