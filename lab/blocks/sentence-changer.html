<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sentence changer</title>
<style>
  :root { --ink:#102c37; --soft:rgba(18,49,63,.68); --page:#f6f7f1; --surface:#fff; --mint:#2aa99a; --mint-soft:#e3f4f1; --amber:#d57932; --amber-soft:#fbeadb; --line:rgba(16,44,55,.12); --blue:#3d6fb6; --blue-soft:#e6eef9; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; color: var(--ink); font: 17px/1.5 "Source Sans 3", system-ui, -apple-system, "Hiragino Sans", sans-serif; letter-spacing: 0; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 20px; box-shadow: 0 6px 24px rgba(16,44,55,.06); }
  h2 { font-size: 1.05rem; margin: 0 0 2px; }
  .hint { color: var(--soft); margin: 0 0 16px; font-size: .95rem; }
  .row { margin: 0 0 12px; }
  .label { font-size: .8rem; font-weight: 600; color: var(--soft); text-transform: uppercase; margin-bottom: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  button.chip { appearance: none; border: 1px solid var(--line); background: var(--page); color: var(--ink); border-radius: 999px; min-height: 44px; padding: 8px 16px; font: inherit; font-size: 1rem; cursor: pointer; transition: background 150ms ease, border-color 150ms ease, transform 150ms ease; touch-action: manipulation; }
  button.chip:hover { border-color: var(--mint); }
  button.chip[aria-pressed="true"] { background: var(--mint-soft); border-color: var(--mint); font-weight: 600; }
  button.chip:active { transform: scale(.97); }
  button.chip:focus-visible { outline: 3px solid var(--mint); outline-offset: 2px; }
  .stage { margin: 18px 0 8px; padding: 22px 12px; border-radius: 14px; background: var(--page); min-height: 112px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
  .sentence { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 10px; font-size: clamp(1.4rem, 5vw, 2rem); font-weight: 600; }
  .tok { padding: 2px 10px; border-radius: 10px; position: relative; transition: background 150ms ease; }
  .tok.subject { background: var(--blue-soft); color: #234a80; }
  .tok.helper { background: var(--amber-soft); color: #8a4413; }
  .tok.verb { background: var(--mint-soft); color: #136b60; }
  .tok.rest, .tok.mark { padding-left: 0; padding-right: 0; }
  .tok.mark { margin-left: -10px; }
  .s-end { color: var(--amber); text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: 5px; }
  .fly { position: absolute; z-index: 2; font-weight: 700; color: #fff; background: var(--amber); border-radius: 999px; padding: 0 10px; font-size: 1.1rem; pointer-events: none; box-shadow: 0 4px 12px rgba(213,121,50,.4); }
  .why { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); font-size: 1rem; min-height: 52px; }
  .why b { color: #8a4413; }
  .lang { margin-left: auto; white-space: nowrap; flex: none; }
  .top { display: flex; align-items: flex-start; gap: 12px; }
  .done { margin-top: 10px; font-size: .9rem; color: #136b60; min-height: 1.4em; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

  .check { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 16px; }
  .check h3 { font-size: 1rem; margin: 0 0 8px; }
  .q { font-size: clamp(1.2rem, 4.5vw, 1.6rem); font-weight: 600; margin: 4px 0 12px; }
  .q .gap { display: inline-block; min-width: 3.2em; border-bottom: 3px solid var(--mint); text-align: center; color: #136b60; }
  button.chip.right { background: var(--mint-soft); border-color: var(--mint); }
  button.chip.wrong { background: var(--amber-soft); border-color: var(--amber); }
  .fb { min-height: 1.5em; margin-top: 10px; font-size: 1rem; }
  .score { font-weight: 700; color: #136b60; }
</style>
</head>
<body>
<div class="card" id="app">
  <div class="top">
    <div><h2>Change the sentence</h2><p class="hint" id="hint">Pick who, what and how. Watch the -s.</p></div>
    <button class="chip lang" id="lang" aria-pressed="false" title="日本語の説明">日本語</button>
  </div>
  <div class="row"><div class="label" id="l-who">Who</div><div class="chips" id="who"></div></div>
  <div class="row"><div class="label" id="l-what">What</div><div class="chips" id="what"></div></div>
  <div class="row"><div class="label" id="l-how">How</div><div class="chips" id="how"></div></div>
  <div class="stage" id="stage" aria-live="polite"><div class="sentence" id="sentence"></div></div>
  <div class="why" id="why"></div>
  <div class="done" id="done"></div>
  <div class="check" id="check">
    <h3 id="check-title">Check yourself</h3>
    <div class="q" id="q"></div>
    <div class="chips" id="opts"></div>
    <div class="fb" id="fb" aria-live="polite"></div>
  </div>
</div>
<script src="sentence-engine.js"></script>
<script>
(() => {
  const E = window.SentenceEngine;
  const state = { subject: 'she', verb: 'have', form: 'positive', lang: 'en', tried: new Set() };
  const LABELS = { en: { who: 'Who', what: 'What', how: 'How', hint: 'Pick who, what and how. Watch the -s.', forms: { positive: 'Yes ✓', negative: 'Not ✗', question: 'Question ?' }, done: 'You found all three he/she forms. Great!' },
                   ja: { who: 'だれが', what: '何を', how: '形', hint: 'だれ・何・形を選んで、-s の動きを見よう。', forms: { positive: '肯定 ✓', negative: '否定 ✗', question: '疑問 ?' }, done: 'he / she の3つの形を見つけました！' } };
  const $ = (id) => document.getElementById(id);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  function chips(el, items, key, labelOf) {
    el.innerHTML = '';
    for (const item of items) {
      const b = document.createElement('button');
      b.className = 'chip'; b.type = 'button'; b.textContent = labelOf(item);
      b.setAttribute('aria-pressed', String(state[key] === item.id));
      b.addEventListener('click', () => { const before = render.lastRects(); state[key] = item.id; render(before); });
      el.appendChild(b);
    }
  }

  function tokenEl(t) {
    const span = document.createElement('span'); span.className = `tok ${t.role}`; span.dataset.role = t.role;
    const v = E.VERBS.find((x) => x.id === state.verb), s = E.SUBJECTS.find((x) => x.id === state.subject);
    // Show where the -s lives: at the end of the verb (has, goes, watches) or of does/doesn't.
    if (t.role === 'verb' && s.third && t.text === v.s) {
      const stem = v.id === 'have' ? 'ha' : v.id === 'study' ? 'stud' : v.base;
      span.innerHTML = `${stem}<span class="s-end">${t.text.slice(stem.length)}</span>`;
    } else if (t.role === 'helper' && /^does/i.test(t.text)) {
      span.innerHTML = `${t.text.slice(0, 2)}<span class="s-end">${t.text.slice(2, 4)}</span>${t.text.slice(4)}`;
    } else span.textContent = t.text;
    return span;
  }

  function render(before) {
    const L = LABELS[state.lang];
    $('l-who').textContent = L.who; $('l-what').textContent = L.what; $('l-how').textContent = L.how; $('hint').textContent = L.hint;
    $('lang').setAttribute('aria-pressed', String(state.lang === 'ja'));
    chips($('who'), E.SUBJECTS, 'subject', (s) => s.text);
    chips($('what'), E.VERBS, 'verb', (v) => `${v.emoji} ${v.base}`);
    chips($('how'), E.FORMS.map((id) => ({ id })), 'form', (f) => L.forms[f.id]);
    const tokens = E.build(state.subject, state.verb, state.form);
    const box = $('sentence'); box.innerHTML = '';
    tokens.forEach((t) => box.appendChild(tokenEl(t)));
    $('why').innerHTML = `<span aria-hidden="true">💡</span><span>${E.explain(state.subject, state.verb, state.form, state.lang).replace(/(-s\b|\b[Dd]oes\b|\bdo\b|→\s*[a-z]+)/g, '<b>$1</b>')}</span>`;
    const third = E.SUBJECTS.find((x) => x.id === state.subject).third;
    if (third) state.tried.add(state.form);
    $('done').textContent = state.tried.size === 3 ? L.done : '';
    if (state.tried.size === 3 && !render.reported) { render.reported = true; post({ type: 'ovi-block:finished', score: null }); }
    if (before && !reduce) flyS(before);
    post({ type: 'ovi-block:resize', height: document.documentElement.scrollHeight });
  }

  // Where the -s sat before the change, so it can fly to where it sits now.
  render.lastRects = () => {
    const s = document.querySelector('#sentence .s-end'), stage = $('stage').getBoundingClientRect();
    return s ? { rect: s.getBoundingClientRect(), stage } : null;
  };
  function flyS(before) {
    const now = document.querySelector('#sentence .s-end');
    if (!before || !now) return;
    const to = now.getBoundingClientRect(), stage = $('stage').getBoundingClientRect();
    if (Math.abs(to.left - before.rect.left) < 4 && Math.abs(to.top - before.rect.top) < 4) return;
    const chip = document.createElement('div'); chip.className = 'fly'; chip.textContent = '-s';
    $('stage').appendChild(chip);
    const from = { x: before.rect.left - stage.left, y: before.rect.top - stage.top - 30 }, end = { x: to.left - stage.left, y: to.top - stage.top - 30 };
    chip.animate([{ transform: `translate(${from.x}px, ${from.y}px)`, opacity: 1 }, { transform: `translate(${(from.x + end.x) / 2}px, ${Math.min(from.y, end.y) - 26}px)`, opacity: 1 }, { transform: `translate(${end.x}px, ${end.y}px)`, opacity: 0 }], { duration: 700, easing: 'cubic-bezier(.3,.7,.3,1)' }).onfinish = () => chip.remove();
  }

  // The only messages a block sends its page: its height and that it is finished. Nothing else, no student data.
  function post(msg) { if (window.parent !== window) window.parent.postMessage({ ...msg, block: 'sentence-changer', v: 1 }, '*'); }
  $('lang').addEventListener('click', () => { state.lang = state.lang === 'en' ? 'ja' : 'en'; render(); });
  new ResizeObserver(() => post({ type: 'ovi-block:resize', height: document.documentElement.scrollHeight })).observe(document.body);
  render();
})();
</script>

<script>
(() => {
  // Check yourself: four quick questions on the same idea; a wrong answer explains and lets the student try again.
  const Q = [
    { q: 'She ___ a cat.', opts: ['has', 'have'], a: 'has', why: 'With she, the verb gets -s: has.', ja: 'she のときは -s がつく：has' },
    { q: '___ he play soccer?', opts: ['Does', 'Do'], a: 'Does', why: 'With he, the question starts with Does.', ja: 'he の疑問文は Does で始める' },
    { q: "She doesn't ___ to school.", opts: ['go', 'goes'], a: 'go', why: "doesn't already has the -s, so the verb is go.", ja: "doesn't が -s を持っているので go" },
    { q: "They ___ like TV.", opts: ["don't", "doesn't"], a: "don't", why: "With they, use don't (no -s).", ja: "they のときは don't" },
  ];
  const $ = (id) => document.getElementById(id);
  let i = 0, firstTry = 0, missed = false;
  const ja = () => document.getElementById('lang').getAttribute('aria-pressed') === 'true';
  function show() {
    const item = Q[i]; missed = false;
    $('check-title').textContent = ja() ? `確認しよう (${i + 1}/${Q.length})` : `Check yourself (${i + 1}/${Q.length})`;
    $('q').innerHTML = item.q.replace('___', '<span class="gap">?</span>');
    $('fb').textContent = '';
    const box = $('opts'); box.innerHTML = '';
    for (const o of item.opts) {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = o;
      b.addEventListener('click', () => answer(b, o)); box.appendChild(b);
    }
  }
  function answer(b, o) {
    const item = Q[i];
    if (o === item.a) {
      b.classList.add('right'); if (!missed) firstTry++;
      $('q').innerHTML = item.q.replace('___', `<span class="gap">${o}</span>`);
      $('fb').textContent = ja() ? '正解！' : 'Right!';
      setTimeout(() => { i++; if (i < Q.length) show(); else finish(); }, 900);
    } else { b.classList.add('wrong'); missed = true; $('fb').textContent = ja() ? item.ja : item.why; }
  }
  function finish() {
    $('q').textContent = ''; $('opts').innerHTML = '';
    $('fb').innerHTML = `<span class="score">${firstTry}/${Q.length}</span> ${ja() ? '一回目で正解' : 'right on the first try'}`;
    if (window.parent !== window) window.parent.postMessage({ type: 'ovi-block:finished', block: 'sentence-changer', v: 1, score: firstTry, of: Q.length }, '*');
  }
  show();
})();
</script>
</body>
</html>
