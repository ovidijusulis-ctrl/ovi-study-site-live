        } catch (_err) {

        }

  }

  .v2-check-answer {

  .v2-question-list p,

  .v2-vocab-row dt,

  .v2-vocab-row dt {

  .v2-dialogue-speaker {

  }

    gap: 8px;
    margin: -1px 0 14px;
    padding: 11px 12px;

    background: rgba(255, 255, 255, 0.66);

    gap: 8px;

    gap: 7px;
    min-height: 42px;
    padding: 8px 12px;
    border: 1px solid rgba(36, 127, 138, 0.28);
    border-radius: 999px;
    background: white;
    color: var(--ovi-navy);

    font-size: 0.88rem;
    font-weight: 700;

    background: rgba(36, 127, 138, 0.08);

    border-color: var(--ovi-teal-deep);
    background: rgba(36, 127, 138, 0.12);
  }

  .v2-roleplay-track:focus-visible {
    outline: 3px solid var(--ovi-teal);

  }

  .v2-roleplay-error {

    font-size: 0.88rem;

  .v2-dialogue-line-play {

    inset-inline-end: 0;

  /* V2-native block projection using the established Ovi article rhythm. */

  .v2-popup-word,
