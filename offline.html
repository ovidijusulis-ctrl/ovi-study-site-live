<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f2ea" />
    <title>Offline | Ovi English School</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #fff7f2;
        color: #2d221d;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(560px, 100%);
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 8vw, 4rem);
        line-height: 0.98;
        letter-spacing: 0;
      }

      p {
        margin: 0 0 22px;
        color: #5f5249;
        font-size: 1rem;
        line-height: 1.6;
      }

      a {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        border: 1px solid rgba(36, 127, 138, 0.22);
        border-radius: 999px;
        padding: 0 18px;
        background: #ffffff;
        color: #1f4f55;
        font-weight: 800;
        text-decoration: none;
        box-shadow: 0 14px 34px rgba(59, 35, 21, 0.1);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline.</h1>
      <p>Previously opened lessons may still work. Reconnect to load new audio, images, account pages, and fresh lesson updates.</p>
      <a href="/episodes/">Open lesson archive</a>
    </main>
  </body>
</html>
