      (() => {
        const STORAGE_KEY = "ovi-assist-language";
        const COOKIE_KEY = "ovi-assist-language";
        const ALLOWED = ["en", "ja", "es"];
        const normalizeLanguage = (value) => {
          const language = String(value || "").trim().toLowerCase();
          return ALLOWED.includes(language) ? language : "en";
        };
        const readCookieLanguage = () => {
          const match = document.cookie.match(new RegExp(`(?:^|; )${COOKIE_KEY}=([^;]+)`));
          if (!match) return "";
          try {
            return normalizeLanguage(decodeURIComponent(match[1]));
          } catch (_err) {
            return normalizeLanguage(match[1]);
          }
        };
        const detectAssistLanguage = () => {
          try {
            const preferred = [
              ...(Array.isArray(navigator.languages) ? navigator.languages : []),
              navigator.language,
              navigator.userLanguage,
            ]
              .map((value) => String(value || "").trim().toLowerCase())
              .filter(Boolean);

            if (preferred.some((value) => value.startsWith("ja"))) return "ja";
            if (preferred.some((value) => value.startsWith("es"))) return "es";

            const timezone = String(Intl.DateTimeFormat().resolvedOptions().timeZone || "").toLowerCase();
            if (timezone === "asia/tokyo") return "ja";
            if (timezone === "europe/madrid" || timezone === "atlantic/canary") return "es";
          } catch (_err) {
            // ignore browser locale detection failures
          }
          return "en";
        };

        let language = "en";
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          language = saved ? normalizeLanguage(saved) : (readCookieLanguage() || detectAssistLanguage());
        } catch (_err) {
          language = readCookieLanguage() || detectAssistLanguage();
        }

        document.documentElement.dataset.assistLanguage = language;
      })();
